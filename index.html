function itemFront(it, extra){
  const d = it.g.userData.def; const r = it.rec.rot||0; const f = fpOf(d, 0);
  const dist = f[1]/2 + (extra||0.9);
  return new THREE.Vector3(it.g.position.x + Math.sin(r)*dist, 0, it.g.position.z + Math.cos(r)*dist);
}
function floatEmoji(em, pos){ const sp = emojiSprite(em, 0.8); sp.position.copy(pos); scene.add(sp); tween(1.4, k=>{ sp.position.y = pos.y + k*1.8; sp.material.opacity = 1-k; }, ()=>scene.remove(sp)); }
function actReward(act){
  const fx = ACT_FX[act]; if (!fx) return;
  S.day.acts = S.day.acts || {};
  const n = S.day.acts[act] = (S.day.acts[act]||0) + 1;
  if (n > 3){ bubble("That was fun! Let's try something new 😊"); return; }
  ['smart','fun','motor','social','energy'].forEach(k=>{ if (fx[k]) gain(k, fx[k]); });
  if (fx.art) S.profile.art += fx.art;
  if (fx.xp) addXP(fx.xp);
  bubble(pick(fx.say)); save();
}
function useItem(it){
  const d = it.g.userData.def, act = d.act; const c = it.g.position;
  if (!act){ bubble(pick(['So pretty! ✨','I love my room!', 'Nice!'])); petHappy(); return; }
  if (act==='lamp'){ it.g.traverse(m=>{ if (m.userData.lamp){ it.off = !it.off; m.material = new THREE.MeshBasicMaterial({color: it.off ? '#8a86a8' : '#fff2a8'}); } }); sfx('tap'); return; }
  if (act==='sleep'){ napOn(it); return; }
  const front = itemFront(it);
  const face = c.clone();
  const fx = ACT_FX[act];
  if (act==='rest'){
    runSeq([{walk:front},{wait:2.2, anim:'idle', start:()=>{ pet.pos.set(c.x, 0, c.z); pet.lift = d.seat||0.8; pet.dir = it.rec.rot||0; }, end:()=>{ pet.lift = 0; pet.pos.copy(front); }}], ()=>actReward(act)); return;
  }
  if (act==='bounce' || act==='pit' || act==='tent' || act==='ride'){
    runSeq([{walk:front},{wait: act==='tent'?2.4:3, anim: act==='ride'?'ride':'happy', start:()=>{ pet.pos.set(c.x, 0, c.z); pet.dir = it.rec.rot||0; if (act==='ride'){ it.rocking = true; } if (act==='tent'){ pet.P.root.visible = false; } sfx('jump'); },
      tick:(dt,k,t)=>{ if (act==='bounce'){ pet.lift = 0.6 + Math.abs(Math.sin(t*5))*2.6; it.g.traverse(m=>{ if (m.userData.mat) m.scale.y = 1 - Math.abs(Math.cos(t*5))*0.5; }); if (Math.sin(t*5) * Math.sin((t-dt)*5) < 0) sfx('jump'); }
        else if (act==='pit'){ pet.lift = 0.2 + Math.abs(Math.sin(t*4))*0.6; if (Math.random()<0.08) burst(c.clone().setY(0.8),'confetti',2); }
        else if (act==='ride'){ pet.lift = d.seat + (d.id==='rocket' ? Math.min(1,Math.sin(k*Math.PI)*2)*1.2 : 0); }
        else if (act==='tent' && k > 0.7 && !pet.P.root.visible){ pet.P.root.visible = true; burst(c.clone().setY(1.5),'heart',8); sfx('hi'); } },
      end:()=>{ pet.lift = 0; pet.P.root.visible = true; it.rocking = false; pet.pos.copy(front); }}], ()=>{ actReward(act); petHappy(); });
    return;
  }
  if (act==='slide'){
    const r = it.rec.rot||0; const fw = new THREE.Vector3(Math.sin(r),0,Math.cos(r));
    const top = c.clone().addScaledVector(fw, -1.2), bottom = c.clone().addScaledVector(fw, 2.0), back = c.clone().addScaledVector(fw, -2.3);
    runSeq([{walk:back},{wait:0.8, anim:'walk', tick:(dt,k)=>{ pet.pos.lerpVectors(back, top, k); pet.lift = 1.7*k; pet.dir = r; }},{wait:0.8, anim:'ride', start:()=>sfx('swish'), tick:(dt,k)=>{ pet.pos.lerpVectors(top, bottom, k*k); pet.lift = 1.7*(1-k*k); pet.dir = r; }}], ()=>{ pet.lift = 0; burst(pet.pos.clone().setY(1),'star',10); actReward(act); petHappy(); });
    return;
  }
  runSeq([{walk:front},{wait:2.4, anim: act==='tv'||act==='fish'||act==='stars'||act==='globe'||act==='read' ? 'idle':'work', face,
    start:()=>{
      if (act==='tv') it.tvOn = true;
      if (act==='globe' || act==='music') it.spinFast = true;
      if (act==='paint') paintEasel(it);
      if (act==='piano' || act==='music') playTune(act==='piano');
      if (act==='piano' || act==='music' || act==='drum'){ S.day.music = true; setTimeout(()=>comboCheck('band'), 2600); }
      if (act==='drum') for (let i=0;i<8;i++) setTimeout(()=>{ if (AC && S.settings.sound){ tone(i%2?160:90, AC.currentTime, 0.15, 'triangle', 0.4, null, 50); } }, i*260);
      if (act==='fish') burst(c.clone().setY(1.8),'bubble',12);
    },
    tick:(dt,k,t)=>{ if (Math.floor(t*2.5) !== Math.floor((t-dt)*2.5)) floatEmoji(fx.em, pet.pos.clone().setY(pet.P.height+0.4)); if (act==='drum') it.g.scale.setScalar(1 + Math.abs(Math.sin(t*12))*0.04); },
    end:()=>{ it.tvOn = false; it.spinFast = false; it.g.scale.setScalar(1); }}], ()=>actReward(act));
}
function playTune(piano){
  if (!AC || !S.settings.sound) return;
  const mel = piano ? [0,2,4,5,7,7,9,7,5,4,2,0] : [7,4,0,4,7,12,7,4];
  mel.forEach((n,i)=> tone(523*Math.pow(2,n/12), AC.currentTime + i*0.2, 0.25, piano?'triangle':'sine', 0.25));
}
function paintEasel(it){
  it.g.traverse(m=>{ if (m.userData.easel){ const tex = m.userData.easel; const c = tex.image, g = c.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0,0,128,128);
    const kind = ri(0,3);
    if (kind===0){ ['#ff5a5a','#ff9f5a','#ffd84d','#6fe3b5','#7fd3ff','#b18cff'].forEach((col,i)=>{ g.strokeStyle=col; g.lineWidth=7; g.beginPath(); g.arc(64,100,52-i*7,Math.PI,0); g.stroke(); }); }
    else if (kind===1){ g.fillStyle='#7fd3ff'; g.fillRect(0,0,128,80); g.fillStyle='#8fdc72'; g.fillRect(0,80,128,48); g.fillStyle='#ffd84d'; g.beginPath(); g.arc(100,25,14,0,7); g.fill(); g.fillStyle='#ff8fc7'; g.fillRect(30,55,34,30); g.fillStyle='#ff5a5a'; g.beginPath(); g.moveTo(26,55); g.lineTo(47,35); g.lineTo(68,55); g.fill(); }
    else if (kind===2){ for (let i=0;i<14;i++){ g.fillStyle = pick(['#ff5a5a','#ffd84d','#4f8dff','#6fe3b5','#ff8fc7','#b18cff']); g.beginPath(); g.arc(rnd(10,118), rnd(10,118), rnd(6,18), 0, 7); g.fill(); } }
    else { g.fillStyle = S.design.color; g.beginPath(); g.arc(64,64,38,0,7); g.fill(); g.fillStyle='#2b2a4c'; g.beginPath(); g.arc(50,58,5,0,7); g.arc(78,58,5,0,7); g.fill(); g.strokeStyle='#2b2a4c'; g.lineWidth=3; g.beginPath(); g.arc(64,70,10,0.2,Math.PI-0.2); g.stroke(); }
    tex.needsUpdate = true; } });

function ensureThumbR(){

function thumbFor(id){

function readJSON(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function writeJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

// ---------- network back-ends ----------
function LocalNet(code){
  const KEY = 'ppt.fam.' + code; const subs = {members:[], inbox:[], family:[]};
  const get = () => readJSON(KEY, {members:{}, inbox:{sister:{}, brother:{}}, family:{xp:0, garden:{stage:0, water:{}}}});
  const put = (st) => { writeJSON(KEY, st); fire(st); };
  const fire = (st) => { subs.members.forEach(f=>f(st.members||{})); subs.inbox.forEach(f=>f((st.inbox||{})[SLOT]||{})); subs.family.forEach(f=>f(st.family||{})); };
  window.addEventListener('storage', e=>{ if (e.key===KEY) fire(get()); });
  return {
    mode:'local', code,
    setMe(o){ const st = get(); st.members[SLOT] = o; put(st); },
    watchMembers(f){ subs.members.push(f); f(get().members||{}); },
    send(to, msg){ const st = get(); st.inbox[to] = st.inbox[to]||{}; st.inbox[to][Date.now().toString(36)+Math.random().toString(36).slice(2,6)] = msg; put(st); },
    watchInbox(f){ subs.inbox.push(f); f((get().inbox||{})[SLOT]||{}); },
    removeInbox(id){ const st = get(); if (st.inbox[SLOT]) delete st.inbox[SLOT][id]; put(st); },
    watchFamily(f){ subs.family.push(f); f(get().family||{}); },
    changeFamily(fn){ const st = get(); st.family = fn(st.family||{xp:0, garden:{stage:0, water:{}}}); put(st); return Promise.resolve(st.family); },
    status(){ return 'local'; }
  };
}
function FireNet(code){
  const db = firebase.database(); const root = db.ref('families/' + code);
  let connected = false; db.ref('.info/connected').on('value', s=>{ connected = !!s.val(); });
  const clean = o => JSON.parse(JSON.stringify(o));
  root.child('members/' + SLOT + '/playing').onDisconnect().set(false);
  return {
    mode:'firebase', code,
    setMe(o){ root.child('members/' + SLOT).set(clean(o)).catch(()=>{}); },
    watchMembers(f){ root.child('members').on('value', s=>f(s.val()||{})); },
    send(to, msg){ root.child('inbox/' + to).push(clean(msg)).catch(()=>{}); },
    watchInbox(f){ root.child('inbox/' + SLOT).on('value', s=>f(s.val()||{})); },
    removeInbox(id){ root.child('inbox/' + SLOT + '/' + id).remove().catch(()=>{}); },
    watchFamily(f){ root.child('family').on('value', s=>f(s.val()||{})); },
    changeFamily(fn){ return root.child('family').transaction(cur=>clean(fn(cur||{xp:0, garden:{stage:0, water:{}}}))).then(r=>r.snapshot.val()).catch(()=>null); },
    status(){ return connected ? 'online' : 'offline'; }
  };
}
function loadScript(src){ return new Promise((res, rej)=>{ const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function loadFirebase(){
  if (window.firebase && firebase.database) return true;
  const v = '10.12.2';
  for (const base of [`https://www.gstatic.com/firebasejs/${v}/`, `https://cdn.jsdelivr.net/npm/firebase@${v}/`]){
    try{ await loadScript(base + 'firebase-app-compat.js'); await loadScript(base + 'firebase-database-compat.js'); if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG); return true; }catch(e){}
  }
  return false;
}
const hasFirebase = () => !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && window.FIREBASE_CONFIG.databaseURL);
async function startNet(){
  FAM = readJSON('ppt.family', null);
  if (!FAM || FAM.mode==='off') { net = null; return; }
  if (FAM.mode==='firebase'){
    if (!hasFirebase() || !(await loadFirebase())){ toast('📶 Family link is offline right now — playing on your own.'); net = null; return; }
    net = FireNet(FAM.code);
  } else net = LocalNet(FAM.code);
  net.watchMembers(m=>{ const o = m[otherSlot()]; sib = o && o.design ? o : null; refreshSibling(); });
  net.watchInbox(onInbox);
  net.watchFamily(f=>{ famData = Object.assign({xp:0, garden:{stage:0, water:{}}}, f||{}); famData.garden = Object.assign({stage:0, water:{}}, famData.garden||{}); refreshGarden(); updateFamBadge(); });
  pubMe(true);
}

  const html = qs.length ? `<p style="font-weight:800;margin-top:0">These were tricky at school today. Ask ${sib?sib.name:'your sibling'} to help!</p>${qs.map((q,i)=>`<div class="card" style="align-items:stretch;text-align:left;margin-bottom:8px"><div class="nm">${q.q}</div><div class="row" style="justify-content:flex-start"><button class="btn mint" data-ask="${i}" ${q.asked?'disabled':''}>${q.asked?'Asked ✓':'📚 Ask for help'}</button></div></div>`).join('')}`
    : `<p style="font-weight:800;font-size:17px;text-align:center">No tricky questions today! 🎉<br>When you get a school question wrong, you can ask ${sib?sib.name:'your sibling'} for help here.</p>`;
  openModal('📚 Homework help', html, null, {pause:true});
  $('mBody').querySelectorAll('[data-ask]').forEach(b=> b.onclick = ()=>{ const q = qs[+b.dataset.ask]; if (!sendMsg('help', {q:q.q, a:q.a, opts:q.opts, lang:q.lang})) return; q.asked = true; famReward(2); save(); toast(`📚 Question sent to ${sib?sib.name:'your sibling'}!`); openAskHelp(); });
}
const TIPS = ['Read the question slowly 🐢','Count on your fingers ✋','Draw a picture to help 🎨','Check your answer again ✔️','You are getting better every day 💪'];
function openMailbox(){
  const list = inbox.filter(m=>m.type!=='bonus');
  const item = m => {
    const p = m.payload||{};
    if (m.type==='gift') return `<div class="card"><div class="em">🎁</div><div class="nm">${m.fromName} sent you ${p.label}</div><div class="row"><button class="btn mint" data-open="${m.id}">Open</button></div></div>`;
    if (m.type==='letter') return `<div class="card"><div class="em" style="font-size:54px">${p.em}</div><div class="nm">${p.text}</div><div class="ds">from ${m.fromName}</div><div class="row"><button class="btn mint" data-open="${m.id}">Thanks! 💖</button></div></div>`;
    if (m.type==='help') return `<div class="card" style="grid-column:1/-1;align-items:stretch"><div class="nm">📚 ${m.fromName} needs help:</div><div class="q" style="font-size:22px;min-height:0">${p.q}</div><div class="answers">${(p.opts||[]).map(o=>`<button class="ans" data-help="${m.id}" data-v="${encodeURIComponent(o)}">${o}</button>`).join('')}</div><div class="ds">Pick the right answer to help!</div></div>`;
    if (m.type==='answer') return `<div class="card" style="grid-column:1/-1"><div class="em">📚</div><div class="nm">${m.fromName} helped you!</div><div class="q" style="font-size:20px;min-height:0">${p.q}<br>Answer: <b>${p.a}</b></div><div class="ds">Tip: ${p.tip}</div><div class="row"><button class="btn mint" data-open="${m.id}">Thank you! 🧠</button></div></div>`;
    return '';
  };
  openModal('📬 Family mailbox', list.length ? `<div class="grid">${list.map(item).join('')}</div>` : `<p style="font-weight:800;font-size:18px;text-align:center">No mail yet. Send ${sib?sib.name:'your sibling'} a letter! 💌</p>`, null, {pause:true});
  $('mBody').querySelectorAll('[data-open]').forEach(b=> b.onclick = ()=>{
    const m = inbox.find(x=>x.id===b.dataset.open); if (!m) return; const p = m.payload||{};
    if (m.type==='gift'){ if (p.kind==='food') S.fridge[p.id] = (S.fridge[p.id]||0)+1; else if (p.kind==='bag') S.bag[p.id] = (S.bag[p.id]||0)+1; else S.coins += +p.id; gain('social', 5); toast(`🎁 ${p.label} ${p.kind==='food'?'is in your fridge':p.kind==='bag'?'is in your bag':'added!'}`); sfx('coin'); }
    else if (m.type==='letter'){ gain('social', p.hug ? 5 : 3); gain('fun', 2); }
    else if (m.type==='answer'){ const k = hasCombo('homework') ? 2 : 1; gain('smart', 4*k); gain('social', 3); addXP(5); }
    net.removeInbox(m.id); inbox = inbox.filter(x=>x!==m); save(); updateFamBadge(); openMailbox();
  });
  $('mBody').querySelectorAll('[data-help]').forEach(b=> b.onclick = ()=>{
    const m = inbox.find(x=>x.id===b.dataset.help); if (!m) return; const p = m.payload||{}; const v = decodeURIComponent(b.dataset.v);
    if (v !== p.a){ b.classList.add('wrong'); sfx('wrong'); bubble('Hmm, try again! 🤔'); return; }
    b.classList.add('right'); sfx('right');
    const k = hasCombo('homework') ? 2 : 1;
    gain('smart', 3*k); gain('social', 4); addXP(6); famReward(6);
    sendMsg('answer', {q:p.q, a:p.a, tip:pick(TIPS)});
    S.c.helped = (S.c.helped||0) + 1;
    setTimeout(()=>{ net.removeInbox(m.id); inbox = inbox.filter(x=>x!==m); updateFamBadge(); openMailbox(); toast(`🌟 You helped ${m.fromName}! Great teamwork!`); }, 900);
    save();
  });
}
// ---------- family garden (needs both children to water on the same day) ----------
let gardenG = null;
function buildGarden(){
  if (gardenG) scene.remove(gardenG);
  gardenG = GG(); gardenG.position.copy(GARDEN_POS); scene.add(gardenG);
  const bed = boxM('#a0632f', 6, 0.5, 2.6); bed.position.y = 0.25; gardenG.add(bed);
  const soil = boxM('#7a4a2a', 5.6, 0.52, 2.2); soil.position.y = 0.27; gardenG.add(soil);
  const sign = labelSprite('🌻 Family Garden', '#fff3a8', {fs:40, scale:0.55}); sign.position.set(0, 2.6, -1.2); gardenG.add(sign);
  gardenG.userData.garden = true; gardenG.traverse(m=>{ if (m.isMesh) m.userData.garden = true; }); clickables.push(gardenG);
  gardenG.userData.plants = GG(); gardenG.add(gardenG.userData.plants);
  refreshGarden();
}
function refreshGarden(){
  if (!gardenG) return;
  const st = Math.min(6, famData.garden.stage||0); const pl = gardenG.userData.plants;
  while (pl.children.length) pl.remove(pl.children[0]);
  for (let i=0;i<8;i++){
    const x = -2.4 + (i%4)*1.6, z = i<4 ? -0.5 : 0.5;
    const g = GG(); g.position.set(x + (i<4?0:0.8), 0.5, z);
    if (st === 0){ g.add(ball('#5a3a20', 0.12, 1, 0.5, 1)); }
    else {
      const h = 0.3 + st*0.32; const stem = cyl('#4fbf5c', 0.04, 0.05, h, 6); stem.position.y = h/2; g.add(stem);
      const lf = ball('#4fbf5c', 0.16, 1.5, 0.3, 0.7); lf.position.set(0.1, h*0.45, 0); lf.rotation.z = -0.5; g.add(lf);
      if (st >= 2){ const col = ['#ff5c8a','#ffd84d','#b18cff','#ff9f5a'][i%4]; const fl = GG(); fl.position.y = h;
        for (let k=0;k<6;k++){ const a = k/6*Math.PI*2; const pt = ball(col, 0.08+st*0.025, 1.3, 0.5, 1); pt.position.set(Math.cos(a)*(0.1+st*0.03), 0, Math.sin(a)*(0.1+st*0.03)); fl.add(pt); }
        fl.add(ball('#ffe066', 0.06+st*0.015)); g.add(fl); }
    }
    pl.add(g);
  }
  if (st >= 6){ const sp = labelSprite('🏆 Full bloom!', '#ffd84d', {fs:36, scale:0.45}); sp.position.set(0, 3.4, -1.2); pl.add(sp); }
}
function waterGarden(){
  const key = S.day.key;
  if (famData.garden.water && famData.garden.water[SLOT] === key){ bubble('I already watered the garden today 🌱'); return; }
  const stand = GARDEN_POS.clone().add(new THREE.Vector3(0, 0, 2.6));
  const can = GG(); const cb = cyl('#4f8dff',0.3,0.35,0.5,12); can.add(cb);
  const go = ()=> runSeq([{walk:stand},{wait:1.6, anim:'work', face:GARDEN_POS, start:()=>{ scene.add(can); sfx('water'); }, tick:()=>{ can.position.set(pet.pos.x+0.4, 1.4, pet.pos.z-0.6); if (Math.random()<0.6) burst(GARDEN_POS.clone().setY(1.2).add(new THREE.Vector3(rnd(-2,2),0,rnd(-0.6,0.6))), 'water', 1); }, end:()=>scene.remove(can)}], ()=>{
    gain('fun', 2); addXP(3); famReward(3);
    const other = otherSlot();
    if (net) net.changeFamily(f=>{ f.garden = f.garden || {stage:0, water:{}}; f.garden.water = f.garden.water || {}; f.garden.water[SLOT] = key;
      if (f.garden.water[other] === key && f.garden.grownOn !== key){ f.garden.stage = Math.min(6, (f.garden.stage||0) + 1); f.garden.grownOn = key; }
      return f; }).then(f=>{
        if (f && f.garden && f.garden.grownOn === key && f.garden.water[other] === key){ toast(`🌻 You and ${sib?sib.name:'your sibling'} both watered today — the Family Garden grew!`); burst(GARDEN_POS.clone().setY(2), 'star', 18); sfx('level'); addCoins(6); sendMsg('bonus', {coins:6, label:'🌻 Family Garden grew! +6 🪙'}); }
        else toast(`💧 Watered! When ${sib?sib.name:'your sibling'} waters it today too, the garden grows.`);
      });
    else toast('💧 Watered! (Family link not set up, so the garden grows only with both siblings.)');
    save();
  });
  if (world.inHome) leaveHome();
  go();
}
// ---------- combos checked when things happen ----------
function comboCheck(kind){
  if (!sib || !sib.today || sib.today.key !== S.day.key) return;
  S.day.combos = S.day.combos || {};
  if (kind==='chores' && hasCombo('chores') && !S.day.combos.chores && (sib.today.chores||0) > 0 && (S.day.done||[]).length > 0){
    S.day.combos.chores = true; addCoins(12); sendMsg('bonus', {coins:12, label:'🧹 Chore Combo +12 🪙'}); toast('🧹 Chore Combo! You both helped at home today: +12 🪙 each'); famReward(6);
  }
  if (kind==='stars' && hasCombo('stars') && !S.day.combos.stars && (sib.today.stars||0) + (S.day.starsTaken||[]).length >= 20){
    S.day.combos.stars = true; const d1 = pick(DECOR.filter(d=>d.price>=40 && d.price<=90)), d2 = pick(DECOR.filter(d=>d.price>=40 && d.price<=90));
    S.bag[d1.id] = (S.bag[d1.id]||0)+1; sendMsg('bonus', {item:d2.id, label:`⭐ Star Team: ${d2.em} ${d2.name} for your room`}); toast(`⭐ Star Team! 20 stars together — ${d1.em} ${d1.name} is in your bag!`); famReward(8);
  }
  if (kind==='band' && hasCombo('band') && !S.day.combos.band && sib.today.music && S.day.music){
    S.day.combos.band = true; gain('fun', 10); sendMsg('bonus', {fun:10, label:'🎶 Family Band +10 🎈'}); toast('🎶 Family Band! You both made music today: +10 🎈 each'); famReward(6);
  }
  save();
}

let sibRoom = null;
function visitSibRoom(){
  if (!sib || !sib.room){ toast('Your sibling has not decorated yet!'); return; }
  if (sibRoom){ scene.remove(sibRoom); }
  sibRoom = GG(); sibRoom.position.copy(HOME_C); scene.add(sibRoom);
  const mk = (id, rx, rz) => { const t = canvasTex(256,256,STYLES.find(s=>s.id===id).draw); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, rz); return new THREE.MeshToonMaterial({color:'#ffffff', map:t, gradientMap:gradMap()}); };
  const wm = mk(sib.room.paper||'w_sky', 4, 2), fm = mk(sib.room.floor||'f_wood', 4, 3);
  const floor = new THREE.Mesh(new THREE.BoxGeometry(BW, 0.4, BD), fm); floor.position.y = -0.2; floor.receiveShadow = true; sibRoom.add(floor); sibRoom.userData.floor = floor;
  [[0,WH/2,-BD/2,BW,WH,0.4],[-BW/2,WH/2,0,0.4,WH,BD],[BW/2,WH/2,0,0.4,WH,BD]].forEach(w=>{ const m = new THREE.Mesh(new THREE.BoxGeometry(w[3],w[4],w[5]), wm); m.position.set(w[0],w[1],w[2]); m.receiveShadow = true; sibRoom.add(m); });
  const lab = labelSprite(`${sib.name}'s Room`, SLOTS[sib.slot].color, {fs:44, scale:0.7}); lab.position.set(0, 7.0, -BD/2+0.4); sibRoom.add(lab);
  const lt = new THREE.PointLight('#fff2d8', 0.15, 30); lt.position.set(0,7,2); sibRoom.add(lt);
  (sib.room.items||[]).forEach(rec=>{ const g = makeItemGroup(rec, HOME_C); if (g){ scene.add(g); g.position.sub(HOME_C); sibRoom.add(g); } });
  world.room = 'sib'; world.edit = false;
  pet.pos.set(HOME_C.x + BW/2 - 2.5, 0, HOME_C.z + BD/2 - 2.2); pet.path = []; pet.dir = -Math.PI/2;
  camera.position.set(HOME_C.x, 13, HOME_C.z + 20); camState.target.set(HOME_C.x, 1.5, HOME_C.z);
  const m = $('homeMenu');
  m.innerHTML = `<span class="pill" style="align-self:center;font-size:14px">Visiting ${sib.name}'s room 👀</span><button class="btn pink" id="likeRoom">💖 I love your room!</button><button class="btn white" id="backLiving">🚪 Living room</button>`;
  m.hidden = false;
  $('likeRoom').onclick = ()=>{ if (S.day.likedRoom){ bubble('I already said it 💖'); return; } S.day.likedRoom = true; sendMsg('letter', {em:'🏠', text:`${S.name} loves your room!`}); gain('social', 4); famReward(2); toast(`💖 ${sib.name} will get your message!`); save(); };
  $('backLiving').onclick = ()=>{ goLiving(); };
  bubble(pick([`Wow, ${sib.name}'s room!`, 'So cool! 😍']));
}

    const h = P.height; thumbCam.position.set(h*0.35, h*0.65, h*2.1); thumbCam.lookAt(0, h*0.5, 0);

  }catch(e){ return ''; }
}

      done({mode:'firebase', code});
    };
  }
}

function updateNeighbours(dt, t){
  nbs.forEach(x=>{
    const P = x.P, p = P.root.position; let mode = 'idle';
    if (x.hold > 0){ x.hold -= dt; if (pet) P.root.rotation.y = Math.atan2(pet.pos.x - p.x, pet.pos.z - p.z); mode = x.happy > 0 ? 'happy' : 'idle'; x.happy = Math.max(0, (x.happy||0) - dt); }
    else if (x.n.route && !(x.n.dog && dogWalk)){
      const r = x.n.route; const tgt = r[(x.seg+1) % r.length]; const dx = tgt[0]-p.x, dz = tgt[1]-p.z, d = Math.hypot(dx,dz);
      if (d < 0.3) x.seg = (x.seg+1) % r.length; else { const sp = 2.2*dt; p.x += dx/d*sp; p.z += dz/d*sp; P.root.rotation.y = Math.atan2(dx,dz); mode = 'walk'; }
    } else if (x.n.rod){ mode = 'idle'; }
    animatePet(P, dt, mode);
  });

    if (dogWalk && pet){ const b = pet.pos.clone(); b.x -= Math.sin(pet.dir)*1.6; b.z -= Math.cos(pet.dir)*1.6; tgt = b; }
    else { const o = dog.owner.P.root.position; const r = dog.owner.P.root.rotation.y; tgt = new THREE.Vector3(o.x + Math.sin(r+0.9)*1.4, 0, o.z + Math.cos(r+0.9)*1.4); }
    const dx = tgt.x - g.position.x, dz = tgt.z - g.position.z, d = Math.hypot(dx, dz);
    if (d > 0.25){ const sp = Math.min(d, (dogWalk ? 12 : 3)*dt); g.position.x += dx/d*sp; g.position.z += dz/d*sp; g.rotation.y = Math.atan2(dx, dz); g.position.y = 0.45 + Math.abs(Math.sin(t*14))*0.12; } else g.position.y = 0.45;
    g.userData.tail.rotation.z = Math.sin(t*16)*0.5;
    if (dogWalk && pet && !world.inHome && pet.pos.distanceTo(placeInfo.park.door) < 4){ finishFavour(nbs.find(x=>x.n.id==='mei')); }

function startFavour(x){

    return;

  if (f.kind==='walk'){ dogWalk = true; x.hold = 0; toast('🐶 Lucky is following you! Walk to the 🌳 Friends Park.'); setHint('🐶 Take Lucky to the Friends Park entrance'); return; }

function finishFavour(x, extraMsg){
  const n = x.n, r = n.favour.reward;

  if (n.favour.kind==='letter') setHint(null);

// ===================== SEQUENCES & TWEENS =====================
let seq = null; const tweens = [];
function runSeq(steps, done){
  if (!pet) return;
  pet.busy = true; let i = -1;
  const next = ()=>{
    i++;
    if (i >= steps.length){ pet.busy = false; pet.anim = null; pet.lift = 0; seq = null; if (done) done(); return; }
    const s = steps[i];
    if (s.walk){ pet.anim = null; pet.path = planPath(pet.pos, s.walk); pet.onArrive = next; if (!pet.path.length) next(); }
    else { pet.anim = s.anim || null; if (s.face) pet.dir = Math.atan2(s.face.x - pet.pos.x, s.face.z - pet.pos.z); if (s.start) s.start(); seq = {t:0, dur:s.wait||0, s, fn:()=>{ if (s.end) s.end(); next(); }}; }
  };
  next();
}
function updateSeq(dt){
  if (!seq) return;
  seq.t += dt; if (seq.s.tick) seq.s.tick(dt, Math.min(1, seq.t/seq.dur), seq.t);
  if (seq.t >= seq.dur){ const f = seq.fn; seq = null; f(); }
}
function tween(dur, fn, done){ tweens.push({t:0, dur, fn, done}); }
function updateTweens(dt){
  for (let i=tweens.length-1;i>=0;i--){ const w = tweens[i]; w.t += dt; const k = Math.min(1, w.t/w.dur); w.fn(k); if (k>=1){ tweens.splice(i,1); if (w.done) w.done(); } }
}

function petHappy(sec){ if (!pet) return; const was = pet.anim; pet.anim = 'happy'; sfx('jump'); setTimeout(()=>{ if (pet && pet.anim==='happy') pet.anim = was==='happy'?null:was; }, (sec||1.2)*1000); }

  else bubble(pick(['Hehe! That tickles!','I love you! 💖','What shall we do today?','Yay! 🎉','Wheee!', `I'm ${S.name}!`]));

      {wait:0.35, anim:'work', start:()=>{ pet.carry = obj; sfx('pop'); }},
      {walk:box},
      {wait:0.4, face:new THREE.Vector3(box.x, 0, box.z-3), start:()=>{ const c = pet.carry; pet.carry = null; tween(0.35, k=>{ c.position.set(box.x, 2.6 - k*2.2, box.z - 1.4*k); c.scale.setScalar(1-k*0.6); }, ()=>scene.remove(c)); sfx('tap'); }}
    ], ()=>choreStep(obj));
  } else if (chore.id==='plants'){
    const stand = new THREE.Vector3(op.x + (op.x>R.x?-1.6:1.6), 0, op.z + 1.2);
    const can = new THREE.Group(); const cb = cyl('#4f8dff',0.3,0.35,0.5,12); can.add(cb); const sp = cyl('#4f8dff',0.05,0.07,0.6,6); sp.rotation.z = -1; sp.position.set(0.35,0.2,0); can.add(sp);
    runSeq([{walk:stand},{wait:1.5, anim:'work', face:op, start:()=>{ scene.add(can); sfx('water'); }, tick:(dt,k)=>{ const fx = Math.sin(pet.dir), fz = Math.cos(pet.dir); can.position.set(pet.pos.x+fx*0.8, 1.5, pet.pos.z+fz*0.8); can.rotation.y = pet.dir - Math.PI/2; can.rotation.z = -0.4; if (Math.random()<0.5) burst(new THREE.Vector3(op.x, 2.3, op.z), 'water', 1); }, end:()=>{ scene.remove(can); }}], ()=>{
      const st = obj.userData.stem, fl = obj.userData.flower;
      st.traverse(m=>{ if (m.isMesh && m.material === toon('#a7b36a')) m.material = toon('#4fbf5c'); });
      tween(0.8, k=>{ st.rotation.z = 0.7*(1-k); fl.scale.setScalar(Math.max(0.001,k)); });
      burst(new THREE.Vector3(op.x, 2.4, op.z), 'star', 8);
      choreStep(obj);
    });
  } else if (chore.id==='dust'){
    const broom = new THREE.Group(); const h = cyl('#c08a4f',0.05,0.05,1.8,6); h.position.y = 0.9; broom.add(h); const br = cone('#ffd84d',0.3,0.5,8); br.position.y = 0.1; broom.add(br);
    runSeq([{walk:new THREE.Vector3(op.x+0.9, 0, op.z+0.6)},{wait:0.9, anim:'work', face:op, start:()=>{ scene.add(broom); sfx('swish'); }, tick:(dt,k,t)=>{ broom.position.set(pet.pos.x - 0.6, 0, pet.pos.z - 0.3); broom.rotation.z = Math.sin(t*16)*0.5; }, end:()=>{ scene.remove(broom); burst(op.clone().setY(0.5),'dust',10); scene.remove(obj); }}], ()=>choreStep(obj));
  }
  return true;
}
function choreStep(obj){
  if (!chore) return;
  chore.targets = chore.targets.filter(t=>t!==obj);
  chore.left--;
  gain('motor', 0.8, true);
  if (chore.left <= 0) finishChore(chore.id);
}
function finishChore(id){
  const c = CHORES.find(x=>x.id===id);
  chore = null; setHint(null);
  if (!S.day.done.includes(id)) S.day.done.push(id);
  const pay = chorePay(c);
  S.c.chores++; S.profile.helper += 12;
  addCoins(pay);
  gain('motor', 4); gain('energy', -5); gain('full', -2); gain('social', 2);
  addXP(15);
  parents.forEach(p=>{ p.mode = 'happy'; setTimeout(()=>p.mode='idle', 1800); burst(p.root.position.clone().setY(4), 'heart', 8); });
  petHappy(1.5);
  toast(`${pick(['Mama','Papa'])}: Thank you, sweetie! Here's ${pay} 🪙 pocket money!`, 3200);
  checkSkills(); save(); pubMe(); comboCheck('chores');
}
function endChore(silent){
  if (!chore) return;
  if (chore.id !== 'plants') chore.targets.forEach(t=>scene.remove(t));
  chore = null; setHint(null);
}

function startQuiz(sub, comp){
  sfx('tap');
  quiz = {sub, comp, qs: makeLesson(sub, comp?8:5, comp?1:0), i:0, right:0, results:[], lock:false, timer:comp?15:0};
  showQ();
}
function showQ(){
  if (!quiz) return;
  const q = quiz.qs[quiz.i];
  const dots = quiz.qs.map((x,i)=>`<i class="${i<quiz.i ? (quiz.results[i]?'ok':'no') : i===quiz.i ? 'cur':''}"></i>`).join('');
  $('mTitle').innerHTML = quiz.comp ? '🏆 Inter-school Quiz Cup' : '🏫 ' + (SUBJECTS.find(s=>s.id===quiz.sub)||{name:'Lesson'}).name;
  $('mBody').innerHTML = `<div class="board"><div class="dots">${dots}</div>
    ${quiz.comp?'<div class="xpbar" style="margin:0 0 8px;background:#245a41"><i id="qTimer" style="width:100%;background:#ffd84d;transition:none"></i></div>':''}
    <div class="q">${q.q}</div>
    <div style="text-align:center"><button class="btn white" id="qSay" style="font-size:14px;padding:3px 10px">🔊 Read to me</button></div>
    <div class="answers">${q.opts.map((o,i)=>`<button class="ans" data-i="${i}">${o}</button>`).join('')}</div></div>`;
  $('qSay').onclick = ()=> say(q.q, q.lang);
  quiz.lock = false; quiz.tLeft = quiz.timer;
  $('mBody').querySelectorAll('.ans').forEach(b=> b.onclick = ()=> answer(b, q.opts[+b.dataset.i]));
}
function answer(btn, val){
  if (!quiz || quiz.lock) return;
  quiz.lock = true;
  const q = quiz.qs[quiz.i]; const ok = val === q.a;
  quiz.results.push(ok); if (ok) quiz.right++;
  $('mBody').querySelectorAll('.ans').forEach(b=>{ if (b.textContent === q.a) b.classList.add('right'); });
  if (btn && !ok) btn.classList.add('wrong');
  if (!ok){ S.day.wrong = S.day.wrong || []; if (S.day.wrong.length < 6 && !S.day.wrong.some(w=>w.q===q.q)) S.day.wrong.push({q:q.q, a:q.a, opts:q.opts, lang:q.lang}); }
  sfx(ok?'right':'wrong');
  if (ok && !quiz.comp){ let g = 4 + (has('bookworm')?1:0) + (hasEq('books')?1:0); gain('smart', g, true); }
  setTimeout(()=>{ if (!quiz) return; quiz.i++; if (quiz.i >= quiz.qs.length) quizDone(); else showQ(); }, ok ? 800 : 1500);
}
function quizTick(dt){
  if (!quiz || !quiz.comp || quiz.lock || quiz.i >= quiz.qs.length) return;
  quiz.tLeft -= dt; const el = $('qTimer'); if (el) el.style.width = clamp(quiz.tLeft/quiz.timer*100,0,100)+'%';
  if (quiz.tLeft <= 0) answer(null, '__timeout__');
}
function quizDone(){
  const n = quiz.qs.length, r = quiz.right;
  S.c.correct += r; S.c.lessons++; S.day.lessons++;
  let html = `<div class="board" style="text-align:center"><div style="font-size:54px">${'⭐'.repeat(Math.max(1,Math.round(r/n*3)))}</div><div class="q" style="min-height:0">${r} / ${n} right!</div>`;
  if (quiz.comp){
    S.day.comp = true;
    const kind = r>=7?'gold':r>=6?'silver':r>=5?'bronze':null;
    if (kind){
      const coins = {gold:40,silver:30,bronze:20}[kind]; const xp = {gold:60,silver:45,bronze:30}[kind];
      S.trophies.push({kind, what:'Quiz Cup', date:S.day.key}); S.c.cups++;
      html += `<div style="font-size:70px">🏆</div><p style="font-weight:800;font-size:20px">${kind.toUpperCase()} trophy for Pal Primary School!<br>+${coins} 🪙 · +${xp} XP · trophy goes on your shelf at home</p>`;
      setTimeout(()=>{ addCoins(coins); addXP(xp); gain('smart', 8); gain('social', 6); burst(pet.pos.clone().setY(3),'star',24); sfx('level'); }, 300);
    } else {
      html += `<p style="font-weight:800;font-size:18px">Great try! You need 5 right for a trophy. Practise more lessons and try again tomorrow! 💪</p>`;
      setTimeout(()=>{ addXP(15); gain('smart',3); }, 300);
    }
  } else {
    html += `<p style="font-weight:800;font-size:18px">${r===n?'Perfect! ⭐ Teacher gave you a star sticker: +5 🪙':r>=3?'Well done! Keep learning!':'Good try! Every lesson makes you smarter!'}</p>`;
    setTimeout(()=>{ addXP(r*8 + 4); gain('social', 3); gain('energy', -4); gain('full', -3); if (r===n) addCoins(5); }, 300);
  }
  html += `<div class="row" style="justify-content:center;display:flex;gap:10px;margin-top:8px"><button class="btn mint" id="qAgain">📚 Another lesson</button><button class="btn white" id="qLeave">👋 Leave school</button></div></div>`;
  quiz = null;
  $('mBody').innerHTML = html;
  $('qAgain').onclick = ()=>openSchool(); $('qLeave').onclick = ()=>closeModal();

}

function rideSlide(){
  const sl = placeInfo.slide;
  runSeq([
    {walk: sl.start},
    {wait:1.4, anim:'walk', tick:(dt,k)=>{ pet.pos.set(sl.start.x, 0, sl.start.z + (sl.top.z - sl.start.z)*k); pet.lift = sl.top.y*k; pet.dir = 0; }},
    {wait:0.3, anim:'happy', start:()=>bubble('Ready… set…', 1)},
    {wait:1.1, anim:'ride', start:()=>sfx('swish'), tick:(dt,k)=>{ const e = k*k; pet.pos.set(sl.top.x, 0, sl.top.z + (sl.bottom.z+0.5 - sl.top.z)*e); pet.lift = sl.top.y*(1-e) + 0.05; pet.dir = 0; }},
  ], ()=>{ pet.lift = 0; burst(pet.pos.clone().setY(1),'star',14); bubble('WHEEE! 🛝'); rideDone(9, 3); });

  const seat = swingSeats[0]; const piv = new THREE.Vector3(78, 5.6, -34);

    {walk:new THREE.Vector3(78,0,-31.5)},
    {wait:5, anim:'ride', start:()=>{ seat.userData.ride = true; bubble('Higher! Higher! 🎠', 2); }, tick:(dt,k,t)=>{ const amp = Math.sin(Math.PI*k)*0.8; const a = Math.sin(t*2.6)*amp; seat.rotation.x = a; pet.pos.set(piv.x, 0, piv.z - 4.2*Math.sin(a)); pet.lift = piv.y - 4.2*Math.cos(a) + 0.08; pet.dir = 0; },
     end:()=>{ seat.userData.ride = false; seat.rotation.x = 0; pet.lift = 0; pet.pos.set(78,0,-31.5); }}
  ], ()=>{ bubble('That was fun!'); rideDone(10, 2); });

function rideMerry(){
  const c = placeInfo.merry.pos;
  runSeq([
    {walk:new THREE.Vector3(c.x+3.6, 0, c.z)},
    {wait:5, anim:'ride', start:()=>{ merry.userData.fast = 3; bubble('Spinny! 🎡', 2); }, tick:()=>{ const a = merry.rotation.y; pet.pos.set(c.x + Math.cos(-a)*2.2, 0, c.z + Math.sin(-a)*2.2); pet.lift = 0.65; pet.dir = -a + Math.PI; },

function openPark(){
  const near = nearestFriend();
  let html = `<p style="font-weight:800;margin-top:0">Friends live in the park and at the Fun Park. <b>Tap a friend</b> to say hi (+💬 Friends). Each friend can play again after a short rest.</p><div class="grid">`;
  html += `<div class="card"><div class="em">👋</div><div class="nm">Say hi</div><div class="ds">${near ? 'Visit '+near.name : 'No friend nearby'}</div><div class="row"><button class="btn mint" id="pkHi" ${near?'':'disabled'}>Go</button></div></div>`;
  html += hasEq('kite') ? `<div class="card"><div class="em">🪁</div><div class="nm">Fly a kite</div><div class="ds">+🎈 +🤸</div><div class="row"><button class="btn sky" id="pkKite">Fly!</button></div></div>` : `<div class="card locked"><div class="em">🪁</div><div class="nm">Fly a kite</div><div class="ds">Buy a Rainbow Kite at the shop</div></div>`;
  html += hasEq('ball') ? `<div class="card"><div class="em">⚽</div><div class="nm">Play catch</div><div class="ds">With ${near?near.name:'a friend'} · +💬 +🎈</div><div class="row"><button class="btn tang" id="pkBall" ${near?'':'disabled'}>Play</button></div></div>` : `<div class="card locked"><div class="em">⚽</div><div class="nm">Play catch</div><div class="ds">Buy a Bouncy Ball at the shop</div></div>`;
  html += `<div class="card"><div class="em">🦆</div><div class="nm">Watch the ducks</div><div class="ds">A calm moment · +🎈</div><div class="row"><button class="btn white" id="pkDuck">Watch</button></div></div></div>`;
  openModal('🌳 Friends Park', html);
  const hi = $('pkHi'); if (hi) hi.onclick = ()=>{ closeModal(); goFriend(friends.indexOf(near)); };
  const k = $('pkKite'); if (k) k.onclick = ()=>{ closeModal(); flyKite(); };
  const b = $('pkBall'); if (b) b.onclick = ()=>{ closeModal(); playCatch(near); };
  $('pkDuck').onclick = ()=>{ closeModal(); runSeq([{walk:new THREE.Vector3(-35,0,72.5)},{wait:3, anim:'idle', face:new THREE.Vector3(-35,0,80), start:()=>bubble('Quack quack! 🦆',2)}], ()=>{ if ((S.day.ducks||0) < 2){ S.day.ducks=(S.day.ducks||0)+1; gain('fun',5); addXP(2);} save(); }); };
}
function nearestFriend(){
  let best = null, bd = 1e9;
  friends.forEach(f=>{ const d = f.P.root.position.distanceTo(pet.pos); if (f.cool<=0 && d < bd){ bd = d; best = f; } });
  return best;
}
function goFriend(i){
  const f = friends[i]; if (!f || pet.busy) return;
  if (world.inHome) leaveHome();
  f.hold = 12;
  const p = f.P.root.position;
  const dirv = pet.pos.clone().sub(p); dirv.y = 0; if (dirv.length()<0.01) dirv.set(0,0,1); dirv.normalize();
  const stand = p.clone().addScaledVector(dirv, 2.2);
  walkTo(stand, ()=>greet(f), nearestRoad(stand).pt);
  sfx('tap');
}
function greet(f){
  pet.dir = Math.atan2(f.P.root.position.x - pet.pos.x, f.P.root.position.z - pet.pos.z);
  if (f.cool > 0){ bubble(`${f.name} is resting. Try another friend!`); f.hold = 1; return; }
  f.hold = 2.5; f.happy = 1.6; f.cool = 45;
  petHappy(1.4); sfx('hi');
  burst(pet.pos.clone().lerp(f.P.root.position, 0.5).setY(2.5), 'heart', 10);
  bubble(pick([`Hi ${f.name}! 👋`, `${f.name}, let's be friends!`, `Hello ${f.name}! 💖`]));
  const lines = ['Hi! Nice to see you!', 'Let\'s play together!', 'You look awesome today!', 'Want to go to the Fun Park?'];
  if (S.worn.head) lines.push('I love your hat!');
  toast(`${f.name}: ${pick(lines)}`);
  S.c.greets++; S.profile.heart += 3;
  gain('social', 6); gain('fun', 3); addXP(5);
  if (has('magnet') && Math.random() < 0.4){
    if (Math.random()<0.5){ const n = ri(3,8); setTimeout(()=>{ addCoins(n); toast(`🎁 ${f.name} gave you ${n} 🪙!`); }, 900); }
    else { const fd = pick(FOODS.filter(x=>x.healthy && !x.cooked)); S.fridge[fd.id] = (S.fridge[fd.id]||0)+1; setTimeout(()=>toast(`🎁 ${f.name} gave you a ${fd.name} ${fd.em} (in your fridge)`), 900); }
  }
  checkSkills(); save();
}
function flyKite(){
  const kite = new THREE.Group(); const k1 = new THREE.Mesh(new THREE.CircleGeometry(1.2, 4), toon('#ff5c8a',{side:THREE.DoubleSide})); kite.add(k1);
  const k2 = new THREE.Mesh(new THREE.CircleGeometry(0.6, 4), toon('#ffd84d',{side:THREE.DoubleSide})); k2.position.z = 0.01; kite.add(k2);
  const tail = []; for (let i=0;i<5;i++){ const b = ball(['#7fd3ff','#6fe3b5','#b18cff'][i%3],0.15); scene.add(b); tail.push(b); }
  const strG = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]); const str = new THREE.Line(strG, new THREE.LineBasicMaterial({color:'#ffffff'}));
  runSeq([{wait:6, anim:'idle', start:()=>{ scene.add(kite); scene.add(str); bubble('Look how high it flies! 🪁',3); sfx('swish'); }, tick:(dt,k,t)=>{
      const h = 2 + Math.min(1,k*3)*9; const kp = new THREE.Vector3(pet.pos.x + Math.sin(t*0.8)*3, h + Math.sin(t*2)*0.6, pet.pos.z - 6);
      kite.position.copy(kp); kite.rotation.set(0.3, 0, Math.PI/4 + Math.sin(t*3)*0.2);
      tail.forEach((b,i)=>b.position.set(kp.x - Math.sin(t*2+i)*0.3, kp.y - 1 - i*0.5, kp.z));
      const hand = pet.pos.clone().setY(1.5); strG.setFromPoints([hand, kp]); pet.dir = Math.PI;
    }, end:()=>{ scene.remove(kite); scene.remove(str); tail.forEach(b=>scene.remove(b)); }}], ()=>{ rideDone(10, 3); });
}
function playCatch(f){
  if (!f) return;
  f.hold = 14;
  const p = f.P.root.position;
  const dirv = pet.pos.clone().sub(p).setY(0); if (dirv.length()<0.01) dirv.set(0,0,1); dirv.normalize();
  const stand = p.clone().addScaledVector(dirv, 6);
  const b = ball('#ff5a5a', 0.3);
  runSeq([{walk:stand},{wait:5, anim:'idle', start:()=>{ scene.add(b); }, tick:(dt,k,t)=>{
      const ph = (t/1.25)%2; const fwd = ph < 1; const u = ph % 1;
      const a = pet.pos.clone(), c = f.P.root.position.clone(); const from = fwd ? a : c, to = fwd ? c : a;
      b.position.lerpVectors(from, to, u); b.position.y = 1.2 + Math.sin(u*Math.PI)*3;
      pet.dir = Math.atan2(c.x - a.x, c.z - a.z); pet.anim = (!fwd && u>0.85) || (fwd && u<0.15) ? 'happy' : 'idle';
      f.P.root.rotation.y = Math.atan2(a.x-c.x, a.z-c.z);
    }, end:()=>scene.remove(b)}], ()=>{ f.hold = 1; f.cool = 30; S.c.greets++; gain('social', 7); gain('fun', 7); gain('motor', 3); gain('energy',-3); addXP(8); toast(`${f.name}: That was so much fun!`); checkSkills(); save(); });
}

// ===================== MINI GAMES =====================
let mini = null;
const miniOpen = () => !$('mini').hidden;
function sizeMini(){
  const cv = $('miniCanvas'); const r = cv.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width = Math.max(10, r.width*dpr); cv.height = Math.max(10, r.height*dpr);
  if (mini){ mini.w = r.width; mini.h = r.height; mini.dpr = dpr; }
}
function openMini(kind){
  $('mini').hidden = false; setHint(null);
  mini = {kind, t:0, score:0, w:0, h:0, dpr:1, items:[], done:false};
  sizeMini();
  const titles = {bubble:'🫧 Bubble Pop', catch:'🍓 Fruit Catch', rope:'🪢 Hop Rope', memory:'🃏 Memory Match', peek:'🙈 Peekaboo Friends', sports:'🥇 Sports Day', dishes:'🍽️ Wash the Dishes'};
  $('miniTitle').textContent = titles[kind];
  const durs = {bubble:20, catch:25, rope:22, memory:45, peek:22, sports:30, dishes:0};
  mini.dur = durs[kind];
  MG[kind].init(mini);
  $('miniQuit').onclick = ()=>{ if (!mini) return; mini.done = true; closeMini(false); };
  const cv = $('miniCanvas');
  const pos = e=>{ const r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  cv.onpointerdown = e=>{ audioInit(); cv.setPointerCapture(e.pointerId); mini && (mini.down = true); const p = pos(e); mini && MG[mini.kind].down && MG[mini.kind].down(mini, p.x, p.y); };
  cv.onpointermove = e=>{ const p = pos(e); mini && MG[mini.kind].move && MG[mini.kind].move(mini, p.x, p.y, mini.down); };
  cv.onpointerup = cv.onpointercancel = ()=>{ if (mini) mini.down = false; };
}
function closeMini(finished){
  const m = mini; mini = null; $('mini').hidden = true;
  if (!m) return;
  if (m.kind==='dishes'){ if (finished) finishChore('dishes'); else { chore = null; } return; }
  if (!finished){ toast('Game stopped'); return; }
  const R = MG[m.kind].reward(m);
  S.c.games++;
  gain('energy', -5, true); gain('full', -3, true);
  const lines = [];
  for (const k of ['fun','motor','smart','social']){ if (R[k]){ let v = R[k]; if (k==='motor' && hasEq('rope')) v *= 1.3; const real = gain(k, v, true); lines.push(`+${Math.round(v*persMul(k))} ${STATS.find(s=>s.id===k).ic}`); } }
  let extra = '';
  if (m.kind==='sports'){
    const kind = m.score>=30?'gold':m.score>=22?'silver':m.score>=15?'bronze':null;
    if (kind){ const coins = {gold:35,silver:25,bronze:15}[kind]; S.trophies.push({kind, what:'Sports Day', date:S.day.key}); S.c.cups++; extra = `<div style="font-size:64px">🏅</div><p style="font-weight:800;font-size:20px">${kind.toUpperCase()} medal! +${coins} 🪙</p>`; setTimeout(()=>addCoins(coins), 400); R.xp += 30; }
    else extra = `<p style="font-weight:800">Catch 15 or more for a medal. Try again tomorrow!</p>`;
  }
  setTimeout(()=>{ addXP(R.xp); petHappy(); }, 300);
  openModal('🎉 Great playing!', `<div style="text-align:center"><div style="font-family:var(--display);font-weight:800;font-size:40px">Score: ${m.score}</div>${extra}<p style="font-weight:800;font-size:20px">${lines.join('  ')}  +${Math.round(R.xp*xpMul())} XP</p><button class="btn mint big" id="mgOk">Yay!</button></div>`);
  $('mgOk').onclick = ()=>closeModal();
  checkSkills(); save();
}
function updateMini(dt){
  if (!mini) return;
  const m = mini; m.t += dt;
  const g = $('miniCanvas').getContext('2d');
  g.setTransform(m.dpr,0,0,m.dpr,0,0);
  MG[m.kind].update(m, dt);
  MG[m.kind].draw(m, g);
  $('miniScore').textContent = m.kind==='dishes' ? `Plate ${Math.min(3,m.plate+1)}/3` : '⭐ ' + m.score;
  $('miniTime').textContent = m.dur ? '⏱ ' + Math.max(0, Math.ceil(m.dur - m.t)) : '';
  if (m.dur && m.t >= m.dur && !m.done){ m.done = true; closeMini(true); }
}
function bg(g, m, c1, c2){ const gr = g.createLinearGradient(0,0,0,m.h); gr.addColorStop(0,c1); gr.addColorStop(1,c2); g.fillStyle = gr; g.fillRect(0,0,m.w,m.h); }
function emo(g, em, x, y, s){ g.font = `${s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(em, x, y); }
function txt(g, t, x, y, s, col){ g.font = `800 ${s}px "Baloo 2", sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.lineWidth = 6; g.strokeStyle = '#2b2a4c'; g.strokeText(t,x,y); g.fillStyle = col||'#fff'; g.fillText(t,x,y); }
function drawPal(g, x, y, r, squash){
  const c = S.design.color;
  g.save(); g.translate(x,y); g.scale(1+squash*0.15, 1-squash*0.15);
  g.fillStyle = c; g.strokeStyle = '#2b2a4c'; g.lineWidth = 4;
  g.beginPath(); g.ellipse(0,0,r,r*0.92,0,0,Math.PI*2); g.fill(); g.stroke();
  g.fillStyle = '#2b2a4c'; [-1,1].forEach(s=>{ g.beginPath(); g.ellipse(s*r*0.35,-r*0.1,r*0.11,r*0.15,0,0,Math.PI*2); g.fill(); });
  g.fillStyle = '#fff'; [-1,1].forEach(s=>{ g.beginPath(); g.arc(s*r*0.35+r*0.04,-r*0.16,r*0.04,0,Math.PI*2); g.fill(); });
  g.fillStyle = '#ff8fb0'; [-1,1].forEach(s=>{ g.beginPath(); g.ellipse(s*r*0.58,r*0.15,r*0.13,r*0.08,0,0,Math.PI*2); g.fill(); });
  g.strokeStyle = '#2b2a4c'; g.lineWidth = 3; g.beginPath(); g.arc(0,r*0.12,r*0.15,0.2,Math.PI-0.2); g.stroke();
  g.restore();
}
const MG = {
  bubble:{
    init(m){ m.spawn = 0; },
    update(m, dt){
      m.spawn -= dt;
      if (m.spawn <= 0){ m.spawn = rnd(0.25,0.55) * (1 - m.t/m.dur*0.4); const gold = Math.random()<0.1; m.items.push({x:rnd(40,m.w-40), y:m.h+40, r:gold?28:rnd(26,44), v:rnd(60,120)+m.t*4, gold, ph:rnd(0,6), c:pick(['#ff8fc7','#7fd3ff','#6fe3b5','#b18cff','#ffd84d'])}); }
      m.items.forEach(b=>{ b.y -= b.v*dt; b.x += Math.sin(m.t*2+b.ph)*0.6; if (b.pop!==undefined) b.pop += dt; });
      m.items = m.items.filter(b=>b.y > -60 && !(b.pop>0.25));
    },
    draw(m, g){
      bg(g, m, '#bdeaff', '#fff1fa');
      m.items.forEach(b=>{
        if (b.pop!==undefined){ g.strokeStyle = b.c; g.lineWidth = 3; for (let i=0;i<8;i++){ const a=i/8*Math.PI*2; const d = b.r + b.pop*120; g.beginPath(); g.moveTo(b.x+Math.cos(a)*b.r, b.y+Math.sin(a)*b.r); g.lineTo(b.x+Math.cos(a)*d, b.y+Math.sin(a)*d); g.stroke(); } return; }
        g.globalAlpha = 0.55; g.fillStyle = b.gold ? '#ffd84d' : b.c; g.beginPath(); g.arc(b.x,b.y,b.r,0,Math.PI*2); g.fill(); g.globalAlpha = 1;
        g.strokeStyle = '#2b2a4c'; g.lineWidth = 3; g.stroke();
        g.fillStyle = '#fff'; g.beginPath(); g.arc(b.x-b.r*0.35,b.y-b.r*0.35,b.r*0.2,0,Math.PI*2); g.fill();
        if (b.gold) emo(g,'⭐',b.x,b.y,b.r);
      });
      if (m.t < 2) txt(g, 'Tap the bubbles!', m.w/2, m.h*0.3, 40);
    },
    down(m, x, y){ for (let i=m.items.length-1;i>=0;i--){ const b = m.items[i]; if (b.pop===undefined && Math.hypot(b.x-x,b.y-y) < b.r+10){ b.pop = 0; m.score += b.gold?5:1; sfx('pop'); return; } } },
    reward(m){ return {fun:Math.min(20, 6+m.score*0.5), motor:Math.min(8, m.score*0.25), xp:Math.min(22, 6+m.score*0.4)}; }
  },
  catch:{
    init(m){ m.bx = m.w/2; m.spawn = 0; m.hard = false; },
    update(m, dt){
      m.spawn -= dt;
      const sp = m.hard ? 1.6 : 1;
      if (m.spawn <= 0){ m.spawn = rnd(0.45,0.9)/sp; const bug = Math.random() < (m.hard?0.28:0.2); m.items.push({x:rnd(30,m.w-30), y:-30, v:(rnd(140,220)+m.t*5)*sp, em: bug ? pick(['🐛','🐝']) : pick(['🍎','🍓','🍌','🍊','🍇','🥕']), bug}); }
      m.items.forEach(f=>{ f.y += f.v*dt;
        if (!f.got && f.y > m.h-110 && f.y < m.h-50 && Math.abs(f.x - m.bx) < 60){ f.got = true; if (f.bug){ m.score = Math.max(0, m.score-2); sfx('wrong'); m.shake = 0.3; } else { m.score++; sfx('pop'); } }
      });
      m.items = m.items.filter(f=>!f.got && f.y < m.h+40);
      if (keys.ArrowLeft) m.bx -= 500*dt; if (keys.ArrowRight) m.bx += 500*dt; m.bx = clamp(m.bx, 50, m.w-50);
      m.shake = Math.max(0,(m.shake||0)-dt);
    },
    draw(m, g){
      bg(g, m, '#c7f0ff', '#d8ffcf');
      g.fillStyle = '#8fdc72'; g.fillRect(0, m.h-40, m.w, 40);
      m.items.forEach(f=>emo(g, f.em, f.x, f.y, 44));
      const sx = m.shake ? Math.sin(m.t*60)*6 : 0;
      drawPal(g, m.bx+sx, m.h-118, 34, 0);
      emo(g, '🧺', m.bx+sx, m.h-72, 74);
      if (m.t < 2) txt(g, 'Drag to catch fruit — avoid bugs!', m.w/2, m.h*0.3, 32);
    },
    down(m, x){ m.bx = x; }, move(m, x, y, d){ if (d) m.bx = x; },
    reward(m){ return {fun:Math.min(20, 8+m.score*0.4), motor:Math.min(10, 2+m.score*0.4), xp:Math.min(24, 6+m.score*0.6)}; }
  },
  rope:{
    init(m){ m.ang = 0; m.speed = 2.6; m.jy = 0; m.jv = 0; m.combo = 0; m.hit = 0; m.passed = false; },
    update(m, dt){
      m.ang += m.speed*dt; m.speed = 2.6 + m.t*0.07;
      if (m.jy > 0 || m.jv > 0){ m.jv -= 1900*dt; m.jy += m.jv*dt; if (m.jy <= 0){ m.jy = 0; m.jv = 0; } }
      const phase = ((m.ang % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
      // rope at bottom when phase near PI
      if (Math.abs(phase - Math.PI) < 0.22){
        if (!m.passed){ m.passed = true; if (m.jy > 22){ m.score++; m.combo++; sfx('right'); } else { m.combo = 0; m.hit = 0.5; sfx('wrong'); } }
      } else if (Math.abs(phase - Math.PI) > 0.6) m.passed = false;
      m.hit = Math.max(0, m.hit - dt);
    },
    draw(m, g){
      bg(g, m, '#ffe3f1', '#fff6cc');
      const cx = m.w/2, gy = m.h*0.78;
      g.fillStyle = '#ffd9a8'; g.fillRect(0, gy+30, m.w, m.h);
      // friends holding rope
      const L = Math.min(260, m.w*0.38);
      emo(g, '🐻', cx-L-30, gy-10, 64); emo(g, '🐰', cx+L+30, gy-10, 64);
      const phase = m.ang; const ry = Math.cos(phase) * 150;
      const front = Math.sin(phase) > 0;
      const drawRope = ()=>{ g.strokeStyle = '#ff5c8a'; g.lineWidth = 7; g.beginPath(); g.moveTo(cx-L, gy-30); g.quadraticCurveTo(cx, gy-30 - ry*1.0 + 60, cx+L, gy-30); g.stroke(); };
      if (!front) drawRope();
      drawPal(g, cx, gy - 20 - m.jy, 40, m.jy>0? -0.3 : 0.2);
      if (front) drawRope();
      if (m.hit > 0) txt(g, 'Oops!', cx, gy-140, 40, '#ff9d9d');
      if (m.combo >= 3) txt(g, m.combo + ' in a row!', cx, m.h*0.15, 34, '#ffd84d');
      if (m.t < 2.5) txt(g, 'Tap to jump when the rope comes down!', cx, m.h*0.25, 30);
    },
    down(m){ if (m.jy === 0){ m.jv = 620; sfx('jump'); } },
    reward(m){ return {motor:Math.min(12, 2+m.score*0.8), fun:Math.min(18, 6+m.score*0.3), xp:Math.min(24, 6+m.score)}; }
  },
  memory:{
    init(m){ const ems = shuffle(['🐶','🐱','🐰','🦊','🐼','🐸','🐵','🦄','🐙','🐧']).slice(0,6); m.cards = shuffle([...ems,...ems]).map(e=>({e, open:false, done:false, flip:0})); m.sel = []; m.wait = 0; },
    update(m, dt){
      m.cards.forEach(c=>{ const t = (c.open||c.done)?1:0; c.flip += (t - c.flip)*Math.min(1,dt*12); });
      if (m.wait > 0){ m.wait -= dt; if (m.wait <= 0){ m.sel.forEach(c=>c.open=false); m.sel = []; } }
      if (m.cards.every(c=>c.done) && !m.done){ m.score += Math.max(0, Math.round((m.dur - m.t)/3)); m.done = true; setTimeout(()=>closeMini(true), 700); }
    },
    layout(m){ const cols = m.w > m.h ? 4 : 3, rows = 12/cols; const cw = Math.min((m.w-40)/cols, (m.h-40)/rows) - 12; const ox = (m.w - cols*(cw+12))/2, oy = (m.h - rows*(cw+12))/2; return {cols, cw, ox, oy}; },
    draw(m, g){
      bg(g, m, '#e9e1ff', '#fff1fa');
      const L = this.layout(m);
      m.cards.forEach((c,i)=>{
        const x = L.ox + (i%L.cols)*(L.cw+12), y = L.oy + Math.floor(i/L.cols)*(L.cw+12);
        const sx = Math.abs(Math.cos(c.flip*Math.PI));
        g.save(); g.translate(x+L.cw/2, y+L.cw/2); g.scale(Math.max(0.05,sx),1);
        const face = c.flip > 0.5;
        g.fillStyle = c.done ? '#c9f7dc' : face ? '#ffffff' : '#b18cff'; g.strokeStyle = '#2b2a4c'; g.lineWidth = 4;
        roundRect(g, -L.cw/2, -L.cw/2, L.cw, L.cw, 16); g.fill(); g.stroke();
        if (face) emo(g, c.e, 0, 4, L.cw*0.55); else emo(g, '⭐', 0, 4, L.cw*0.35);
        g.restore(); c.box = [x,y,L.cw];
      });
    },
    down(m, x, y){
      if (m.wait > 0 || m.done) return;
      const c = m.cards.find(c=>c.box && x>c.box[0] && x<c.box[0]+c.box[2] && y>c.box[1] && y<c.box[1]+c.box[2]);
      if (!c || c.open || c.done) return;
      c.open = true; m.sel.push(c); sfx('tap');
      if (m.sel.length === 2){ if (m.sel[0].e === m.sel[1].e){ m.sel.forEach(c=>{ c.done = true; c.open = false; }); m.sel = []; m.score += 3; sfx('right'); } else m.wait = 0.8; }
    },
    reward(m){ const pairs = m.cards.filter(c=>c.done).length/2; return {smart:Math.min(8, pairs*1.3), fun:8, xp:Math.min(26, 6+pairs*3)}; }
  },
  peek:{
    init(m){ m.holes = []; m.spawn = 0.5; },
    update(m, dt){
      const cols = m.w > m.h ? 3 : 2, rows = 6/cols;
      m.L = {cols, rows};
      m.spawn -= dt;
      if (m.spawn <= 0){ m.spawn = rnd(0.5,0.9)*(1-m.t/m.dur*0.35); const free = [0,1,2,3,4,5].filter(i=>!m.holes.find(h=>h.i===i)); if (free.length){ const bee = Math.random()<0.18; m.holes.push({i:pick(free), t:0, life:rnd(0.9,1.4), em: bee?'🐝':pick(['🐶','🐱','🐰','🐻','🐼','🐥','🦊']), bee}); } }
      m.holes.forEach(h=>h.t += dt);
      m.holes = m.holes.filter(h=>h.t < h.life && !h.hit);
    },
    pos(m, i){ const {cols, rows} = m.L; const cw = m.w/cols, ch = (m.h-60)/rows; return {x:cw*(i%cols)+cw/2, y:60+ch*Math.floor(i/cols)+ch*0.62, s:Math.min(cw,ch)*0.42}; },
    draw(m, g){
      bg(g, m, '#c7f0ff', '#d8ffcf');
      if (!m.L) return;
      for (let i=0;i<6;i++){ const p = this.pos(m,i);
        const h = m.holes.find(h=>h.i===i);
        if (h){ const up = Math.min(1, h.t*6, (h.life-h.t)*6); emo(g, h.em, p.x, p.y - up*p.s*0.9, p.s*1.2); }
        g.fillStyle = '#4fbf5c'; g.strokeStyle = '#2b2a4c'; g.lineWidth = 4;
        g.beginPath(); g.ellipse(p.x, p.y+p.s*0.25, p.s*1.1, p.s*0.55, 0, Math.PI, 0); g.lineTo(p.x+p.s*1.1, p.y+p.s*0.45); g.lineTo(p.x-p.s*1.1, p.y+p.s*0.45); g.closePath(); g.fill(); g.stroke();
        g.fillStyle = '#ff8fc7'; [-0.5,0.1,0.6].forEach(dx=>{ g.beginPath(); g.arc(p.x+dx*p.s, p.y+p.s*0.05, p.s*0.08, 0, Math.PI*2); g.fill(); });
      }
      if (m.t < 2) txt(g, 'Tap friends — not the bees!', m.w/2, 40, 30);
    },
    down(m, x, y){ for (const h of m.holes){ const p = this.pos(m, h.i); if (Math.hypot(x-p.x, y-(p.y-p.s*0.8)) < p.s*1.0){ h.hit = true; if (h.bee){ m.score = Math.max(0,m.score-2); sfx('wrong'); } else { m.score++; sfx('hi'); } return; } } },
    reward(m){ return {social:Math.min(9, 2+m.score*0.4), fun:Math.min(18, 8+m.score*0.3), motor:3, xp:Math.min(22, 6+m.score*0.6)}; }
  },
  sports:{
    init(m){ MG.catch.init(m); m.hard = true; },
    update(m, dt){ MG.catch.update(m, dt); }, draw(m, g){ MG.catch.draw(m, g); txt(g, '🥇 Sports Day', m.w/2, 30, 28, '#ffd84d'); },
    down(m,x){ m.bx = x; }, move(m,x,y,d){ if (d) m.bx = x; },
    reward(m){ return {motor:Math.min(14, 4+m.score*0.4), fun:12, social:5, xp:Math.min(30, 10+m.score*0.6)}; }
  },
  dishes:{
    init(m){ m.plate = 0; this.newPlate(m); },
    newPlate(m){
      const c = document.createElement('canvas'); c.width = 400; c.height = 400; const g = c.getContext('2d');
      m.dirt = c; m.cells = new Set();
      for (let i=0;i<14;i++){ const x = rnd(90,310), y = rnd(90,310), r = rnd(25,55); g.fillStyle = pick(['#a0703d','#8a5a2b','#c9a15a','#7d6b4a']); g.globalAlpha = 0.85; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
      g.globalAlpha = 1;
      const d = g.getImageData(0,0,400,400).data;
      for (let gx=0; gx<20; gx++) for (let gy=0; gy<20; gy++){ const i = ((gy*20+10)*400 + gx*20+10)*4; if (d[i+3] > 50) m.cells.add(gx+','+gy); }
      m.total = m.cells.size; m.bubbles = [];
    },
    update(m, dt){ m.bubbles.forEach(b=>{ b.y -= 40*dt; b.l -= dt; }); m.bubbles = m.bubbles.filter(b=>b.l>0); if (m.next){ m.next -= dt; if (m.next <= 0){ m.next = 0; m.plate++; if (m.plate >= 3){ m.done = true; closeMini(true); } else this.newPlate(m); } } },
    geo(m){ const s = Math.min(m.w, m.h)*0.7; return {x:(m.w-s)/2, y:(m.h-s)/2+10, s}; },
    draw(m, g){
      bg(g, m, '#d6f3ff', '#ffffff');
      const G = this.geo(m);
      g.fillStyle = '#ffffff'; g.strokeStyle = '#2b2a4c'; g.lineWidth = 5; g.beginPath(); g.arc(G.x+G.s/2, G.y+G.s/2, G.s/2, 0, Math.PI*2); g.fill(); g.stroke();
      g.strokeStyle = '#9fd8ff'; g.lineWidth = 4; g.beginPath(); g.arc(G.x+G.s/2, G.y+G.s/2, G.s*0.36, 0, Math.PI*2); g.stroke();
      g.drawImage(m.dirt, G.x, G.y, G.s, G.s);
      m.bubbles.forEach(b=>{ g.globalAlpha = Math.min(1,b.l); g.fillStyle = '#ffffff'; g.strokeStyle = '#7fd3ff'; g.lineWidth = 2; g.beginPath(); g.arc(b.x,b.y,b.r,0,Math.PI*2); g.fill(); g.stroke(); g.globalAlpha = 1; });
      const left = m.total ? m.cells.size/m.total : 0;
      txt(g, m.next ? '✨ Sparkly clean! ✨' : `Rub the plate clean! ${Math.round((1-left)*100)}%`, m.w/2, 34, 30, m.next?'#ffd84d':'#fff');
      if (m.next) emo(g,'✨', G.x+G.s/2, G.y+G.s/2, 120);
    },
    scrub(m, x, y){
      if (m.next) return;
      const G = this.geo(m); const lx = (x-G.x)/G.s*400, ly = (y-G.y)/G.s*400;
      const g = m.dirt.getContext('2d'); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(lx,ly,34,0,Math.PI*2); g.fill(); g.globalCompositeOperation = 'source-over';
      const cx = Math.floor(lx/20), cy = Math.floor(ly/20);
      for (let dx=-2;dx<=2;dx++) for (let dy=-2;dy<=2;dy++) if (dx*dx+dy*dy<=4) m.cells.delete((cx+dx)+','+(cy+dy));
      if (Math.random()<0.5) m.bubbles.push({x:x+rnd(-20,20), y:y+rnd(-20,20), r:rnd(5,14), l:1});
      if (Math.random()<0.08) sfx('swish');
      if (m.cells.size <= m.total*0.08){ g.clearRect(0,0,400,400); m.next = 1.0; sfx('right'); }
    },
    down(m,x,y){ this.scrub(m,x,y); }, move(m,x,y,d){ if (d) this.scrub(m,x,y); },
    reward(){ return {xp:0}; }
  }
};

    const tot = Object.values(g.profile).reduce((a,b)=>a+b,0)||1;
    const top3 = Object.keys(g.profile).sort((a,b)=>g.profile[b]-g.profile[a]).slice(0,3).map(k=>`${FORMS[k].em} ${Math.round(g.profile[k]/tot*100)}%`).join(' · ');

      <div style="font-family:var(--display);font-weight:800;font-size:30px">${S.name} is now a ${F.name} ${STAGES[g.stage].name}!</div>
      <p style="font-weight:800;font-size:17px">Because ${S.name} did lots of ${F.name==='Smarty'?'learning':F.name==='Sporty'?'playing and moving':F.name==='Buddy'?'making friends':F.name==='Helper'?'helping at home':F.name==='Artsy'?'decorating, painting and taking photos':'healthy eating'} (${top3}),<br>${S.name} grew bigger and got <b>${F.look}</b>!</p>

    openModal('⭐ New special skill!', `<div style="text-align:center"><div style="font-size:70px">${sk.em}</div><div style="font-family:var(--display);font-weight:800;font-size:30px">${sk.name}</div><p style="font-weight:800;font-size:18px">${sk.desc}</p><button class="btn mint big" id="skOk">Awesome!</button></div>`);
    $('skOk').onclick = ()=>closeModal();
    if (sk.id==='chef' && world.inHome) showHomeMenu();
    save();
  }
}

// ===================== GAME OVER =====================
function checkGameOver(){
  if (S.settings.gentle) return false;
  const k = CRITICAL.find(k=>S.stats[k] < 50);
  if (!k) return false;
  gameOver(k); return true;
}
function gameOver(k){
  world.mode = 'over'; S.over = {stat:k, date:S.day.key}; save(); updateHUD();
  if (mini){ mini = null; $('mini').hidden = true; }
  quiz = null; endChore(true);
  if (pet) pet.anim = 'sad';
  sfx('bad');
  const st = STATS.find(s=>s.id===k);
  const why = {full:'got too hungry', energy:'got too tired', smart:'got bored without learning', motor:'needed more exercise', social:'felt lonely without friends'}[k];
  openModal('😢 Oh no!', `<div style="text-align:center"><div style="font-size:70px">${st.ic}</div>
    <div style="font-family:var(--display);font-weight:800;font-size:28px">${S.name} ${why}…</div>
    <p style="font-weight:800;font-size:17px">${st.name} dropped below 50%. Remember to keep every bar above the line!<br>${S.name} reached the ${STAGES[S.stage].name} stage with ${S.xp} XP.</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn mint big" id="goAgain">🥚 Raise ${S.name} again</button><button class="btn white" id="goNew">🎨 Design a new pet</button></div></div>`, null, {noClose:true, pause:true});
  $('goAgain').onclick = ()=>{ const d = S.design, st2 = S.settings, day = S.day; S = defaultSave(d); S.settings = st2; S.day = day; save(); location.reload(); };
  $('goNew').onclick = ()=>{ wipe(); location.reload(); };
}

// ===================== SLEEP =====================
let zzz = [];
function goSleep(){
  world.mode = 'sleep';
  closeModal(); if (mini){ mini = null; $('mini').hidden = true; } quiz = null; endChore(true);
  $('hud').hidden = true; $('bubble').hidden = true; setHint(null);
  cancelPlacing(); deselect(); world.edit = false;
  world.inHome = true; if (!parents.length) buildParents();
  parents.forEach(p=>p.root.visible = false);
  refreshTrophies(); $('placeBar').hidden = true;
  const myBed = roomItems.find(i=>i.g.userData.def.act==='sleep');
  pet.path = []; pet.busy = true; pet.carry = null; pet.jumpT = 0; pet.jumpY = 0; pet.P.root.visible = true;
  if (myBed){
    world.room = 'bed'; const c = myBed.g.position; const r = myBed.rec.rot||0;
    pet.pos.set(c.x, 0, c.z); pet.lift = 1.1; pet.dir = r;
    const side = new THREE.Vector3(Math.cos(r), 0, -Math.sin(r)), fw = new THREE.Vector3(Math.sin(r),0,Math.cos(r));
    camState.fixed = {pos:c.clone().addScaledVector(side, 5).addScaledVector(fw, 6).setY(8), look:c.clone().setY(1.4)};
    if (bedRoom){ bedRoom.light.intensity = 0.9; bedRoom.light.color.set('#ffd9a0'); bedRoom.win.material = toon('#2c2a6e'); }
  } else {
    world.room = 'living';
    const bed = homeObjs.bedPos.clone().add(HOME_O);
    pet.pos.set(bed.x, 0, bed.z+0.6); pet.lift = 1.35; pet.dir = 0;
    camState.fixed = {pos:new THREE.Vector3(bed.x+6.5, 8, bed.z+7.5), look:new THREE.Vector3(bed.x, 1.6, bed.z)};
  }
  pet.anim = 'sleep';
  scene.background = skyTexture('#1d1b4a','#4b3f8f');
  hemi.intensity = 0.28; sun.intensity = 0.15; homeObjs.roomLight.intensity = 0.9; homeObjs.roomLight.color.set('#ffd9a0');
  if (homeObjs.win) homeObjs.win.material = toon('#2c2a6e');
  musicOn = false;
  $('sleepSub').textContent = `${S.name} played for today and is sleeping at home. See you tomorrow!`;
  $('sleepScr').hidden = false;
  save();
}
function updateSleep(dt){
  const ms = nextWake() - new Date();
  const h = Math.floor(ms/3600e3), m = Math.floor(ms%3600e3/60e3), s = Math.floor(ms%60e3/1e3);
  $('sleepCount').textContent = `${h}:${pad(m)}:${pad(s)}`;
  if (Math.random() < dt*0.9){ const z = labelSprite('Z', '#ffffff', {fs:60, scale:0.5+Math.random()*0.4}); z.position.set(pet.pos.x+0.4, 3.2, pet.pos.z); z.userData.life = 3; scene.add(z); zzz.push(z); }
  zzz.forEach(z=>{ z.userData.life -= dt; z.position.y += dt*0.7; z.position.x += Math.sin(z.userData.life*3)*dt*0.4; z.material.opacity = Math.min(1, z.userData.life); });
  zzz = zzz.filter(z=>{ if (z.userData.life <= 0){ scene.remove(z); return false; } return true; });
  if (Math.random() < dt*0.25) sfx('snore');
  if (gameDayKey() !== S.day.key){ const msgs = rollDays(); save(); wakeUp(msgs); }
}
function wakeUp(msgs){
  $('sleepScr').hidden = true;
  zzz.forEach(z=>scene.remove(z)); zzz = [];
  homeObjs.roomLight.intensity = 0.12; homeObjs.roomLight.color.set('#fff2d8');
  if (bedRoom){ bedRoom.light.intensity = 0.15; bedRoom.light.color.set('#fff2d8'); bedRoom.win.material = toon('#9fe0ff'); }
  dyn.skyKey = ''; world.mode = 'play'; applySky(true);
  if (homeObjs.win) homeObjs.win.material = toon('#9fe0ff');
  parents.forEach(p=>p.root.visible = true);
  camState.fixed = null; musicOn = true;
  pet.busy = false; pet.lift = 0; pet.anim = null;
  startPlay(msgs);
}

// ===================== DESIGNER =====================
let draft = null;
function openDesigner(){
  world.mode = 'design';
  draft = randDesign(); draft.species = SLOT==='brother' ? 'dino' : 'bunny'; draft.color = SLOT==='brother' ? '#9fe3ff' : '#ffb3d1'; draft.belly = '#ffffff'; draft.pattern = 'heart'; draft.eyes = 'sparkle'; draft.mouth = 'smile'; draft.cheeks = true; draft.pers = 'cheerful';
  $('designer').hidden = false; $('loading').hidden = true;
  renderDesignerOpts(); setDesignPet(draft);
  $('dRandom').onclick = ()=>{ audioInit(); const n = draft.name; draft = randDesign(); draft.name = n; renderDesignerOpts(); setDesignPet(draft); designPet.mode='happy'; sfx('pop'); setTimeout(()=>designPet&&(designPet.mode='idle'),700); };
  $('dHatch').onclick = ()=>{ audioInit(); hatch(); };
}
function renderDesignerOpts(){
  const d = draft;
  const row = (title, list, key, labelFn) => `<div class="opt-title">${title}</div><div class="opts">${list.map(o=>`<button class="o ${d[key]===o.id?'on':''}" data-k="${key}" data-v="${o.id}">${labelFn?labelFn(o):o.name}</button>`).join('')}</div>`;
  const sw = (title, key, withNone) => `<div class="opt-title">${title}</div><div class="opts">${withNone?`<button class="o ${d[key]==='none'?'on':''}" data-k="${key}" data-v="none">None</button>`:''}${COLORS.map(c=>`<button class="sw ${d[key]===c?'on':''}" data-k="${key}" data-v="${c}" style="background:${c}" aria-label="colour ${c}"></button>`).join('')}</div>`;
  const pers = PERSONALITIES.find(p=>p.id===d.pers);
  $('dOpts').innerHTML = `
    <div class="opt-title">Name</div><input class="name" id="dName" maxlength="14" value="${d.name}">
    ${row('1 · Pick an animal', SPECIES, 'species', o=>o.em+' '+o.name)}
    ${sw('2 · Body colour', 'color')}
    ${sw('3 · Tummy colour', 'belly', true)}
    ${row('4 · Pattern', PATTERNS, 'pattern')}
    ${row('5 · Eyes', EYES, 'eyes')}
    ${row('6 · Mouth', MOUTHS, 'mouth')}
    <div class="opt-title">7 · Rosy cheeks</div><div class="opts"><button class="o ${d.cheeks?'on':''}" data-k="cheeks" data-v="1">Yes 😊</button><button class="o ${!d.cheeks?'on':''}" data-k="cheeks" data-v="0">No</button></div>
    ${row('8 · Personality', PERSONALITIES, 'pers', o=>o.em+' '+o.name)}
    <div id="persDesc">${pers.em} ${pers.desc}</div>
    <p style="font-size:13px;font-weight:700;color:#5b5880">Ideas to try: a 👽 Sprout Alien with starry eyes and spots · a mint 🦖 Dino with a star belly · a snow-white 🐥 Chick with a silly tongue. Your pet's look keeps changing as it grows up!</p>`;
  $('dName').oninput = e=>{ draft.name = e.target.value.trim() || 'Pal'; };
  $('dOpts').querySelectorAll('[data-k]').forEach(b=> b.onclick = ()=>{
    audioInit(); const k = b.dataset.k; let v = b.dataset.v; if (k==='cheeks') v = v==='1';
    draft[k] = v; const sc = $('dOpts').parentElement.scrollTop; const bsc = $('dOpts').scrollTop;
    renderDesignerOpts(); $('dOpts').scrollTop = bsc;
    setDesignPet(draft); designPet.mode = 'happy'; sfx('pop'); setTimeout(()=>designPet && (designPet.mode='idle'), 700);
  });
}
let hatchT = -1, egg = null;
function hatch(){
  if (world.mode !== 'design') return;
  draft.name = (draft.name || 'Pal').slice(0,14);
  world.mode = 'hatch'; $('designer').hidden = true;
  designStage.remove(designPet.root);
  egg = new THREE.Group();
  const shell = ball('#fff8ec', 1.25, 1, 1.3, 1, 32); shell.position.y = 1.6; egg.add(shell);
  for (let i=0;i<9;i++){ const v = new THREE.Vector3(rnd(-1,1), rnd(-0.6,0.9), rnd(-1,1)).normalize(); const sp = ball(draft.color, 0.22, 1,1,0.4); sp.position.copy(v.clone().multiplyScalar(1.22)); sp.position.y = sp.position.y*1.3 + 1.6; sp.lookAt(v.clone().multiplyScalar(5).add(new THREE.Vector3(0,1.6,0))); egg.add(sp); }
  egg.scale.setScalar(1.2); designStage.add(egg); hatchT = 0; designStage.rotation.y = 0;
}
function hatchUpdate(dt){
  if (world.mode !== 'hatch' || hatchT < 0) return;
  hatchT += dt;
  if (egg){
    const w = Math.min(1, hatchT/2.4);
    egg.rotation.z = Math.sin(hatchT*(10+w*20))*0.12*w;
    egg.position.y = Math.abs(Math.sin(hatchT*6))*0.1*w;
    if (Math.floor(hatchT*3) !== Math.floor((hatchT-dt)*3)) sfx('tap');
    if (hatchT > 2.6){ designStage.remove(egg); egg = null; setDesignPet(draft); designPet.mode = 'happy'; sfx('level');
      for (let i=0;i<30;i++){ const m = boxM(pick(['#ff5c8a','#ffd84d','#7fd3ff','#6fe3b5','#b18cff']),0.2,0.2,0.04); m.position.set(0,2.5,0); m.userData.v = new THREE.Vector3(rnd(-4,4),rnd(4,9),rnd(-4,4)); designScene.add(m); confettiD.push(m); } }
  }
  confettiD.forEach(m=>{ m.userData.v.y -= 12*dt; m.position.addScaledVector(m.userData.v, dt); m.rotation.x += dt*8; });
  if (hatchT > 5.2){
    hatchT = -1; confettiD.forEach(m=>designScene.remove(m)); confettiD = [];
    S = defaultSave(JSON.parse(JSON.stringify(draft)));
    S.slot = SLOT; S.settings.grade = SLOTS[SLOT].grade;
    rollDays(); save();
    const go = ()=>{ startNet(); enterTown(['🐣 Welcome to Pocket Pal Town!']); };
    if (!readJSON('ppt.family', null)) showFamilyLink(go); else go();
    setTimeout(()=>{ bubble(`Hi! I'm ${S.name}! Let's explore! 💖`, 4); setHint('Tap a place at the bottom (or anywhere on the map) to walk there!'); setTimeout(()=>setHint(null), 7000); }, 900);
  }
}
let confettiD = [];

// ===================== START / LOOP =====================
let townReady = false;
function enterTown(msgs){
  if (!townReady){ initTown(); townReady = true; }
  if (placeInfo.home.label){ scene.remove(placeInfo.home.label); }
  const sp = labelSprite(`🏠 Our Family Home`, '#ff8fc7', {scale:1.15}); sp.position.set(-25, 15.5, 33); scene.add(sp); placeInfo.home.label = sp; sp.userData.place='home'; clickables.push(sp);
  if (!nbs.length){ buildNeighbours(); buildGarden(); }
  if (IS_PHONE || window.innerWidth < window.innerHeight) camState.dist = 19;
  buildHUD();
  pet = null; spawnPet();
  camera.position.set(pet.pos.x+8, 14, pet.pos.z+18); camState.target.copy(pet.pos);
  if (S.day.used >= dayLimit()){ $('loading').hidden = true; $('designer').hidden = true; goSleep(); return; }
  startPlay(msgs);
}
function startPlay(msgs){
  world.mode = 'play'; world.inHome = false; world.room = null; world.edit = false;
  $('loading').hidden = true; $('designer').hidden = true; $('hud').hidden = false; $('homeMenu').hidden = true; $('placeBar').hidden = false;
  if (!bedRoom) buildBedroom();
  refreshMarks(); refreshSibling(); refreshGarden(); updateFamBadge();
  buildDynamics(); setupCollectibles(); setupWeather(); dyn.skyKey = ''; dyn.wetWarned = false; applySky(true);
  const W = WEATHERS[S.day.weather] || WEATHERS.sunny;
  msgs = (msgs||[]).concat([`${W.em} Today: ${W.name}. ${W.msg}`]); if (!S.day.chest) msgs.push('⭐ 12 sparkle stars and a 🎁 treasure chest are hidden in town today!');
  if (pet){ pet.pos.copy(placeInfo.home.door); pet.dir = 0; pet.path = []; }
  updateHUD();
  (msgs||[]).forEach((m,i)=>setTimeout(()=>toast(m, 3600), 400 + i*900));
  if (checkGameOver()) return;
  warned = {};
}
let warned = {}, hudT = 0, needT = 12, saveT = 0;
function tickPlay(dt){
  const active = world.mode==='play' && !world.paused && document.visibilityState === 'visible';
  if (!active) return;
  S.day.used += dt;
  for (const k in DECAY) gain(k, -decayRate(k)*dt, true);
  if (quiz) quizTick(dt);
  // warnings
  const left = timeLeft();
  if (left <= 60 && !warned.m1){ warned.m1 = true; toast('⏰ 1 minute left today!'); }
  if (left <= 20 && !warned.s20){ warned.s20 = true; toast('⏰ 20 seconds! Almost bedtime…'); }
  if (left <= 0){
    if ((miniOpen() || quiz) && left > -60) { /* let the activity finish */ }
    else { toast('🌙 Time for bed!'); goSleep(); return; }
  }
  needT -= dt;
  if (needT <= 0){ needT = 18; const low = CRITICAL.filter(k=>S.stats[k] < 60); if (low.length && !modalOpen() && !miniOpen()){ const lines = {full:"I'm hungry… 🍎 (Café or fridge)", energy:"I'm so sleepy… 😴 (nap at home)", smart:"I want to learn! 📚 (school)", motor:"Let's go play! 🤸 (Fun Park)", social:"I miss my friends… 💬 (park)"}; bubble(lines[pick(low)], 3.5); } }
  saveT -= dt; if (saveT <= 0){ saveT = 3; save(); }
  checkGameOver();
}
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, clockT.getDelta()); const t = clockT.elapsedTime;
  if (world.mode==='design' || world.mode==='hatch'){ renderDesign(dt); hatchUpdate(dt); return; }
  if (!townReady || !pet) return;
  if (world.mode==='play') tickPlay(dt);
  updateDynamics(dt, t); updateRoomFx(dt, t); pumpThumbs();
  famTick(dt); updateSibling(dt); updateNeighbours(dt, t);
  if (world.mode==='sleep') updateSleep(dt);
  updateSeq(dt); updateTweens(dt);
  updatePet(dt);
  if (!world.inHome || world.mode!=='play') { updateFriends(dt); updateCars(dt); }
  updateAmbient(dt, t);
  parents.forEach(p=>animatePet(p, dt, p.mode));
  if (chore && chore.id==='dust') chore.targets.forEach(g=>{ g.position.y = Math.abs(Math.sin(t*4+g.userData.bob))*0.25; });
  updateParticles(dt);
  updateCamera(dt);
  renderer.render(scene, camera);
  if (mini) updateMini(dt);
  if (world.mode==='play'){
    hudT -= dt; if (hudT <= 0){ hudT = 0.2; updateHUD(); processQueues(); }
    if (bubbleT > 0){ bubbleT -= dt; const head = pet.pos.clone(); head.y += pet.P.height + 0.5 + (pet.lift||0); const s = worldToScreen(head); const b = $('bubble'); b.style.left = s.x+'px'; b.style.top = (s.y-6)+'px'; b.hidden = miniOpen() || bubbleT <= 0; }
  } else $('bubble').hidden = true;
}
function afterSlot(){
  useSlotKeys(SLOT); ALBUM_KEY = 'pocketPalTown.album.' + SLOT; loadAlbum();
  S = load();
  if (!S){ // bring over a pet from the one-player version
    const legacy = readJSON('pocketPalTown.v1', null);
    if (legacy && legacy.design && !readJSON('ppt.legacyClaimed', false)){ S = migrate(legacy); writeJSON('ppt.legacyClaimed', true); }
  }
  if (!S){ openDesigner(); return; }
  S.slot = SLOT;
  if (!readJSON('ppt.family', null)){ $('loading').hidden = true; showFamilyLink(()=>afterSlot()); return; }
  startNet();
  if (S.over && !S.settings.gentle){ enterTown([]); return; }
  const msgs = rollDays(); save(); enterTown(msgs);
}
function boot(){
  initRenderer(); initDesignScene(); initInput();
  $('bJump').onclick = ()=>{ audioInit(); petJump(); };
  $('bPhoto').onclick = ()=>{ audioInit(); takePhoto(); };
  try{ SLOT = localStorage.getItem('ppt.slot'); }catch(e){}
  if (!SLOTS[SLOT]) showWho(afterSlot); else afterSlot();
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible' && S && world.mode!=='design') { /* day may have changed while hidden */ if (world.mode==='play' && gameDayKey() !== S.day.key){ const msgs = rollDays(); save(); startPlay(msgs); } } });
}
window.addEventListener('pointerdown', ()=>audioInit(), {once:true});
boot();
loop();

</script>
