<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pocket Pal Town</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: full-screen 3D canvas, sticker-style HUD floating in the corners, modal cards in the middle */
:root{
  --ink:#2b2a4c; --paper:#ffffff; --cream:#fff8ec;
  --pink:#ff8fc7; --sky:#7fd3ff; --sun:#ffd84d; --mint:#6fe3b5; --grape:#b18cff; --tang:#ff9f5a; --berry:#ff5c8a;
  --good:#3ccf7a; --warn:#ffb020; --bad:#ff5a5a;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#9fe0ff;color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--display);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.sticker{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
.btn{font-weight:800;font-size:18px;border:3px solid var(--ink);border-radius:16px;padding:8px 16px;background:var(--sun);box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink)} .btn.mint{background:var(--mint)} .btn.sky{background:var(--sky)} .btn.grape{background:var(--grape)} .btn.white{background:#fff} .btn.tang{background:var(--tang)}
.btn[disabled]{opacity:.45;pointer-events:none}
.big{font-size:24px;padding:12px 26px;border-radius:20px}

/* HUD — phone-first: top bar, stats strip, side buttons, bottom dock */
#hud{position:absolute;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#topBar{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:6px;align-items:stretch}
#petCard{flex:1;min-width:0;padding:5px 10px 6px;border-radius:16px}
.pcRow{display:flex;align-items:baseline;gap:6px;min-width:0}
#petName{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05;white-space:nowrap}
#petTitle{font-size:11px;font-weight:800;color:#6a5fae;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:9px;border:2px solid var(--ink);border-radius:10px;background:#efeaff;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--grape),var(--pink));transition:width .4s}
#xpText{font-size:10px;font-weight:800;color:#6a5fae;white-space:nowrap}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 9px;border-radius:16px;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.05;font-variant-numeric:tabular-nums;min-width:58px}
.chip small{font-size:10px;color:#6a5fae;font-family:var(--body)}
#ring{width:24px;height:24px;vertical-align:middle}
#stats{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:5px 8px 6px;border-radius:14px;max-width:620px}
.stat{display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:800;min-width:0}
.stat .top{display:flex;justify-content:space-between;align-items:center}
.stat .ic{font-size:14px}
.stat .bar{position:relative;height:8px;border:2px solid var(--ink);border-radius:8px;background:#f3f1f8;overflow:hidden}
.stat .bar i{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--good);transition:width .3s,background .3s}
.stat .bar b{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.stat .v{font-variant-numeric:tabular-nums}
.stat.low .bar{animation:pulse .6s infinite alternate}
.stat.flash{animation:statFlash .5s 4}
@keyframes statFlash{50%{transform:scale(1.25);filter:drop-shadow(0 0 6px #ff5a5a)}}
.stat.bonus .bar b{display:none}
@keyframes pulse{to{box-shadow:0 0 0 3px var(--bad)}}
#sideBtns{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:calc(118px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:7px;align-items:flex-end}
#wxCard{font-size:15px;flex-direction:row;gap:4px;padding:3px 8px}
.ib{position:relative;width:46px;height:46px;font-size:22px;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:0}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.badge{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;line-height:20px;border:2px solid var(--ink);font-family:var(--body)}
#placeBar{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:6px;max-width:600px;margin:0 auto;border-radius:18px}
.pb{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:800;border:3px solid var(--ink);border-radius:13px;padding:4px 2px;min-width:0;box-shadow:0 3px 0 var(--ink);white-space:nowrap;overflow:hidden}

.pb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#toasts{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:calc(120px + env(safe-area-inset-right,0px));top:calc(112px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none;z-index:40;max-width:560px}
.toast{font-family:var(--body);font-weight:800;font-size:13px;line-height:1.25;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.82);border:2px solid rgba(43,42,76,.6);box-shadow:none;color:var(--ink);animation:tin .25s ease-out;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toast.hintT{background:rgba(255,248,200,.92)}
@keyframes tin{from{transform:translateY(-10px) scale(.9);opacity:0}}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.fl{position:absolute;font-family:var(--display);font-weight:800;font-size:20px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke;white-space:nowrap;animation:flUp 1.6s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes flUp{to{margin-top:-70px;opacity:0}}
#bubble{position:absolute;padding:6px 12px;font-family:var(--display);font-weight:800;font-size:16px;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;z-index:25;max-width:80vw;overflow:hidden;text-overflow:ellipsis}
#bubble:after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink)}
#bJump{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);box-shadow:0 5px 0 var(--ink);font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
#bJump small{font-size:12px;font-weight:800}
#bJump:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#hint{display:none!important}
#joy{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(43,42,76,.55);display:none;touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);pointer-events:none}

#npcBubble{position:absolute;padding:6px 12px;font-family:var(--display);font-weight:800;font-size:15px;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;z-index:25;background:#fffbe6!important;max-width:80vw;overflow:hidden;text-overflow:ellipsis}
#flashFx{position:absolute;inset:0;background:radial-gradient(circle,#fff 0%,#fff9d6 60%,rgba(255,240,180,0) 100%);opacity:0;pointer-events:none;z-index:40}
#flashFx.go{animation:flashGo 1s ease-out}

#bigBanner{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(26px,8vw,48px);line-height:1.05;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink),0 0 24px #ffd84d;pointer-events:none;z-index:41;opacity:0;white-space:nowrap}
#bigBanner small{display:block;font-size:.45em;-webkit-text-stroke:1px var(--ink)}
#bigBanner.go{animation:bannerGo 2.6s ease-out forwards}
@keyframes bannerGo{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-8deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(3deg)}25%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
#walkSign{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(222px + env(safe-area-inset-bottom,0px));width:62px;padding:5px 0 4px;border-radius:14px;display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:800;font-size:13px;color:#fff;pointer-events:none;background:#2b2a4c!important}
#walkSign b{font-size:26px;line-height:30px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
#walkSign.ws-green b{background:#2fd36a} #walkSign.ws-red b{background:#ff3b3b} #walkSign.ws-warn b{background:#ffc21a;animation:wsBlink .5s steps(2) infinite}
#walkSign.ws-warn span{color:#ffd84d} #walkSign.ws-red span{color:#ff8a8a} #walkSign.ws-green span{color:#8dffb4}
@keyframes wsBlink{50%{opacity:.35}}
#actBtns{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(236px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;width:min(240px,58vw);z-index:6}
#actBtns button{font-family:var(--display);font-weight:800;font-size:15px;padding:8px 12px;border-radius:16px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);white-space:normal;line-height:1.15;max-width:100%;animation:actPop .25s ease-out}
#actBtns button.talk{background:#8ef0c4} #actBtns button.enter{background:#ffd84d}
@keyframes actPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

#bRun{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(170px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);font-size:24px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}

#bRun.on{background:var(--tang)}

#warpFx{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:radial-gradient(circle,#fff6c9 0%,#ffc6e5 60%,#c7ecff 100%);transition:opacity .3s;font-family:var(--display);font-weight:800;font-size:28px;color:var(--ink);pointer-events:none}
#warpFx span{font-size:56px;animation:hop .5s infinite alternate}
@keyframes hop{to{transform:translateY(-14px)}}
.menuGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.menuGrid .btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;padding:10px 6px}
.menuGrid .btn span{font-size:30px}
@media (min-width:900px){ #topBar{right:auto;width:560px} #sideBtns{top:calc(10px + env(safe-area-inset-top,0px))} }

/* Modal */
.overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(transparent 30%,rgba(43,42,76,.18));z-index:50;padding:calc(10px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-sizing:border-box}
.modal{width:min(760px,100%);max-height:min(60vh,620px);display:flex;flex-direction:column;overflow:hidden;animation:sheetUp .22s ease-out}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
@media (max-height:520px){ .modal{max-height:78vh} }
.mhead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid var(--ink);font-family:var(--display);font-weight:800;font-size:24px}
.mhead .x{margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.card{border:3px solid var(--ink);border-radius:16px;padding:10px;background:var(--cream);display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.card .em{font-size:40px;line-height:1.1}
.card .nm{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1}

/* School */
.board{background:#2f6b4f;border:6px solid #a8743f;border-radius:16px;color:#fff;padding:16px;box-shadow:inset 0 0 0 3px #245a41}

.ans{font-size:22px;font-weight:800;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:12px 8px;box-shadow:0 4px 0 var(--ink)}

.subj{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}

/* Designer */
#designer{position:absolute;inset:0;pointer-events:none}
#designer > *{pointer-events:auto}
#dPanel{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(430px,48vw);display:flex;flex-direction:column;overflow:hidden}

#dTitle{position:absolute;left:max(18px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,52px);line-height:.95;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke;text-shadow:0 5px 0 var(--ink)}

#dBottom{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap}
input.name{font-family:var(--display);font-weight:800;font-size:22px;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}

/* Full screens */

.homeMenu{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px;max-width:760px;margin:0 auto;border-radius:18px}

// ---- Real-time day: a new "game day" starts at 06:00 local time ----
function gameDayKey(d){ d = d || new Date(); const t = new Date(d.getTime() - 6*3600e3); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); }
function keyToNum(k){ const [y,m,d] = k.split('-').map(Number); return Date.UTC(y,m-1,d)/86400e3; }
function nextWake(){ const n = new Date(); const w = new Date(n); w.setHours(6,0,0,0); if (w <= n) w.setDate(w.getDate()+1); return w; }
function dayLimit(){ return (S.settings.minutes||5)*60 + (S.day && S.day.bonus || 0); }
function timeLeft(){ return Math.max(0, dayLimit() - S.day.used); }

function newDayRecord(key){
  return {key, used:0, bonus:0, jobs:shuffle(CHORES.map(c=>c.id)).slice(0,3), done:[], comp:false, sports:false, naps:0, junk:0, lessons:0, greeted:{}, weather:pickWeather(key), starsTaken:[], chest:false, acts:{}, placed:0, photos:0, trees:0, roomBonus:false};
}
// returns list of messages for the morning
function rollDays(){
  const key = gameDayKey();
  const msgs = [];
  if (!S.day){ S.day = newDayRecord(key); return msgs; }
  if (S.day.key === key) return msgs;
  const n = clamp(keyToNum(key) - keyToNum(S.day.key), 1, 7);
  for (let i=0;i<n;i++){
    for (const k in OVERNIGHT) S.stats[k] = clamp(S.stats[k] + OVERNIGHT[k], 0, 100);
  }
  if (n > 1) msgs.push(`You were away ${n} days — ${S.name} missed you!`);
  S.day = newDayRecord(key);
  S.c.days++;
  const allowance = 10;
  S.coins += allowance;
  msgs.push(`☀️ Good morning! Mama & Papa gave you ${allowance} 🪙 pocket money.`);
  return msgs;
}

const has = id => S.skills.includes(id);
const hasEq = id => S.equip.includes(id) && !S.equipOff.includes(id);
function persMul(stat){
  const p = S.design.pers;
  if (p==='curious' && stat==='smart') return 1.2;
  if (p==='sporty' && stat==='motor') return 1.2;
  if (p==='friendly' && stat==='social') return 1.2;
  if (p==='foodie' && stat==='full') return 1.2;
  if (p==='cheerful' && stat==='fun') return 1.2;
  return 1;
}
function decayRate(k){
  let r = DECAY[k];
  if (k==='full' && hasEq('basket')) r *= 0.75;
  if (k==='energy' && hasEq('bottle')) r *= 0.8;
  if (k==='social' && has('magnet')) r *= 0.6;
  if (k==='fun' && S.design.pers==='cheerful') r *= 0.8;
  return r;
}
const PROFILE_OF = {smart:'brain', motor:'body', social:'heart'};
// change a stat; positive gains get personality bonus and feed the development profile
function gain(k, amt, silent){
  if (amt > 0) amt *= persMul(k);
  const before = S.stats[k];
  S.stats[k] = clamp(before + amt, 0, 100);
  const real = S.stats[k] - before;
  if (amt > 0 && PROFILE_OF[k]) S.profile[PROFILE_OF[k]] += amt;
  if (!silent && Math.abs(amt) >= 0.5){
    const st = STATS.find(s=>s.id===k);
    floatText((amt>0?'+':'')+Math.round(amt)+' '+st.ic, amt>0 ? null : '#ff9d9d');
  }
  return real;
}
function addCoins(n){ S.coins += n; floatText('+'+n+' 🪙','#ffe066'); sfx('coin'); }
function xpMul(){ let m = 1; if (S.stats.fun >= 70) m *= 1.2; if (S.day && S.day.weather==='rainbow') m *= 1.2; if (has('superstar')) m *= 1.25; return m; }
function addXP(n){
  n = Math.round(n * xpMul());
  if (n <= 0) return;
  S.xp += n;
  floatText('+'+n+' XP','#d6c6ff');
  checkGrowth();
}
function dominantForm(){
  let best = 'heart', v = -1;
  for (const k in S.profile) if (S.profile[k] > v){ v = S.profile[k]; best = k; }
  return best;
}
let growthQueue = [];
function checkGrowth(){
  while (S.stage < STAGES.length-1 && S.xp >= STAGES[S.stage+1].xp){
    S.stage++;
    const f = dominantForm();
    if (!S.forms.includes(f)) S.forms.push(f);
    S.line = f;
    const snapshot = Object.assign({}, S.profile);
    for (const k in S.profile) S.profile[k] = 0; // new growth period starts
    growthQueue.push({stage:S.stage, form:f, profile:snapshot});
  }
  checkSkills();
}
let skillQueue = [];
function checkSkills(){
  for (const sk of SKILLS){
    if (!S.skills.includes(sk.id) && sk.ok(S)){ S.skills.push(sk.id); skillQueue.push(sk); }
  }
}
function petTitle(){
  const st = STAGES[S.stage].name;
  const ln = S.line || S.forms[S.forms.length-1];
  if (ln && S.stage >= 1) return evoName(ln, S.stage);

function tone(f, t0, dur, type, vol, dest, slide){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0+dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol||0.3, t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0+dur+0.05);
}

// cheerful looping tune (pentatonic), scheduled ahead
function startMusic(){
  if (!AC) return;
  const mel = [0,4,7,9,7,4,2,4, 0,2,4,7,9,12,9,7, 5,9,12,9,7,4,2,0, 2,4,7,4,2,0,-3,0];
  const bass = [0,0,5,5,-3,-3,7,7];
  const base = 392; let step = 0; let next = AC.currentTime + 0.1; const beat = 0.24;
  const f = n => base * Math.pow(2, n/12);
  clearInterval(musicTimer);
  musicTimer = setInterval(()=>{
    if (!AC) return;
    while (next < AC.currentTime + 0.5){
      if (S && S.settings.music && S.settings.sound && musicOn){
        const n = mel[step % mel.length];
        if (step % 8 !== 7) tone(f(n), next, beat*0.9, 'triangle', 0.22, musicGain);
        if (step % 4 === 0) tone(f(bass[(step/4|0) % bass.length]-24), next, beat*3.5, 'sine', 0.35, musicGain);
      }
      next += beat; step++;
    }
  }, 120);
}

// ===================== QUIZ GENERATION =====================
function mcq(q, ans, wrongs){
  const opts = shuffle([String(ans), ...wrongs.map(String)].filter((v,i,a)=>a.indexOf(v)===i)).slice(0,4);
  if (!opts.includes(String(ans))) opts[0] = String(ans);
  return {q, a:String(ans), opts:shuffle(opts)};
}
function numWrongs(ans, spread){
  const s = new Set();
  let guard = 0;
  while (s.size < 3 && guard++ < 50){
    let w = ans + (Math.random()<0.5?-1:1) * ri(1, spread);
    if (w >= 0 && w !== ans) s.add(w);
  }
  while (s.size < 3) s.add(ans + s.size + 1);
  return [...s];
}
function mathQ(grade){
  const g = clamp(grade,2,5);
  const kinds = g===2 ? ['add','sub','times','money','compare','pattern']
             : g===3 ? ['add3','sub3','times','div','word','fraction','pattern']
             : ['mul2','divr','word2','fraction2','area','time24','factor'];
  const k = pick(kinds);
  let a,b,ans;
  switch(k){
    case 'add': a=ri(12,68); b=ri(9,31); ans=a+b; return mcq(`${a} + ${b} = ?`, ans, numWrongs(ans,10));
    case 'sub': a=ri(40,99); b=ri(11,a-5); ans=a-b; return mcq(`${a} − ${b} = ?`, ans, numWrongs(ans,10));
    case 'times': a=g===2?pick([2,5,10,3,4]):ri(2,9); b=ri(2,9); ans=a*b; return mcq(`${a} × ${b} = ?`, ans, numWrongs(ans,a));
    case 'money': a=ri(1,5); b=ri(1,4); ans=a*10+b*2; return mcq(`You have ${a} ten-dollar coins and ${b} two-dollar coins. How much?`, '$'+ans, numWrongs(ans,6).map(v=>'$'+v));
    case 'compare': a=ri(10,99); b=ri(10,99); if(a===b)b++; ans = a>b ? a : b; return mcq(`Which number is bigger: ${a} or ${b}?`, ans, [a+b===ans?a:Math.min(a,b), ans-10>0?ans-10:ans+20, ans+1]);
    case 'pattern': { a=ri(2,10); b=ri(1,20); const s=[b,b+a,b+2*a,b+3*a]; ans=b+4*a; return mcq(`What comes next? ${s.join(', ')}, ?`, ans, numWrongs(ans,a)); }
    case 'add3': a=ri(120,680); b=ri(105,310); ans=a+b; return mcq(`${a} + ${b} = ?`, ans, numWrongs(ans,20).concat([ans+100]).slice(0,3));
    case 'sub3': a=ri(400,999); b=ri(101,a-50); ans=a-b; return mcq(`${a} − ${b} = ?`, ans, numWrongs(ans,20));
    case 'div': b=ri(2,9); ans=ri(2,9); a=b*ans; return mcq(`${a} ÷ ${b} = ?`, ans, numWrongs(ans,3));
    case 'word': { const it=pick(['apples','stickers','sweets','pencils']); a=ri(3,8); b=ri(3,9); ans=a*b; return mcq(`There are ${a} bags with ${b} ${it} in each. How many ${it} altogether?`, ans, numWrongs(ans,b).concat([a+b]).slice(0,3)); }
    case 'fraction': { const fr = shuffle([[1,2],[1,3],[1,4],[1,5],[1,8]]).slice(0,2); const big = fr[0][1] < fr[1][1] ? fr[0] : fr[1]; return mcq(`Which is bigger: 1/${fr[0][1]} or 1/${fr[1][1]} of a pizza?`, '1/'+big[1], ['1/'+(big===fr[0]?fr[1][1]:fr[0][1]),'They are the same','0']); }
    case 'mul2': a=ri(12,99); b=ri(2,9); ans=a*b; return mcq(`${a} × ${b} = ?`, ans, numWrongs(ans,b*3));
    case 'divr': b=ri(3,9); a=ri(20,80); { const q=Math.floor(a/b), r=a%b; return mcq(`${a} ÷ ${b} = ? (with remainder)`, `${q} R${r}`, [`${q+1} R${r}`, `${q} R${(r+1)%b}`, `${Math.max(q-1,0)} R${r}`]); }
    case 'word2': { a=ri(3,9)*10; b=ri(2,6); ans=a*b; return mcq(`A book costs $${a}. How much do ${b} books cost?`, '$'+ans, numWrongs(ans,a/2|0).map(v=>'$'+v)); }
    case 'fraction2': { const d=pick([5,6,8,10]); a=ri(1,d-3); b=ri(1,d-a-1); return mcq(`${a}/${d} + ${b}/${d} = ?`, `${a+b}/${d}`, [`${a+b}/${d*2}`, `${a+b+1}/${d}`, `${Math.max(a+b-1,1)}/${d}`]); }
    case 'area': a=ri(3,12); b=ri(2,9); ans=a*b; return mcq(`A rectangle is ${a} cm long and ${b} cm wide. What is its area?`, ans+' cm²', [2*(a+b)+' cm²', (ans+a)+' cm²', (a+b)+' cm²']);
    case 'time24': { const h=ri(13,22), m=pick(['00','15','30','45']); return mcq(`${h}:${m} in the 24-hour clock is…`, `${h-12}:${m} p.m.`, [`${h-10}:${m} p.m.`, `${h-12}:${m} a.m.`, `${h}:${m} a.m.`]); }
    case 'factor': { const n=pick([12,18,20,24,30,36]); const f=pick([...Array(n).keys()].slice(2).filter(x=>n%x===0&&x<n)); const nf=[...Array(n).keys()].slice(2).filter(x=>n%x!==0); return mcq(`Which number is a factor of ${n}?`, f, shuffle(nf).slice(0,3)); }
  }
}
function bankQ(bank){ const [q,a,w] = pick(bank); return mcq(q, a, w); }
function makeLesson(subject, n, gradeBoost){
  const g = (S.settings.grade||3) + (gradeBoost||0);
  const out = []; const seen = new Set();
  let guard = 0;
  while (out.length < n && guard++ < 80){
    let q;
    if (subject==='math') q = mathQ(g);
    else if (subject==='english') q = bankQ(ENGLISH);
    else if (subject==='chinese') q = bankQ(CHINESE);
    else if (subject==='general') q = bankQ(GENERAL);
    else q = pick([()=>mathQ(g),()=>bankQ(ENGLISH),()=>bankQ(GENERAL),()=>bankQ(CHINESE)])();
    if (seen.has(q.q)) continue; seen.add(q.q);
    q.lang = (subject==='chinese' || /[一-鿿]/.test(q.q)) ? 'zh-HK' : 'en-GB';
    out.push(q);
  }
  return out;
}

const GEO = {};
function sphereGeo(seg){ seg = seg||24; return GEO['s'+seg] || (GEO['s'+seg] = new THREE.SphereGeometry(1, seg, Math.round(seg*0.75))); }
function ball(color, r, sx, sy, sz, seg){

}

function cyl(color, rt, rb, h, seg){ const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg||16), toon(color)); m.castShadow = true; return m; }
function cone(color, r, h, seg){ const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg||16), toon(color)); m.castShadow = true; return m; }

  h.bezierCurveTo(-0.55*s,0.45*s, -0.15*s,0.55*s, 0, 0.3*s);
  h.bezierCurveTo(0.15*s,0.55*s, 0.55*s,0.45*s, 0.55*s,0.15*s);

// design: {species, color, belly, pattern, eyes, mouth, cheeks, pers, name}

function buildPet(design, o){

// animate a pet rig. mode: idle | walk | happy | sleep | eat | work | sad | ride
function animatePet(P, dt, mode){
  P.t += dt; const t = P.t;
  mode = mode || P.mode;
  const rig = P.rig;
  rig.position.set(0,0,0); rig.rotation.set(0,0,0); rig.scale.set(1,1,1);
  P.head.rotation.set(0,0,0);
  let armSwing = 0, footSwing = 0;
  if (mode==='walk'){
    const s = Math.sin(t*13);
    if (P.skate && P.skate.visible){ rig.position.y = 0.18; rig.rotation.z = Math.sin(t*3)*0.06; }
    else { rig.position.y = Math.abs(s)*0.16; rig.rotation.z = s*0.07; footSwing = s; armSwing = s; }
    P.head.rotation.z = -s*0.04;
  } else if (mode==='happy'){
    const j = Math.abs(Math.sin(t*7)); rig.position.y = j*0.7; rig.scale.set(1+(1-j)*0.08, 1-(1-j)*0.08, 1+(1-j)*0.08);
    armSwing = 1.4; P.arms.forEach((a,i)=>{ a.rotation.z = (i?1:-1)*(-1.8 + Math.sin(t*14)*0.3); });
  } else if (mode==='sleep'){
    rig.rotation.x = -Math.PI/2; rig.scale.y = 1 + Math.sin(t*2)*0.025; rig.scale.x = 1 + Math.sin(t*2)*0.015;
    P.arms.forEach((a,i)=>{ a.rotation.z = (i?1:-1)*-0.25; });
  } else if (mode==='eat'){
    P.head.rotation.x = Math.sin(t*16)*0.12; rig.scale.y = 1 + Math.sin(t*16)*0.03;
  } else if (mode==='work'){
    rig.rotation.y = Math.sin(t*9)*0.25; armSwing = Math.sin(t*12)*1.2; rig.position.y = Math.abs(Math.sin(t*9))*0.08;
  } else if (mode==='sad'){
    P.head.rotation.x = 0.25; rig.scale.y = 0.95;
  } else if (mode==='ride'){
    armSwing = 0; P.arms.forEach((a,i)=>{ a.rotation.z = (i?1:-1)*-2.4; });
  } else { // idle
    rig.scale.y = 1 + Math.sin(t*2.6)*0.025; rig.scale.x = rig.scale.z = 1 - Math.sin(t*2.6)*0.012;
    P.head.rotation.z = Math.sin(t*1.3)*0.05;
  }
  if (mode!=='happy' && mode!=='ride'){
    P.arms.forEach((a,i)=>{ const s = i?1:-1; a.rotation.z = s*-0.5 + (mode==='work'? s*-0.6:0); a.rotation.x = armSwing*(i?-0.6:0.6); });
  }
  P.feet.forEach((f,i)=>{ f.position.z = 0.06 + footSwing*(i?0.16:-0.16); f.position.y = 0.11 + Math.max(0, footSwing*(i?1:-1))*0.08; if (P.claws) P.claws[i].position.set(f.position.x, f.position.y, f.position.z); if (P.legs) P.legs[i].position.z = 0.04 + footSwing*(i?0.08:-0.08); });
  P.ears.forEach((e,i)=>{ e.rotation.x = Math.sin(t*3+i)*0.08 + (mode==='walk'? Math.sin(t*13)*0.12:0); });
  if (P.tail) P.tail.rotation.y = Math.sin(t*(mode==='walk'?10:4))*0.4;
  if (P.spinner) P.spinner.rotation.y = t*2;
  if (P.heartAnt) P.heartAnt.scale.setScalar(1 + Math.sin(t*6)*0.12);
  if (P.halo) P.halo.rotation.y = t*0.8;
  if (P.orbit) P.orbit.rotation.y = t*1.6;
  if (P.haloRing) P.haloRing.position.y += Math.sin(t*2.4)*0.0015;
  if (P.gearHalo) P.gearHalo.rotation.z = t*0.7;
  if (P.auraRings) P.auraRings.rotation.y = t*2.2;
  if (P.flames) P.flames.forEach((f,i)=>{ const k = 1 + Math.sin(t*22 + i*2)*0.18 + Math.random()*0.08; f.scale.set(k, k*(mode==='walk'?1.3:1), k); });
  if (P.wingL){ const fl = Math.sin(t*(mode==='walk'||mode==='happy'?12:2.6))*0.28; P.wingL.rotation.y = 0.35 + fl; P.wingR.rotation.y = -0.35 - fl; if (P.wingL2){ P.wingL2.rotation.y = 0.5 + fl*0.8; P.wingR2.rotation.y = -0.5 - fl*0.8; } }
  if (P.propeller) P.propeller.rotation.y = t*(mode==='walk'?25:8);
  if (P.cape) P.cape.rotation.x = mode==='walk' ? -0.35 + Math.sin(t*10)*0.06 : -0.05;
  if (P.wing1){ const fl = Math.sin(t*(mode==='walk'?14:3))*0.25; P.wing1.rotation.y = 0.5+fl; P['wing-1'].rotation.y = -0.5-fl; }
  // blinking
  P.blink -= dt;
  let ey = 1;
  if (mode==='sleep') ey = 0.12;
  else if (P.blink < 0){ ey = 0.1; if (P.blink < -0.13) P.blink = 2 + Math.random()*3.5; }
  P.eyes.forEach(e=> e.scale.y = ey);
}

function makeHouse(o){

  const body = boxM(o.color, w, h, d); body.position.y = h/2; g.add(body);
  const base = boxM(shade(o.color,0.8), w+0.3, 0.5, d+0.3); base.position.y = 0.25; g.add(base);
  // roof
  const roofH = o.roofH || 3.2;
  const roof = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 1, 1, 4, 1), toon(o.roof));
  roof.rotation.y = Math.PI/4; roof.scale.set((w+1.6)*0.72, roofH, (d+1.6)*0.72); roof.position.y = h + roofH/2; roof.castShadow = true; g.add(roof);

  const knob = ball('#ffd84d', 0.12); knob.position.set(0.5, 1.8, d/2+0.2); g.add(knob);
  const step = boxM('#d9cbb5', 2.6, 0.3, 1.2); step.position.set(0, 0.15, d/2+0.6); g.add(step);
  // windows
  const nw = Math.max(1, Math.floor(w/4));
  for (let i=0;i<2;i++){ const wm = windowMesh(1.5,1.4); wm.position.set((i?1:-1)*w*0.3, h*0.55, d/2+0.02); g.add(wm); }
  if (h > 7){ for (let i=0;i<3;i++){ const wm = windowMesh(1.4,1.3); wm.position.set((i-1)*w*0.3, h*0.85, d/2+0.02); g.add(wm);} }

  if (o.flowers !== false){
    [-1,1].forEach(s=>{ const fb = boxM('#a8743f', 1.8, 0.4, 0.5); fb.position.set(s*w*0.3, h*0.55-1.0, d/2+0.3); g.add(fb);
      for (let i=0;i<3;i++){ const fl = ball(pick(['#ff5c8a','#ffd84d','#ffffff','#b18cff']), 0.22); fl.position.set(s*w*0.3+(i-1)*0.55, h*0.55-0.7, d/2+0.35); g.add(fl);} });
  }

}
function placeBuilding(group, x, z, rot, place){

}

function petSpeed(){
  let s = 9;
  if (isRunning()) s *= 1.75;
  if (has('speedy')) s *= 1.3;
  if (hasEq('skateboard')) s *= 1.5;
  if (S.stats.energy < 60) s *= 0.8;
  if (world.inHome) s = 6;
  return s;
}
function segClear(a, b){
  const d = a.distanceTo(b); const n = Math.ceil(d/0.8);
  for (let i=1;i<=n;i++){ const x = a.x+(b.x-a.x)*i/n, z = a.z+(b.z-a.z)*i/n; if (blocked(x,z,0.7)) return false; }
  return true;
}
function blocked(x,z,r){ for (const o of obstacles) if (x>o.minx-r && x<o.maxx+r && z>o.minz-r && z<o.maxz+r) return true; return false; }
function walkTo(target, onArrive, via, warpLabel){
  if (!pet || pet.busy) return;
  pet.path = planPath(pet.pos, target);
  pet.onArrive = onArrive || null;
  pet.stuck = 0; pet.warp = null; pet.waitedRed = false;
  if (warpLabel) startWarp(target, onArrive, warpLabel);
}
function goPlace(id, warp){
  if (!pet || pet.busy) return;

  const pi = placeInfo[id];
  setHint(null);
  const pl = PLACES.find(p=>p.id===id); const b = typeof BUILDINGS !== 'undefined' ? BUILDINGS.find(x=>x.id===id) : null;
  walkTo(pi.door, ()=>arriveAt(id), null, warp ? (pl ? pl.em + ' ' + pl.name : b ? b.title : '') : null);
  sfx('tap');
}
function updatePet(dt){
  if (!pet) return;
  const P = pet.P;
  let moving = false;
  if (!pet.busy && !world.edit){
    // keyboard
    let kx = (keys.ArrowRight||keys.d?1:0) - (keys.ArrowLeft||keys.a?1:0);
    let kz = (keys.ArrowDown||keys.s?1:0) - (keys.ArrowUp||keys.w?1:0);
    if (joy.on && Math.hypot(joy.x, joy.y) > 0.15){ kx = joy.x; kz = joy.y; }
    if (kx || kz){
      pet.path = []; pet.onArrive = null;
      const yaw = camState.yaw;
      const fx = -Math.sin(yaw), fz = -Math.cos(yaw); const rx = Math.cos(yaw), rz = -Math.sin(yaw);
      const mx = rx*kx + fx*-kz, mz = rz*kx + fz*-kz;
      const len = Math.hypot(mx,mz)||1;
      const sp = petSpeed()*dt*Math.min(1, Math.hypot(kx, kz));
      moveBy(mx/len*sp, mz/len*sp);
      pet.warp = null;
      pet.dir = Math.atan2(mx, mz); moving = true;
    }
  }
  if (pet.warp && pet.path.length){ pet.warp.t -= dt; if (pet.warp.t <= 0) doWarp(); }
  else if (pet.warp && !pet.path.length) pet.warp = null;
  const gateOK = !pet.path.length || onRoadAt(pet.pos.x, pet.pos.z) || world.inHome || crossingGate(pet.path[0]);
  if (pet.path.length && gateOK){
    const tgt = pet.path[0];
    const dx = tgt.x - pet.pos.x, dz = tgt.z - pet.pos.z; const d = Math.hypot(dx,dz);
    const sp = petSpeed()*dt;
    if (d <= sp){ pet.pos.x = tgt.x; pet.pos.z = tgt.z; pet.path.shift(); pet.stuck = 0;
      if (!pet.path.length && pet.onArrive){ const f = pet.onArrive; pet.onArrive = null; f(); }
    } else {
      const before = pet.pos.clone();
      moveBy(dx/d*sp, dz/d*sp, true);
      pet.dir = Math.atan2(dx, dz); moving = true;

function onTap(x, y){

    if (hits.length && !pet.busy){ walkTo(hits[0].point.clone().setY(0)); tapMarker(hits[0].point); }
    return;
  }
  // tapping the pet itself
  const ph = ray.intersectObject(pet.P.root, true);
  if (ph.length){ petPoke(); return; }
  const hits = ray.intersectObjects(clickables, true);
  const fh = hits.find(h=>h.object.userData && h.object.userData.friend !== undefined);
  if (fh){ goFriend(fh.object.userData.friend); return; }
  for (const h of hits){
    let o = h.object; let ud = null, obj = null;
    while (o){ const u = o.userData; if (u && (u.place || u.friend !== undefined || u.tree || u.car || u.duck !== undefined || u.sibling || u.nb || u.garden)){ ud = u; obj = o; break; } o = o.parent; }
    if (!ud) continue;

    if (ud.tree){ shakeTree(obj); return; }
    if (ud.car){ honk(obj); return; }
    if (ud.duck !== undefined){ quack(); return; }
    if (ud.sibling){ openFamily(); return; }
    if (ud.nb){ goNeighbour(ud.nb); return; }

}

function updateCamera(dt){

  } else if (world.inHome){

function posterTex(bg, draw){
  return canvasTex(256, 340, (g,w,h)=>{ g.fillStyle = bg; g.fillRect(0,0,w,h); draw(g,w,h); });
}
function emoTex(g, em, x, y, s){ g.font = `${s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(em, x, y); }
function poster(tex, fw, fh, frame){
  const g = GG(); put(g, boxM(frame||'#ffffff', fw+0.25, fh+0.25, 0.12), 0, 0, 0);
  put(g, texPlane(tex, fw, fh), 0, 0, 0.07); return g;
}

}

const PET_PHOTOS = (window.PET_PHOTOS || []);
let ALBUM = [];
let ALBUM_KEY = 'pocketPalTown.album';
function loadAlbum(){ try{ ALBUM = JSON.parse(localStorage.getItem(ALBUM_KEY) || '[]'); }catch(e){ ALBUM = []; } }
function saveAlbum(){ try{ localStorage.setItem(ALBUM_KEY, JSON.stringify(ALBUM)); }catch(e){ toast('Album is full — remove an old photo'); } }
function photoFrameDef(id){
  let src = null, name = 'Photo';
  if (id.startsWith('photo:')){ const p = PET_PHOTOS[+id.slice(6)]; if (!p) return null; src = p.data; name = p.name; }
  else if (id.startsWith('album:')){ const p = ALBUM.find(a=>a.id===id.slice(6)); if (!p) return null; src = p.data; name = 'My snapshot'; }
  else return null;
  return {id, cat:'photos', wall:true, name, em:'🖼️', price:0, cozy:2, fp:[2,0.2], build(){
    const g = GG(); put(g, boxM(pick(['#ff8fc7','#ffd84d','#7fd3ff','#ffffff']), 2.1, 1.6, 0.12));
    const tex = new THREE.TextureLoader().load(src, t=>{ const a = t.image.width/t.image.height, want = 1.85/1.35; if (a > want){ t.repeat.set(want/a,1); t.offset.set((1-want/a)/2,0); } else { t.repeat.set(1,a/want); t.offset.set(0,(1-a/want)/2); } t.needsUpdate = true; });
    put(g, texPlane(tex, 1.85, 1.35), 0, 0, 0.07); return g; }};
}
function decorDef(id){ return DECOR.find(d=>d.id===id) || photoFrameDef(id); }
function decorPrice(d){ return Math.round(d.price * (has('designer') ? 0.8 : 1)); }

// ---------- bedroom ----------
let bedRoom = null; // {root, floor, walls:[], wallMat, floorMat}
let roomItems = [];  // {rec, g}
function buildBedroom(){
  const g = GG(); g.position.copy(HOME_B); scene.add(g);
  const floorMat = toon('#ffffff'); const wallMat = new THREE.MeshToonMaterial({color:'#ffffff', gradientMap:gradMap()}); const floorM = new THREE.MeshToonMaterial({color:'#ffffff', gradientMap:gradMap()});
  const floor = new THREE.Mesh(new THREE.BoxGeometry(BW, 0.4, BD), floorM); floor.position.y = -0.2; floor.receiveShadow = true; g.add(floor);
  const back = new THREE.Mesh(new THREE.BoxGeometry(BW, WH, 0.4), wallMat); back.position.set(0, WH/2, -BD/2); back.receiveShadow = true; g.add(back);
  const left = new THREE.Mesh(new THREE.BoxGeometry(0.4, WH, BD), wallMat); left.position.set(-BW/2, WH/2, 0); left.receiveShadow = true; g.add(left);
  const right = new THREE.Mesh(new THREE.BoxGeometry(0.4, WH, BD), wallMat); right.position.set(BW/2, WH/2, 0); right.receiveShadow = true; g.add(right);
  // skirting & window & door
  [[0,-BD/2+0.25,BW,0.3],[-BW/2+0.25,0,0.3,BD],[BW/2-0.25,0,0.3,BD]].forEach(s=>{ const b = boxM('#ffffff', s[2], 0.5, s[3]); b.position.set(s[0], 0.25, s[1]); g.add(b); });
  const win = windowMesh(3.4, 2.6); win.position.set(4.5, 5.2, -BD/2+0.25); g.add(win); bedRoom = {root:g, floor, walls:[back,left,right], wallMat, floorM, win:win.children[1]};
  const door = boxM('#ff8fc7', 0.2, 3.6, 2.2); door.position.set(BW/2-0.15, 1.8, BD/2-2.2); g.add(door);
  const knob = ball('#ffd84d', 0.12); knob.position.set(BW/2-0.35, 1.8, BD/2-1.4); g.add(knob);
  const lt = new THREE.PointLight('#fff2d8', 0.15, 30); lt.position.set(0, 7, 2); g.add(lt); bedRoom.light = lt;
  const name = labelSprite(`${S.name}'s Room`, '#ffd84d', {fs:44, scale:0.7}); name.position.set(0, 7.0, -BD/2+0.4); g.add(name); bedRoom.nameLabel = name;
  applyStyles(); applyRoom();
}
function styleTex(id){ const s = STYLES.find(x=>x.id===id); const t = canvasTex(256,256,s.draw); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }
function applyStyles(){
  if (!bedRoom) return;
  const wt = styleTex(S.room.paper); wt.repeat.set(4, 2); bedRoom.wallMat.map = wt; bedRoom.wallMat.needsUpdate = true;
  const ft = styleTex(S.room.floor); ft.repeat.set(4, 3); bedRoom.floorM.map = ft; bedRoom.floorM.needsUpdate = true;
}
function fpOf(def, rot){ const q = Math.round(rot/(Math.PI/2)) % 2; return q ? [def.fp[1], def.fp[0]] : [def.fp[0], def.fp[1]]; }
function makeItemGroup(rec, origin){
  origin = origin || HOME_B;
  const def = decorDef(rec.id); if (!def) return null;
  const g = def.build();
  g.traverse(m=>{ if (m.isMesh){ m.castShadow = !def.flat; m.userData.roomItem = true; } });
  g.position.set(origin.x + rec.x, rec.y || 0, origin.z + rec.z); g.rotation.y = rec.rot || 0;
  g.userData.rec = rec; g.userData.def = def;
  return g;
}
function applyRoom(){
  if (!bedRoom) return;
  roomItems.forEach(r=>scene.remove(r.g)); roomItems = [];
  S.room.items.forEach(rec=>{ const g = makeItemGroup(rec); if (g){ scene.add(g); roomItems.push({rec, g}); } });
  if (bedRoom.nameLabel){ /* name may change only on new pet */ }
}
function cozyScore(){
  let s = 0; S.room.items.forEach(r=>{ const d = decorDef(r.id); if (d) s += d.cozy||1; });
  if (S.room.paper !== 'w_sky') s += 2; if (S.room.floor !== 'f_wood') s += 2;
  return s;
}
function cozyStars(){ return clamp(Math.floor(cozyScore()/5), 0, 5); }
function roomBlocked(x, z, r){
  for (const it of roomItems){ const d = it.g.userData.def; if (d.flat || d.wall || it.rec.y) continue; const f = fpOf(d, it.rec.rot||0); const cx = HOME_B.x + it.rec.x, cz = HOME_B.z + it.rec.z;
    if (x > cx-f[0]/2-r && x < cx+f[0]/2+r && z > cz-f[1]/2-r && z < cz+f[1]/2+r) return true; }
  return false;
}

// ---------- placing & editing ----------
let placing = null;  // {def, rec, g, ring, fromBag, valid}
let editSel = null;  // roomItems entry
function roomUI(){
  const m = $('homeMenu');
  if (world.edit){
    if (placing){
      m.innerHTML = `<span style="font-weight:800;align-self:center">${placing.def.wall?'Tap a wall to move it':'Tap or drag on the floor to move it'}</span>
        <button class="btn white" data-a="rot">↻ Turn</button><button class="btn mint" data-a="ok" ${placing.valid?'':'disabled'}>✓ Put here</button><button class="btn white" data-a="cancel">✖ Cancel</button>`;
    } else if (editSel){
      m.innerHTML = `<span style="font-weight:800;align-self:center">${editSel.g.userData.def.em} ${editSel.g.userData.def.name}</span>
        <button class="btn sky" data-a="move">✋ Move</button><button class="btn white" data-a="rot2">↻ Turn</button><button class="btn tang" data-a="away">🎒 Put in bag</button><button class="btn mint" data-a="desel">✓ OK</button>`;
    } else {
      m.innerHTML = `<button class="btn grape" data-a="bag">🎒 My bag</button><button class="btn sky" data-a="style">🎨 Walls & floor</button><span style="font-weight:800;align-self:center">Tap something in the room to move it</span><button class="btn mint" data-a="done">✓ Done decorating</button>`;
    }
  } else {
    m.innerHTML = `<span class="pill" style="align-self:center;font-size:15px">${'⭐'.repeat(cozyStars())||'☆'} cosy</span>
      <button class="btn grape" data-a="decor">✏️ Decorate</button><button class="btn white" data-a="bag">🎒 My bag</button><button class="btn sky" data-a="nap">😴 Nap</button><button class="btn pink" data-a="living">🚪 Living room</button>`;
  }
  m.hidden = false;
  m.querySelectorAll('button').forEach(b=> b.onclick = ()=>{ audioInit(); if (modalOpen() || miniOpen()) return; roomAction(b.dataset.a); });
}
function roomAction(a){
  if (a==='decor'){ if (pet.busy) return; world.edit = true; pet.path = []; sfx('pop'); setHint('Decorating! Open your bag to place things, or tap an item to move it.'); setTimeout(()=>setHint(null), 3500); }
  else if (a==='done'){ world.edit = false; deselect(); cancelPlacing(); save(); sfx('right'); toast(`Room is ${'⭐'.repeat(cozyStars())||'☆'} cosy!`); }
  else if (a==='bag') openBag();
  else if (a==='style') openStyles();

function placementOk(def, rec, ignore){

    if (Math.abs(rec.x - it.rec.x) < (f[0]+g2[0])/2 - 0.05 && Math.abs(rec.z - it.rec.z) < (f[1]+g2[1])/2 - 0.05) return false; }

function placeAt(x, y){
  if (!placing) return;
  const v = new THREE.Vector2(x/window.innerWidth*2-1, -(y/window.innerHeight)*2+1);
  ray.setFromCamera(v, camera);
  const p = placing;
  if (p.def.wall){
    const hits = ray.intersectObjects(bedRoom.walls);
    if (!hits.length) return;
    const h = hits[0]; const n = h.face.normal.clone().transformDirection(h.object.matrixWorld);
    const lp = h.point.clone().sub(HOME_B);
    const half = p.def.fp[0]/2;
    if (Math.abs(n.z) > 0.5){ lp.x = clamp(lp.x, -BW/2+half+0.4, BW/2-half-0.4); lp.z = -BD/2+0.32; p.rec.rot = 0; }
    else { lp.z = clamp(lp.z, -BD/2+half+0.4, BD/2-half-0.4); lp.x = n.x > 0 ? -BW/2+0.32 : BW/2-0.32; p.rec.rot = n.x > 0 ? Math.PI/2 : -Math.PI/2; }

}

function updateRoomFx(dt, t){

function ensureThumbR(){

// People walk on the pavements (5.5 from each road centre); automatic walks use the zebra crossings.
const SWO = 5.5;

  P.forEach(z=>{ for (let i=0;i<ends.length-1;i++){ const x1 = ends[i], x2 = ends[i+1]; const r = ROADS.find(rr=>rr > x1 && rr < x2); link(nid(x1, z), nid(x2, z), r !== undefined ? {axis:'v', r, at:z} : null); } });

}

function addPin(id, pos, em, color, name){

  p.sp.userData.place = id; p.lab.userData.place = id; clickables.push(p.sp);
  scene.add(p.sp); scene.add(p.lab); p.base = pos.y; p.id = id; pins.push(p);
}
function updatePins(t){
  pins.forEach((p, i)=>{
    const vis = !world.inHome && world.mode==='play';
    p.sp.visible = p.lab.visible = vis; if (!vis) return;
    const d = camera.position.distanceTo(p.sp.position);
    const s = clamp(d*0.07, 2.4, 9);
    const y = p.base + Math.sin(t*2 + i)*s*0.08;
    p.sp.position.y = p.lab.position.y = y;
    p.sp.scale.set(s*p.aspect, s, 1);
    p.lab.scale.set(s*0.42*p.labAspect, s*0.42, 1);
    p.lab.visible = d < 90;
  });
}

// ---------- phone joystick & running ----------
const joy = {x:0, y:0, on:false, id:null}; let runToggle = false;
function initJoystick(){
  const pad = $('joy'), knob = $('joyKnob');
  const set = (e)=>{ const r = pad.getBoundingClientRect(); const cx = r.left + r.width/2, cy = r.top + r.height/2; let dx = e.clientX - cx, dy = e.clientY - cy; const m = r.width*0.38; const l = Math.hypot(dx, dy); if (l > m){ dx = dx/l*m; dy = dy/l*m; } joy.x = dx/m; joy.y = dy/m; knob.style.transform = `translate(${dx}px,${dy}px)`; };
  pad.addEventListener('pointerdown', e=>{ audioInit(); joy.on = true; joy.id = e.pointerId; pad.setPointerCapture(e.pointerId); set(e); e.stopPropagation(); });
  pad.addEventListener('pointermove', e=>{ if (joy.on && e.pointerId===joy.id) set(e); });
  const end = e=>{ if (e.pointerId!==joy.id) return; joy.on = false; joy.x = joy.y = 0; knob.style.transform = ''; };
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
  $('bRun').onclick = ()=>{ audioInit(); runToggle = !runToggle; $('bRun').classList.toggle('on', runToggle); sfx('tap'); };
}
const isRunning = () => !!(keys.r || keys.R || keys.Shift || runToggle);

// ---------- sleeping on a bed: on the back, head on the pillow ----------
// center: bed centre (world), rot: bed rotation, pillowZ: pillow position along the bed (negative = head end), top: mattress height
let blanket = null;
function layOnBed(center, rot, pillowZ, top){
  const P = pet.P, fw = new THREE.Vector3(Math.sin(rot), 0, Math.cos(rot));
  const headLen = P.headY * P.scale;
  pet.pos.copy(center).addScaledVector(fw, pillowZ + headLen);
  pet.lift = top + 0.5*P.scale; pet.dir = rot; P.root.rotation.y = rot;
  if (blanket) scene.remove(blanket);
  const len = Math.max(0.8, headLen*0.95);
  const bh = (pet.lift - top) + 0.62*P.scale;
  // soft rounded quilt (half-cylinder hump) with a white folded edge
  const qg = new THREE.CylinderGeometry(1, 1, len, 28, 1, false, -Math.PI/2, Math.PI); qg.rotateX(-Math.PI/2); qg.scale(0.98, bh, 1);
  blanket = new THREE.Mesh(qg, toon(pick(['#ffb3d1','#9fe3ff','#ffe58a','#c9b3ff']))); blanket.receiveShadow = true;
  blanket.position.copy(pet.pos).addScaledVector(fw, -len/2 + 0.25); blanket.position.y = top; blanket.rotation.y = rot;
  const fg = new THREE.CylinderGeometry(1, 1, 0.28, 28, 1, false, -Math.PI/2, Math.PI); fg.rotateX(-Math.PI/2); fg.scale(1.0, bh*1.06, 1);
  const fold = new THREE.Mesh(fg, toon('#ffffff')); fold.position.set(0, 0, -len/2 + 0.14); blanket.add(fold);
  scene.add(blanket);
  if (world.mode==='play'){ const side = new THREE.Vector3(Math.cos(rot), 0, -Math.sin(rot)); camState.fixed = {pos:center.clone().addScaledVector(side, 3.2).addScaledVector(fw, 3.6).setY(top + 4.2), look:center.clone().addScaledVector(fw, pillowZ*0.5).setY(top + 0.4)}; }
}
function getUp(stand){ if (blanket){ scene.remove(blanket); blanket = null; } pet.lift = 0; if (stand) pet.pos.copy(stand); if (world.mode==='play') camState.fixed = null; }

function at(m, x, y, z){ m.position.set(x, y, z); return m; }

const texCache = {};
function tile(kind){

    if (kind==='siding'){ g.fillStyle = '#ffffff'; g.fillRect(0,0,w,h); g.fillStyle = 'rgba(0,0,0,.08)'; for (let y=0;y<h;y+=10) g.fillRect(0, y, w, 2); win(36, 30, 56, 56, '#ffffff', '#7fb2d8'); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(18, 26, 12, 64); g.fillRect(98, 26, 12, 64); g.fillStyle = '#ffffff'; g.fillRect(30, 92, 68, 6); }
    else if (kind==='brick'){ g.fillStyle = '#ffffff'; g.fillRect(0,0,w,h); for (let y=0;y<h;y+=12){ for (let x=-(y/12%2)*16; x<w; x+=32){ g.fillStyle = `rgba(0,0,0,${0.04 + Math.random()*0.08})`; g.fillRect(x+1, y+1, 30, 10); } } win(34, 28, 60, 62, '#f4efe6', '#6e9fc8'); g.fillStyle = '#f4efe6'; g.fillRect(28, 94, 72, 8); }
    else if (kind==='apt'){ g.fillStyle = '#ffffff'; g.fillRect(0,0,w,h); g.fillStyle = 'rgba(0,0,0,.06)'; g.fillRect(0, 118, w, 10); win(14, 22, 44, 60, '#e8e8e8', '#5f8db5'); win(70, 22, 44, 60, '#e8e8e8', '#7aa7c9'); g.fillStyle = '#cfd3d8'; g.fillRect(20, 90, 28, 18); g.fillStyle = '#9aa0a8'; for (let i=0;i<4;i++) g.fillRect(23, 93+i*4, 22, 2); if (Math.random()<0.5){ g.fillStyle = pick(['#ff8fc7','#7fd3ff','#ffd84d']); g.fillRect(76, 92, 10, 14); g.fillRect(90, 92, 10, 12); } }
    else if (kind==='modern'){ g.fillStyle = '#ffffff'; g.fillRect(0,0,w,h); g.fillStyle = 'rgba(0,0,0,.07)'; g.fillRect(0, 0, w, 3); g.fillRect(0, 0, 3, h); g.fillStyle = '#2d3e50'; g.fillRect(10, 14, 108, 96); g.fillStyle = '#5fa8d3'; g.fillRect(14, 18, 48, 88); g.fillRect(66, 18, 48, 88); g.fillStyle = 'rgba(255,255,255,.4)'; g.beginPath(); g.moveTo(18, 100); g.lineTo(40, 22); g.lineTo(52, 22); g.lineTo(30, 100); g.fill(); }
    else if (kind==='shop'){ g.fillStyle = '#ffffff'; g.fillRect(0,0,w,h); win(16, 26, 96, 54, '#ffffff', '#6aa0c8'); g.fillStyle = 'rgba(0,0,0,.12)'; for (let x=16;x<112;x+=12) g.fillRect(x, 84, 3, 22); g.fillRect(12, 104, 104, 4); }
    else if (kind==='wood'){ g.fillStyle = '#ffffff'; g.fillRect(0,0,w,h); for (let x=0;x<w;x+=16){ g.fillStyle = `rgba(80,40,10,${0.06+Math.random()*0.1})`; g.fillRect(x, 0, 14, h); } win(40, 30, 48, 52, '#3a2a1a', '#ffcf7a'); }
    else if (kind==='rooftile'){ g.fillStyle = '#ffffff'; g.fillRect(0,0,w,h); g.fillStyle = 'rgba(0,0,0,.18)'; for (let y=0;y<h;y+=16){ g.fillRect(0, y+12, w, 4); for (let x=(y/16%2)*10; x<w; x+=20) g.fillRect(x, y, 2, 14); } }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; texCache[kind] = t; return t;
}
function facadeMat(kind, tint, rx, ry){

function gableRoof(w, d, h, color, overhang){

  const geo = new THREE.ExtrudeGeometry(sh, {depth:d + overhang*2, bevelEnabled:false}); geo.translate(0, 0, -(d/2+overhang));
  const t = tile('rooftile').clone(); t.needsUpdate = true; t.repeat.set(0.25, 0.25); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  const m = new THREE.Mesh(geo, new THREE.MeshToonMaterial({color, map:t, gradientMap:gradMap()})); m.castShadow = true; return m;

function readJSON(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function writeJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

// ---------- network back-ends ----------
function LocalNet(code){
  const KEY = 'ppt.fam.' + code; const subs = {members:[], inbox:[], family:[]};
  const get = () => readJSON(KEY, {members:{}, inbox:{sister:{}, brother:{}}, family:{xp:0, garden:{stage:0, water:{}}}});
  const put = (st) => { writeJSON(KEY, st); fire(st); };
  const fire = (st) => { subs.members.forEach(f=>f(st.members||{})); subs.inbox.forEach(f=>f((st.inbox||{})[SLOT]||{})); subs.family.forEach(f=>f(st.family||{})); };
  window.addEventListener('storage', e=>{ if (e.key===KEY) fire(get()); });
  return {
    mode:'local', code,
    setMe(o){ const st = get(); st.members[SLOT] = o; put(st); },
    watchMembers(f){ subs.members.push(f); f(get().members||{}); },
    send(to, msg){ const st = get(); st.inbox[to] = st.inbox[to]||{}; st.inbox[to][Date.now().toString(36)+Math.random().toString(36).slice(2,6)] = msg; put(st); },
    watchInbox(f){ subs.inbox.push(f); f((get().inbox||{})[SLOT]||{}); },
    removeInbox(id){ const st = get(); if (st.inbox[SLOT]) delete st.inbox[SLOT][id]; put(st); },
    watchFamily(f){ subs.family.push(f); f(get().family||{}); },
    changeFamily(fn){ const st = get(); st.family = fn(st.family||{xp:0, garden:{stage:0, water:{}}}); put(st); return Promise.resolve(st.family); },
    status(){ return 'local'; }
  };
}
function FireNet(code){
  const db = firebase.database(); const root = db.ref('families/' + code);
  let connected = false; db.ref('.info/connected').on('value', s=>{ connected = !!s.val(); });
  const clean = o => JSON.parse(JSON.stringify(o));
  root.child('members/' + SLOT + '/playing').onDisconnect().set(false);
  return {
    mode:'firebase', code,
    setMe(o){ root.child('members/' + SLOT).set(clean(o)).catch(()=>{}); },
    watchMembers(f){ root.child('members').on('value', s=>f(s.val()||{})); },
    send(to, msg){ root.child('inbox/' + to).push(clean(msg)).catch(()=>{}); },
    watchInbox(f){ root.child('inbox/' + SLOT).on('value', s=>f(s.val()||{})); },
    removeInbox(id){ root.child('inbox/' + SLOT + '/' + id).remove().catch(()=>{}); },
    watchFamily(f){ root.child('family').on('value', s=>f(s.val()||{})); },
    changeFamily(fn){ return root.child('family').transaction(cur=>clean(fn(cur||{xp:0, garden:{stage:0, water:{}}}))).then(r=>r.snapshot.val()).catch(()=>null); },
    status(){ return connected ? 'online' : 'offline'; }
  };
}
function loadScript(src){ return new Promise((res, rej)=>{ const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function loadFirebase(){
  if (window.firebase && firebase.database) return true;
  const v = '10.12.2';
  for (const base of [`https://www.gstatic.com/firebasejs/${v}/`, `https://cdn.jsdelivr.net/npm/firebase@${v}/`]){
    try{ await loadScript(base + 'firebase-app-compat.js'); await loadScript(base + 'firebase-database-compat.js'); if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG); return true; }catch(e){}
  }
  return false;
}
const hasFirebase = () => !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && window.FIREBASE_CONFIG.databaseURL);
async function startNet(){
  FAM = readJSON('ppt.family', null);
  if (!FAM || FAM.mode==='off') { net = null; return; }
  if (FAM.mode==='firebase'){
    if (!hasFirebase() || !(await loadFirebase())){ toast('📶 Family link is offline right now — playing on your own.'); net = null; return; }
    net = FireNet(FAM.code);
  } else net = LocalNet(FAM.code);
  net.watchMembers(m=>{ const o = m[otherSlot()]; sib = o && o.design ? o : null; refreshSibling(); });
  net.watchInbox(onInbox);
  net.watchFamily(f=>{ famData = Object.assign({xp:0, garden:{stage:0, water:{}}}, f||{}); famData.garden = Object.assign({stage:0, water:{}}, famData.garden||{}); refreshGarden(); updateFamBadge(); });
  pubMe(true);
}

function updateSibling(dt){
  if (!sibAv || !sib) return;
  const P = sibAv.P, p = P.root.position;
  P.root.visible = !world.inHome;
  let mode = 'idle';
  if (sibAv.hold > 0){ sibAv.hold -= dt; if (pet) P.root.rotation.y = Math.atan2(pet.pos.x - p.x, pet.pos.z - p.z); mode = sibAv.happy > 0 ? 'happy' : 'idle'; sibAv.happy = Math.max(0, (sibAv.happy||0) - dt); }
  else {
    let tgt;
    if (sibOnline() && sib.pos && !sib.pos.home) tgt = new THREE.Vector3(sib.pos.x, 0, sib.pos.z);
    else { sibAv.wait -= dt; if (sibAv.wait <= 0){ sibAv.wait = rnd(3,7); sibAv.tgt.set(GARDEN_POS.x - 4 + rnd(-6,6), 0, 45.5 + rnd(-1.5,2)); } tgt = sibAv.tgt; }
    const dx = tgt.x - p.x, dz = tgt.z - p.z, d = Math.hypot(dx, dz);
    if (d > 40){ p.set(tgt.x, 0, tgt.z); }
    else if (d > 0.4){ const sp = Math.min(d, (sibOnline() ? 9 : 2.5)*dt); p.x += dx/d*sp; p.z += dz/d*sp; P.root.rotation.y = Math.atan2(dx, dz); mode = 'walk'; }
  }
  if (P.skate) P.skate.visible = mode==='walk' && sibOnline();
  animatePet(P, dt, mode);
}

// ---------- family garden (needs both children to water on the same day) ----------
let gardenG = null;
function buildGarden(){
  if (gardenG) scene.remove(gardenG);
  gardenG = GG(); gardenG.position.copy(GARDEN_POS); scene.add(gardenG);
  const bed = boxM('#a0632f', 6, 0.5, 2.6); bed.position.y = 0.25; gardenG.add(bed);
  const soil = boxM('#7a4a2a', 5.6, 0.52, 2.2); soil.position.y = 0.27; gardenG.add(soil);
  const sign = labelSprite('🌻 Family Garden', '#fff3a8', {fs:40, scale:0.55}); sign.position.set(0, 2.6, -1.2); gardenG.add(sign);
  gardenG.userData.garden = true; gardenG.traverse(m=>{ if (m.isMesh) m.userData.garden = true; }); clickables.push(gardenG);
  gardenG.userData.plants = GG(); gardenG.add(gardenG.userData.plants);
  refreshGarden();
}
function refreshGarden(){
  if (!gardenG) return;
  const st = Math.min(6, famData.garden.stage||0); const pl = gardenG.userData.plants;
  while (pl.children.length) pl.remove(pl.children[0]);
  for (let i=0;i<8;i++){
    const x = -2.4 + (i%4)*1.6, z = i<4 ? -0.5 : 0.5;
    const g = GG(); g.position.set(x + (i<4?0:0.8), 0.5, z);
    if (st === 0){ g.add(ball('#5a3a20', 0.12, 1, 0.5, 1)); }
    else {
      const h = 0.3 + st*0.32; const stem = cyl('#4fbf5c', 0.04, 0.05, h, 6); stem.position.y = h/2; g.add(stem);
      const lf = ball('#4fbf5c', 0.16, 1.5, 0.3, 0.7); lf.position.set(0.1, h*0.45, 0); lf.rotation.z = -0.5; g.add(lf);
      if (st >= 2){ const col = ['#ff5c8a','#ffd84d','#b18cff','#ff9f5a'][i%4]; const fl = GG(); fl.position.y = h;
        for (let k=0;k<6;k++){ const a = k/6*Math.PI*2; const pt = ball(col, 0.08+st*0.025, 1.3, 0.5, 1); pt.position.set(Math.cos(a)*(0.1+st*0.03), 0, Math.sin(a)*(0.1+st*0.03)); fl.add(pt); }
        fl.add(ball('#ffe066', 0.06+st*0.015)); g.add(fl); }
    }
    pl.add(g);
  }
  if (st >= 6){ const sp = labelSprite('🏆 Full bloom!', '#ffd84d', {fs:36, scale:0.45}); sp.position.set(0, 3.4, -1.2); pl.add(sp); }
}
function waterGarden(){
  const key = S.day.key;
  if (famData.garden.water && famData.garden.water[SLOT] === key){ bubble('I already watered the garden today 🌱'); return; }
  const stand = GARDEN_POS.clone().add(new THREE.Vector3(0, 0, 2.6));
  const can = GG(); const cb = cyl('#4f8dff',0.3,0.35,0.5,12); can.add(cb);
  const go = ()=> runSeq([{walk:stand},{wait:1.6, anim:'work', face:GARDEN_POS, start:()=>{ scene.add(can); sfx('water'); }, tick:()=>{ can.position.set(pet.pos.x+0.4, 1.4, pet.pos.z-0.6); if (Math.random()<0.6) burst(GARDEN_POS.clone().setY(1.2).add(new THREE.Vector3(rnd(-2,2),0,rnd(-0.6,0.6))), 'water', 1); }, end:()=>scene.remove(can)}], ()=>{
    gain('fun', 2); addXP(3); famReward(3);
    const other = otherSlot();
    if (net) net.changeFamily(f=>{ f.garden = f.garden || {stage:0, water:{}}; f.garden.water = f.garden.water || {}; f.garden.water[SLOT] = key;
      if (f.garden.water[other] === key && f.garden.grownOn !== key){ f.garden.stage = Math.min(6, (f.garden.stage||0) + 1); f.garden.grownOn = key; }
      return f; }).then(f=>{
        if (f && f.garden && f.garden.grownOn === key && f.garden.water[other] === key){ toast(`🌻 You and ${sib?sib.name:'your sibling'} both watered today — the Family Garden grew!`); burst(GARDEN_POS.clone().setY(2), 'star', 18); sfx('level'); addCoins(6); sendMsg('bonus', {coins:6, label:'🌻 Family Garden grew! +6 🪙'}); }
        else toast(`💧 Watered! When ${sib?sib.name:'your sibling'} waters it today too, the garden grows.`);
      });
    else toast('💧 Watered! (Family link not set up, so the garden grows only with both siblings.)');
    save();
  });
  if (world.inHome) leaveHome();
  go();
}

let nbs = [], dog = null, carryLetter = null, dogWalk = false;

function buildNeighbours(){
  NEIGHBOURS.forEach((n, i)=>{
    const d = Object.assign({pattern:'plain', cheeks:true, pers:'friendly', name:n.name}, n.look);
    const worn = {head:n.hat||null, face:n.glasses?'glasses':null};
    const P = buildPet(d, {adult:true, worn});
    P.root.scale.multiplyScalar(0.82);
    const lab = labelSprite(`${n.em} ${n.name}`, '#fffbe6', {fs:42, scale:0.62}); lab.position.y = P.height/P.scale + 0.8; P.root.add(lab);
    const mark = labelSprite('❗', '#ffd84d', {fs:44, scale:0.55}); mark.position.y = P.height/P.scale + 2.0; mark.visible = false; P.root.add(mark);
    if (n.rod){ const r = cyl('#8a5a3c', 0.04, 0.04, 3.4, 6); r.position.set(0.6, 1.6, 1.0); r.rotation.x = 0.9; P.root.add(r); }
    if (n.bag){ const b = boxM('#ff5a5a', 0.6, 0.5, 0.25); b.position.set(0.5, 1.1, 0); P.root.add(b); }
    const start = n.route ? new THREE.Vector3(n.route[0][0], 0, n.route[0][1]) : new THREE.Vector3(n.at[0], 0, n.at[1]);
    P.root.position.copy(start); P.root.rotation.y = n.face||0; scene.add(P.root);
    P.root.traverse(m=>{ if (m.isMesh) m.userData.nb = n.id; }); clickables.push(P.root);
    nbs.push({n, P, mark, seg:0, hold:0, home:start.clone()});
  });
  // Lucky the dog
  const g = GG(); g.add(ball('#ffffff', 0.45, 1.3, 0.8, 1)); const h = ball('#ffffff', 0.32); h.position.set(0, 0.4, 0.5); g.add(h);
  [-1,1].forEach(s=>{ const e = ball('#c69c72', 0.14, 0.6, 1.3, 0.5); e.position.set(s*0.24, 0.45, 0.45); g.add(e); const ey = ball('#2b2a4c', 0.05); ey.position.set(s*0.1, 0.48, 0.78); g.add(ey); });
  const nose = ball('#2b2a4c', 0.06); nose.position.set(0, 0.38, 0.82); g.add(nose);
  const tail = ball('#c69c72', 0.1, 1, 2, 1); tail.position.set(0, 0.35, -0.6); tail.rotation.x = -0.6; g.add(tail); g.userData.tail = tail;
  for (let i=0;i<4;i++){ const l = cyl('#ffffff', 0.08, 0.08, 0.35, 6); l.position.set((i%2?0.2:-0.2), -0.25, (i<2?0.25:-0.25)); g.add(l); }
  g.position.y = 0.45; scene.add(g); dog = {g, owner:nbs.find(x=>x.n.id==='mei')};
  refreshMarks();
}
function todaysFavours(){
  if (!S.day.favourIds){ const r = seeded(S.day.key + 'nb'); S.day.favourIds = NEIGHBOURS.map(n=>n.id).map(id=>({id, k:r()})).sort((a,b)=>a.k-b.k).slice(0,4).map(x=>x.id); }
  return S.day.favourIds;
}
function refreshMarks(){ if (!S || !S.day) return; const fav = todaysFavours(); S.day.favDone = S.day.favDone || {}; nbs.forEach(x=>{ x.mark.visible = fav.includes(x.n.id) && !S.day.favDone[x.n.id]; }); }
function nbHearts(id){ S.nbF = S.nbF || {}; return S.nbF[id] || 0; }
function addHeart(id, n){ S.nbF = S.nbF || {}; S.nbF[id] = Math.min(10, (S.nbF[id]||0) + n); }
function updateNeighbours(dt, t){
  nbs.forEach(x=>{
    const P = x.P, p = P.root.position; let mode = 'idle';
    if (x.hold > 0){ x.hold -= dt; if (pet) P.root.rotation.y = Math.atan2(pet.pos.x - p.x, pet.pos.z - p.z); mode = x.happy > 0 ? 'happy' : 'idle'; x.happy = Math.max(0, (x.happy||0) - dt); }
    else if (x.n.route && !(x.n.dog && dogWalk)){
      const r = x.n.route; const tgt = r[(x.seg+1) % r.length]; const dx = tgt[0]-p.x, dz = tgt[1]-p.z, d = Math.hypot(dx,dz);
      if (d < 0.3) x.seg = (x.seg+1) % r.length; else { const sp = 2.2*dt; p.x += dx/d*sp; p.z += dz/d*sp; P.root.rotation.y = Math.atan2(dx,dz); mode = 'walk'; }
    } else if (x.n.rod){ mode = 'idle'; }
    animatePet(P, dt, mode);
  });
  if (dog){
    const g = dog.g; let tgt;
    if (dogWalk && pet){ const b = pet.pos.clone(); b.x -= Math.sin(pet.dir)*1.6; b.z -= Math.cos(pet.dir)*1.6; tgt = b; }
    else { const o = dog.owner.P.root.position; const r = dog.owner.P.root.rotation.y; tgt = new THREE.Vector3(o.x + Math.sin(r+0.9)*1.4, 0, o.z + Math.cos(r+0.9)*1.4); }
    const dx = tgt.x - g.position.x, dz = tgt.z - g.position.z, d = Math.hypot(dx, dz);
    if (d > 0.25){ const sp = Math.min(d, (dogWalk ? 12 : 3)*dt); g.position.x += dx/d*sp; g.position.z += dz/d*sp; g.rotation.y = Math.atan2(dx, dz); g.position.y = 0.45 + Math.abs(Math.sin(t*14))*0.12; } else g.position.y = 0.45;
    g.userData.tail.rotation.z = Math.sin(t*16)*0.5;
    if (dogWalk && pet && !world.inHome && pet.pos.distanceTo(placeInfo.park.door) < 4){ finishFavour(nbs.find(x=>x.n.id==='mei')); }
  }
  if (carryLetter && pet){ carryLetter.position.set(pet.pos.x, pet.P.height + 1.0 + (pet.lift||0), pet.pos.z); }
}
function goNeighbour(id){
  const x = nbs.find(a=>a.n.id===id); if (!x || !pet || pet.busy) return;
  if (world.inHome) leaveHome();
  x.hold = 14;
  const p = x.P.root.position; const dir = pet.pos.clone().sub(p).setY(0); if (dir.length() < 0.01) dir.set(0,0,1); dir.normalize();
  const stand = p.clone().addScaledVector(dir, 2.4);
  walkTo(stand, ()=>talkTo(x), nearestRoad(stand).pt); sfx('tap');
}
function hearts(n){ return '💗'.repeat(Math.floor(n/2)) + (n%2 ? '🩷' : '') || '🤍'; }
function talkTo(x){
  const n = x.n; x.hold = 6; x.happy = 1.2; pet.dir = Math.atan2(x.P.root.position.x - pet.pos.x, x.P.root.position.z - pet.pos.z);
  S.day.nbHi = S.day.nbHi || {}; S.day.favDone = S.day.favDone || {};
  // delivering a letter to this neighbour?
  if (carryLetter && carryLetter.userData.to === n.id){ scene.remove(carryLetter); carryLetter = null; const post = nbs.find(a=>a.n.id==='ming'); return finishFavour(post, `${n.name} got the letter! 💌`); }
  const fav = todaysFavours().includes(n.id) && !S.day.favDone[n.id];
  const first = !S.day.nbHi[n.id];
  const line = pick(n.hello);
  const btns = [];
  if (first) btns.push(`<button class="btn mint" id="nbHi">👋 Say hello</button>`);
  if (fav) btns.push(`<button class="btn" id="nbFav">❗ ${n.favour.kind==='deliver' ? 'Give a 🥕 carrot' : 'Yes, I can help!'}</button>`);
  btns.push(`<button class="btn white" id="nbBye">Bye bye 👋</button>`);
  openModal(`${n.em} ${n.name}`, `<div style="display:flex;gap:12px;align-items:center"><div style="font-size:64px;line-height:1">${n.em}</div><div><div class="pill">${n.role}</div><div style="font-family:var(--display);font-weight:800;font-size:22px;line-height:1.2;margin-top:4px">“${fav ? n.favour.ask : line}”</div><div style="font-size:13px;font-weight:800;margin-top:4px">Friendship: ${hearts(nbHearts(n.id))}</div></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${btns.join('')}</div>`);
  sfx('hi');
  const hi = $('nbHi'); if (hi) hi.onclick = ()=>{ S.day.nbHi[n.id] = true; addHeart(n.id, 1); S.c.greets++; gain('social', 4); gain('fun', 1); addXP(3); petHappy(); closeModal(); bubble(`Hello, ${n.name}! 👋`); checkSkills(); save(); };
  const fv = $('nbFav'); if (fv) fv.onclick = ()=>{ closeModal(); startFavour(x); };
  $('nbBye').onclick = ()=>closeModal();
}
function startFavour(x){
  const n = x.n, f = n.favour;
  if (f.kind==='deliver'){
    if (!S.fridge[f.food]){ toast(`You need a ${FOODS.find(a=>a.id===f.food).em} in your fridge. Buy one at the 🥗 Green Café!`); return; }
    S.fridge[f.food]--; return finishFavour(x);
  }
  if (f.kind==='taste'){ const sp = emojiSprite('🍞', 1.2); scene.add(sp); runSeq([{wait:1.6, anim:'eat', start:()=>sfx('eat'), tick:()=>sp.position.copy(pet.pos).setY(pet.P.height*0.75+0.3).add(new THREE.Vector3(Math.sin(pet.dir)*0.9,0,Math.cos(pet.dir)*0.9)), end:()=>scene.remove(sp)}], ()=>finishFavour(x)); return; }
  if (f.kind==='quiz'){
    const [q, a, w] = pick(ROAD_QS); const opts = shuffle([a, ...w]);
    openModal(`${n.em} Road safety quiz`, `<div class="board"><div class="q" style="font-size:24px">${q}</div><div class="answers">${opts.map((o,i)=>`<button class="ans" data-o="${i}">${o}</button>`).join('')}</div></div>`);
    $('mBody').querySelectorAll('[data-o]').forEach(b=> b.onclick = ()=>{ const v = opts[+b.dataset.o]; if (v===a){ b.classList.add('right'); sfx('right'); setTimeout(()=>{ closeModal(); finishFavour(x); }, 700); } else { b.classList.add('wrong'); sfx('wrong'); } });
    return;
  }
  if (f.kind==='walk'){ dogWalk = true; x.hold = 0; toast('🐶 Lucky is following you! Walk to the 🌳 Friends Park.'); setHint('🐶 Take Lucky to the Friends Park entrance'); return; }
  if (f.kind==='letter'){
    const targets = NEIGHBOURS.filter(a=>a.id!=='ming' && !a.route); const to = pick(targets);
    if (carryLetter) scene.remove(carryLetter);
    carryLetter = emojiSprite('💌', 1.1); carryLetter.userData.to = to.id; scene.add(carryLetter);
    toast(`💌 Deliver the letter to ${to.em} ${to.name}!`); setHint(`💌 Take the letter to ${to.name}`); return;
  }
  if (f.kind==='checkup'){
    const low = CRITICAL.slice().sort((a,b)=>S.stats[a]-S.stats[b])[0]; const st = STATS.find(s=>s.id===low);
    const tip = {full:'Eat healthy food like apples and fish.', energy:'Take a nap at home when you feel tired.', smart:'Go to school and read books.', motor:'Run and play at the Fun Park.', social:'Say hello to friends and neighbours.'}[low];
    runSeq([{wait:1.5, anim:'happy', start:()=>{ burst(pet.pos.clone().setY(2), 'heart', 6); }}], ()=>{ toast(`👩‍⚕️ Your lowest bar is ${st.ic} ${st.name}. ${tip}`, 4500); finishFavour(x); }); return;
  }
  if (f.kind==='fish'){
    const rod = cyl('#8a5a3c', 0.04, 0.04, 3, 6);
    runSeq([{wait:3, anim:'idle', face:new THREE.Vector3(-35, 0, 80), start:()=>{ scene.add(rod); }, tick:(dt,k)=>{ rod.position.set(pet.pos.x + Math.sin(pet.dir)*1.2, 1.4, pet.pos.z + Math.cos(pet.dir)*1.2); rod.rotation.set(Math.cos(pet.dir)*0.9, 0, -Math.sin(pet.dir)*0.9); if (k > 0.8 && Math.random()<0.3) burst(new THREE.Vector3(-33, 0.3, 77.5), 'water', 3); }, end:()=>scene.remove(rod)}], ()=>{ burst(pet.pos.clone().setY(2.5),'star',10); finishFavour(x); });
    return;
  }
  if (f.kind==='exercise'){ const steps = []; for (let i=0;i<5;i++) steps.push({wait:0.55, anim:'happy', start:()=>{ sfx('jump'); x.happy = 0.5; }}); runSeq(steps, ()=>finishFavour(x)); return; }
  if (f.kind==='story'){ openModal('📚 Story time', `<div style="text-align:center"><div style="font-size:64px">📖</div><p style="font-family:var(--display);font-weight:800;font-size:24px">${pick(STORIES)}</p><button class="btn mint big" id="stOk">The end! 😊</button></div>`); $('stOk').onclick = ()=>{ closeModal(); finishFavour(x); }; return; }
}
function finishFavour(x, extraMsg){
  const n = x.n, r = n.favour.reward;
  if (n.favour.kind==='walk'){ dogWalk = false; setHint(null); }
  if (n.favour.kind==='letter') setHint(null);
  S.day.favDone = S.day.favDone || {}; if (S.day.favDone[n.id]) return; S.day.favDone[n.id] = true;
  S.c.favours = (S.c.favours||0) + 1; addHeart(n.id, 2); S.profile.heart += 4;
  if (r.coins) addCoins(r.coins);
  ['social','smart','motor','fun','energy','full'].forEach(k=>{ if (r[k]) gain(k, r[k]); });
  if (r.item){ S.bag[r.item] = (S.bag[r.item]||0) + 1; }
  if (r.food){ S.fridge[r.food] = (S.fridge[r.food]||0) + 1; }
  addXP(8); petHappy(1.4); burst(pet.pos.clone().setY(2.4), 'heart', 10);
  x.hold = 3; x.happy = 1.5;
  toast(`${n.em} ${n.name}: ${extraMsg ? extraMsg + ' ' : ''}${n.favour.done}`, 4000);
  if (r.item) setTimeout(()=>toast(`🎁 ${decorDef(r.item).em} ${decorDef(r.item).name} is in your bag!`), 1200);
  if (r.food) setTimeout(()=>toast(`🐟 A fish is in your fridge!`), 1200);
  if (nbHearts(n.id) >= 10 && !(S.nbGift||{})[n.id]){ S.nbGift = S.nbGift || {}; S.nbGift[n.id] = true; const d = pick(DECOR.filter(a=>a.price>=50)); S.bag[d.id] = (S.bag[d.id]||0)+1; setTimeout(()=>toast(`💗 ${n.name} is your best friend! Special gift: ${d.em} ${d.name}`, 4500), 2500); }
  refreshMarks(); checkSkills(); save();
}
function openNeighbourList(){
  const fav = todaysFavours(); S.day.favDone = S.day.favDone || {};
  openModal('🏘️ Neighbours', `<p style="font-weight:800;margin-top:0">Tap a neighbour in town to chat. ❗ means they need your help today!</p><div class="grid">${NEIGHBOURS.map(n=>`<button class="card" data-nb="${n.id}" style="cursor:pointer"><div class="em">${n.em}</div><div class="nm">${n.name}</div><div class="ds">${n.role} · ${hearts(nbHearts(n.id))}</div>${fav.includes(n.id) && !S.day.favDone[n.id] ? '<span class="pill" style="background:#ffd84d">❗ needs help</span>' : S.day.favDone[n.id] ? '<span class="pill">helped ✓</span>' : ''}</button>`).join('')}</div>`, null, {pause:true});
  $('mBody').querySelectorAll('[data-nb]').forEach(b=> b.onclick = ()=>{ closeModal(); goNeighbour(b.dataset.nb); });
}

// a speech bubble over someone else's head
let npcSay = null;
function sayAbove(root, text, secs, h){
  const b = $('npcBubble'); if (!b) return;
  b.textContent = text; b.hidden = false; npcSay = {root, t:secs||2.6, h:h||3.2};
}
function updateNpcBubble(dt){
  const b = $('npcBubble'); if (!b || !npcSay) return;
  npcSay.t -= dt;
  if (npcSay.t <= 0 || world.mode!=='play' || miniOpen()){ b.hidden = true; npcSay = null; return; }
  const p = npcSay.root.getWorldPosition(new THREE.Vector3()); p.y += npcSay.h;
  const s = worldToScreen(p); const hw = b.offsetWidth/2 + 6; b.style.left = Math.min(window.innerWidth - hw, Math.max(hw, s.x)) + 'px'; b.style.top = Math.max(b.offsetHeight + 70, s.y - 6) + 'px';
}

function talkers(){
  const L = [];
  if (typeof nbs !== 'undefined') nbs.forEach(x=>L.push({key:'nb:'+x.n.id, name:x.n.name, root:x.P.root, h:x.P.height + 0.9, nb:x}));
  friends.forEach((f, i)=>L.push({key:'fr:'+i, name:f.name, root:f.P.root, h:f.P.height + 0.9, fr:f}));
  if (typeof dog !== 'undefined' && dog) L.push({key:'dog', name:'Lucky', root:dog.g, h:1.4, dog:true});
  if (typeof sibAv !== 'undefined' && sibAv) L.push({key:'sib', name:sibAv.name || 'my sibling', root:sibAv.P.root, h:sibAv.P.height + 0.9, sib:true});
  return L;
}
// every door in town
function doors(){
  const L = [];
  PLACES.forEach(p=>{ const pi = placeInfo[p.id]; if (pi && pi.door) L.push({id:p.id, door:pi.door, label: p.id==='playground' ? `${p.em} Play at ${p.name}` : p.id==='park' ? `${p.em} Visit ${p.name}` : p.id==='home' ? '🏠 Go home' : `🚪 Enter ${p.name}`}); });
  BUILDINGS.forEach(b=>L.push({id:b.id, door:b.door, label:`🚪 Enter ${b.short || b.title}`}));
  return L;
}
let actKey = '', actT = 0, chitCool = 0;
function updateActions(dt){
  actT -= dt; chitCool = Math.max(0, chitCool - dt);
  updateNpcBubble(dt);
  if (actT > 0) return; actT = 0.2;
  const box = $('actBtns'); if (!box) return;
  let list = [];
  if (pet && world.mode==='play' && !world.inHome && !pet.busy && !modalOpen() && !miniOpen() && !world.paused){
    let bestT = null; talkers().forEach(t=>{ const d = Math.hypot(t.root.position.x - pet.pos.x, t.root.position.z - pet.pos.z); if (d < 3.6 && (!bestT || d < bestT.d)) bestT = Object.assign({d}, t); });
    let bestD = null; doors().forEach(o=>{ const d = Math.hypot(o.door.x - pet.pos.x, o.door.z - pet.pos.z); if (d < 3.4 && (!bestD || d < bestD.d)) bestD = Object.assign({d}, o); });
    if (bestT){
      list.push({k:'talk:'+bestT.key, cls:'talk', label:`💬 Talk to ${bestT.name}`, fn:()=>chitChat(bestT)});
      if (bestT.nb && todaysFavours().includes(bestT.nb.n.id) && !(S.day.favDone||{})[bestT.nb.n.id]) list.push({k:'fav:'+bestT.key, cls:'talk', label:`❗ Help ${bestT.name}`, fn:()=>talkTo(bestT.nb)});
    }
    if (bestD) list.push({k:'door:'+bestD.id, cls:'enter', label:bestD.label, fn:()=>{ setHint(null); arriveAt(bestD.id); }});
  }
  const key = list.map(x=>x.k).join('|');
  if (key === actKey) return;
  actKey = key; box.innerHTML = '';
  list.forEach(a=>{ const b = document.createElement('button'); b.className = a.cls; b.textContent = a.label; b.onclick = ()=>{ audioInit(); sfx('tap'); a.fn(); actKey = '#'; }; box.appendChild(b); });
}
function chitChat(t){
  if (chitCool > 0 || !pet || pet.busy) return;
  chitCool = 3.2;
  const tp = t.root.position;
  pet.dir = Math.atan2(tp.x - pet.pos.x, tp.z - pet.pos.z);
  if (t.nb){ t.nb.hold = 6; t.nb.happy = 1.4; }
  if (t.fr){ t.fr.hold = 6; t.fr.happy = 1.4; t.fr.P.root.rotation.y = Math.atan2(pet.pos.x - tp.x, pet.pos.z - tp.z); }
  if (t.nb) t.nb.P.root.rotation.y = Math.atan2(pet.pos.x - tp.x, pet.pos.z - tp.z);
  let pair = t.dog ? pick(CHIT_DOG) : pick(CHIT);
  if (!t.dog && S.day.weather === 'rainy' && Math.random() < 0.4) pair = ['So much rain today! 🌧️', 'Puddle jumping time!'];
  if (t.sib) pair = pick([['Hi! What did you do today?', 'I went to school and the park!'], ['Let\'s do a combo later!', 'Yes! Team power! 💪'], ['Mama made soup tonight 🍲', 'Yummy, I can\'t wait!']]);
  sayAbove(t.root, pair[0], 2.6, t.h);
  sfx('hi');
  setTimeout(()=>{ if (!pet) return; bubble(pair[1], 2.4); petHappy(0.8); }, 1500);
  // rewards: social + a little XP, up to 3 chats with each person per day
  S.day.chats = S.day.chats || {};
  const n = S.day.chats[t.key] || 0;
  if (n < 3){
    S.day.chats[t.key] = n + 1;
    gain('social', 3); gain('fun', 1); addXP(2); S.profile.heart = (S.profile.heart||0) + 1;
    if (t.nb && n === 0) addHeart(t.nb.n.id, 1);
    S.c.chats = (S.c.chats||0) + 1;
    setTimeout(()=>{ floatText('+3 💬  +2 XP', '#b8ffcf'); burst(pet.pos.clone().lerp(tp, 0.5).setY(2.6), 'heart', 6); }, 1600);
  } else setTimeout(()=>floatText(`Chatted lots with ${t.name} today 😊`, '#ffffff'), 1600);
  checkSkills(); save();
}

// ===================== SEQUENCES & TWEENS =====================
let seq = null; const tweens = [];
function runSeq(steps, done){
  if (!pet) return;
  pet.busy = true; let i = -1;
  const next = ()=>{
    i++;
    if (i >= steps.length){ pet.busy = false; pet.anim = null; pet.lift = 0; seq = null; if (done) done(); return; }
    const s = steps[i];
    if (s.walk){ pet.anim = null; pet.path = planPath(pet.pos, s.walk); pet.onArrive = next; if (!pet.path.length) next(); }
    else { pet.anim = s.anim || null; if (s.face) pet.dir = Math.atan2(s.face.x - pet.pos.x, s.face.z - pet.pos.z); if (s.start) s.start(); seq = {t:0, dur:s.wait||0, s, fn:()=>{ if (s.end) s.end(); next(); }}; }
  };
  next();
}
function updateSeq(dt){
  if (!seq) return;
  seq.t += dt; if (seq.s.tick) seq.s.tick(dt, Math.min(1, seq.t/seq.dur), seq.t);
  if (seq.t >= seq.dur){ const f = seq.fn; seq = null; f(); }
}
function tween(dur, fn, done){ tweens.push({t:0, dur, fn, done}); }
function updateTweens(dt){
  for (let i=tweens.length-1;i>=0;i--){ const w = tweens[i]; w.t += dt; const k = Math.min(1, w.t/w.dur); w.fn(k); if (k>=1){ tweens.splice(i,1); if (w.done) w.done(); } }
}
function rebuildPet(){ const keep = pet && pet.busy; spawnPet(); if (pet) pet.busy = keep; }
function petHappy(sec){ if (!pet) return; const was = pet.anim; pet.anim = 'happy'; sfx('jump'); setTimeout(()=>{ if (pet && pet.anim==='happy') pet.anim = was==='happy'?null:was; }, (sec||1.2)*1000); }

  petHappy(1);

  if (low.length) bubble(lines[pick(low)]);
  else bubble(pick(['Hehe! That tickles!','I love you! 💖','What shall we do today?','Yay! 🎉','Wheee!', `I'm ${S.name}!`]));

// ===================== ARRIVALS =====================
function arriveAt(id){
  if (world.mode!=='play') return;
  if (id==='home') enterHome();
  else if (id==='school') openSchool();
  else if (id==='shop') openShop('wear');
  else if (id==='cafe') openCafe();
  else if (id==='playground') openPlayground();
  else if (id==='park') openPark();
  else if (id.startsWith('b')) enterBuilding(id);
}

function chorePay(c){ let m = 1; if (has('helperpro')) m = 2; else if (has('helper')) m = 1.5; if (hasEq('mop')) m *= 1.2; return Math.round(c.pay*m); }
function startChore(id){
