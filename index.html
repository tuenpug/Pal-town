<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pocket Pal Town</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: full-screen 3D canvas, sticker-style HUD floating in the corners, modal cards in the middle */
:root{
  --ink:#2b2a4c; --paper:#ffffff; --cream:#fff8ec;
  --pink:#ff8fc7; --sky:#7fd3ff; --sun:#ffd84d; --mint:#6fe3b5; --grape:#b18cff; --tang:#ff9f5a; --berry:#ff5c8a;
  --good:#3ccf7a; --warn:#ffb020; --bad:#ff5a5a;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#9fe0ff;color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--display);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.sticker{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
.btn{font-weight:800;font-size:18px;border:3px solid var(--ink);border-radius:16px;padding:8px 16px;background:var(--sun);box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink)} .btn.mint{background:var(--mint)} .btn.sky{background:var(--sky)} .btn.grape{background:var(--grape)} .btn.white{background:#fff} .btn.tang{background:var(--tang)}
.btn[disabled]{opacity:.45;pointer-events:none}
.big{font-size:24px;padding:12px 26px;border-radius:20px}

/* HUD — phone-first: top bar, stats strip, side buttons, bottom dock */
#hud{position:absolute;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#topBar{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:6px;align-items:stretch}
#petCard{flex:1;min-width:0;padding:5px 10px 6px;border-radius:16px}
.pcRow{display:flex;align-items:baseline;gap:6px;min-width:0}
#petName{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05;white-space:nowrap}
#petTitle{font-size:11px;font-weight:800;color:#6a5fae;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:9px;border:2px solid var(--ink);border-radius:10px;background:#efeaff;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--grape),var(--pink));transition:width .4s}
#xpText{font-size:10px;font-weight:800;color:#6a5fae;white-space:nowrap}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 9px;border-radius:16px;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.05;font-variant-numeric:tabular-nums;min-width:58px}
.chip small{font-size:10px;color:#6a5fae;font-family:var(--body)}
#ring{width:24px;height:24px;vertical-align:middle}
#stats{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:5px 8px 6px;border-radius:14px;max-width:620px}
.stat{display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:800;min-width:0}
.stat .top{display:flex;justify-content:space-between;align-items:center}
.stat .ic{font-size:14px}
.stat .bar{position:relative;height:8px;border:2px solid var(--ink);border-radius:8px;background:#f3f1f8;overflow:hidden}
.stat .bar i{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--good);transition:width .3s,background .3s}
.stat .bar b{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.stat .v{font-variant-numeric:tabular-nums}
.stat.low .bar{animation:pulse .6s infinite alternate}
.stat.bonus .bar b{display:none}
@keyframes pulse{to{box-shadow:0 0 0 3px var(--bad)}}
#sideBtns{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:calc(118px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:7px;align-items:flex-end}
#wxCard{font-size:15px;flex-direction:row;gap:4px;padding:3px 8px}
.ib{position:relative;width:46px;height:46px;font-size:22px;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:0}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.badge{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;line-height:20px;border:2px solid var(--ink);font-family:var(--body)}
#placeBar{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:6px;max-width:560px;margin:0 auto;border-radius:18px}
.pb{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:800;border:3px solid var(--ink);border-radius:13px;padding:4px 2px;min-width:0;box-shadow:0 3px 0 var(--ink);white-space:nowrap;overflow:hidden}
.pb span{font-size:24px;line-height:1.1}
.pb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#toasts{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:calc(62px + env(safe-area-inset-right,0px));top:calc(112px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:40;max-width:560px}
.toast{font-family:var(--display);font-weight:800;font-size:16px;padding:6px 14px;animation:tin .25s ease-out;text-align:center}
@keyframes tin{from{transform:translateY(-10px) scale(.9);opacity:0}}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.fl{position:absolute;font-family:var(--display);font-weight:800;font-size:20px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke;white-space:nowrap;animation:flUp 1.6s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes flUp{to{margin-top:-70px;opacity:0}}
#bubble{position:absolute;padding:6px 12px;font-family:var(--display);font-weight:800;font-size:16px;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;z-index:25;max-width:80vw;overflow:hidden;text-overflow:ellipsis}
#bubble:after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink)}
#bJump{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);box-shadow:0 5px 0 var(--ink);font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
#bJump small{font-size:12px;font-weight:800}
#bJump:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#hint{position:absolute;left:50%;top:calc(170px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-weight:800;font-size:14px;padding:6px 12px;pointer-events:none;width:max-content;max-width:min(86vw,520px);text-align:center}
.menuGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.menuGrid .btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;padding:10px 6px}
.menuGrid .btn span{font-size:30px}
@media (min-width:900px){ #topBar{right:auto;width:560px} #sideBtns{top:calc(10px + env(safe-area-inset-top,0px))} }

/* Modal */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,42,76,.35);z-index:50;padding:calc(10px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-sizing:border-box}
.modal{width:min(760px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid var(--ink);font-family:var(--display);font-weight:800;font-size:24px}
.mhead .x{margin-left:auto}
.mbody{padding:14px;overflow:auto;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.card{border:3px solid var(--ink);border-radius:16px;padding:10px;background:var(--cream);display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.card .em{font-size:40px;line-height:1.1}
.card .nm{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1}
.card .ds{font-size:12px;font-weight:700;color:#5b5880;min-height:30px}
.card .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.card .btn{font-size:14px;padding:4px 10px;border-radius:12px}
.card.locked{opacity:.6}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{font-weight:800;border:3px solid var(--ink);border-radius:12px;padding:4px 12px;background:#fff;font-size:16px}
.tab.on{background:var(--sun)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:10px;border:2px solid var(--ink);background:#fff}

/* School */
.board{background:#2f6b4f;border:6px solid #a8743f;border-radius:16px;color:#fff;padding:16px;box-shadow:inset 0 0 0 3px #245a41}
.q{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.25;text-align:center;min-height:80px;display:flex;align-items:center;justify-content:center}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ans{font-size:22px;font-weight:800;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:12px 8px;box-shadow:0 4px 0 var(--ink)}
.ans.right{background:var(--mint)} .ans.wrong{background:#ff9d9d}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:block}
.dots i.ok{background:var(--mint)} .dots i.no{background:#ff7d7d} .dots i.cur{background:var(--sun)}
.subj{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}

/* Designer */
#designer{position:absolute;inset:0;pointer-events:none}
#designer > *{pointer-events:auto}
#dPanel{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(430px,48vw);display:flex;flex-direction:column;overflow:hidden}
#dPanel .mbody{flex:1}
.opt-title{font-family:var(--display);font-weight:800;font-size:17px;margin:10px 0 6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.o{border:3px solid var(--ink);border-radius:12px;background:#fff;font-weight:800;font-size:14px;padding:5px 10px;font-family:var(--body)}
.o.on{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);padding:0}
.sw.on{outline:3px solid var(--grape);outline-offset:2px}
#dTitle{position:absolute;left:max(18px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,52px);line-height:.95;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke;text-shadow:0 5px 0 var(--ink)}
#dTitle small{display:block;font-size:.42em;-webkit-text-stroke:1px var(--ink);text-shadow:0 2px 0 var(--ink);margin-top:6px}
#dBottom{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap}
input.name{font-family:var(--display);font-weight:800;font-size:22px;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
#persDesc{font-size:13px;font-weight:700;color:#5b5880;margin-top:4px}

/* Full screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:60;padding:16px;box-sizing:border-box}
.screen h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,64px);margin:0;line-height:1;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke;text-shadow:0 5px 0 var(--ink)}
.screen .sub{font-weight:800;font-size:18px;margin:10px 0 18px;color:#fff;text-shadow:0 2px 0 var(--ink)}
#sleepScr{background:linear-gradient(transparent 40%,rgba(20,18,60,.55));justify-content:flex-start;padding-top:calc(30px + env(safe-area-inset-top,0px));pointer-events:none}
#sleepScr .sticker{padding:12px 22px;pointer-events:auto}
#sleepCount{font-family:var(--display);font-weight:800;font-size:40px;font-variant-numeric:tabular-nums}
#mini{position:absolute;inset:0;z-index:55;background:#fff6e0;display:flex;flex-direction:column}
#miniTop{display:flex;align-items:center;gap:12px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));border-bottom:3px solid var(--ink);background:#fff;font-family:var(--display);font-weight:800;font-size:22px}
#miniTop .grow{flex:1}
#miniCanvas{flex:1;width:100%;display:block;touch-action:none}
#ctrlPad{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(110px + env(safe-area-inset-bottom,0px));display:none}
.homeMenu{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:calc(86px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px;max-width:640px;margin:0 auto}
.homeMenu .btn{font-size:15px;padding:6px 10px}
#hud:has(#homeMenu:not([hidden])) #bJump{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
@media (max-width:760px){
  .mhead{font-size:20px;padding:8px 10px}
  .mbody{padding:10px}
  .card .em{font-size:34px}
  #dPanel{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;top:44%;}
  #dBottom{bottom:auto;top:calc(110px + env(safe-area-inset-top,0px))}
  .q{font-size:22px} .ans{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>

<div id="errBox" hidden style="position:fixed;left:8px;bottom:8px;z-index:999;max-width:60%;background:#fff;border:3px solid #d33;border-radius:10px;padding:6px 10px;font:12px monospace;color:#900;white-space:pre-wrap"></div>

];

const PATTERNS = [{id:'plain',name:'Plain'},{id:'spots',name:'Spots'},{id:'stripes',name:'Stripes'},{id:'heart',name:'Heart belly'},{id:'star',name:'Star belly'},{id:'patch',name:'Eye patch'}];

const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pad = n => String(n).padStart(2,'0');

function migrate(o){
  const d = defaultSave(o.design);
  for (const k in d) if (o[k] === undefined) o[k] = d[k];
  for (const k in d.profile) if (o.profile[k] === undefined) o.profile[k] = 0;
  for (const k in d.c) if (o.c[k] === undefined) o.c[k] = 0;
  if (o.day){ const nd = newDayRecord(o.day.key); for (const k in nd) if (o.day[k] === undefined) o.day[k] = nd[k]; }
  return o;
}
function save(){ if(!S) return; try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function useSlotKeys(slot){ SAVE_KEY = 'pocketPalTown.v1.' + slot; }
function load(){
  try{ const t = localStorage.getItem(SAVE_KEY); if(t){ const o = JSON.parse(t); if(o && o.design) return migrate(o); } }catch(e){}
  return null;
}
function wipe(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

// ---- Real-time day: a new "game day" starts at 06:00 local time ----
function gameDayKey(d){ d = d || new Date(); const t = new Date(d.getTime() - 6*3600e3); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); }
function keyToNum(k){ const [y,m,d] = k.split('-').map(Number); return Date.UTC(y,m-1,d)/86400e3; }
function nextWake(){ const n = new Date(); const w = new Date(n); w.setHours(6,0,0,0); if (w <= n) w.setDate(w.getDate()+1); return w; }
function dayLimit(){ return (S.settings.minutes||5)*60 + (S.day && S.day.bonus || 0); }
function timeLeft(){ return Math.max(0, dayLimit() - S.day.used); }

function newDayRecord(key){
  return {key, used:0, bonus:0, jobs:shuffle(CHORES.map(c=>c.id)).slice(0,3), done:[], comp:false, sports:false, naps:0, junk:0, lessons:0, greeted:{}, weather:pickWeather(key), starsTaken:[], chest:false, acts:{}, placed:0, photos:0, trees:0, roomBonus:false};
}
// returns list of messages for the morning
function rollDays(){
  const key = gameDayKey();
  const msgs = [];
  if (!S.day){ S.day = newDayRecord(key); return msgs; }
  if (S.day.key === key) return msgs;
  const n = clamp(keyToNum(key) - keyToNum(S.day.key), 1, 7);
  for (let i=0;i<n;i++){
    for (const k in OVERNIGHT) S.stats[k] = clamp(S.stats[k] + OVERNIGHT[k], 0, 100);
  }
  if (n > 1) msgs.push(`You were away ${n} days — ${S.name} missed you!`);
  S.day = newDayRecord(key);
  S.c.days++;
  const allowance = 10;
  S.coins += allowance;
  msgs.push(`☀️ Good morning! Mama & Papa gave you ${allowance} 🪙 pocket money.`);
  return msgs;
}

// ---- Skills & modifiers ----
const has = id => S.skills.includes(id);
const hasEq = id => S.equip.includes(id) && !S.equipOff.includes(id);
function persMul(stat){
  const p = S.design.pers;
  if (p==='curious' && stat==='smart') return 1.2;
  if (p==='sporty' && stat==='motor') return 1.2;
  if (p==='friendly' && stat==='social') return 1.2;
  if (p==='foodie' && stat==='full') return 1.2;
  if (p==='cheerful' && stat==='fun') return 1.2;
  return 1;
}
function decayRate(k){
  let r = DECAY[k];
  if (k==='full' && hasEq('basket')) r *= 0.75;
  if (k==='energy' && hasEq('bottle')) r *= 0.8;
  if (k==='social' && has('magnet')) r *= 0.6;
  if (k==='fun' && S.design.pers==='cheerful') r *= 0.8;
  return r;
}
const PROFILE_OF = {smart:'brain', motor:'body', social:'heart'};
// change a stat; positive gains get personality bonus and feed the development profile
function gain(k, amt, silent){
  if (amt > 0) amt *= persMul(k);
  const before = S.stats[k];
  S.stats[k] = clamp(before + amt, 0, 100);
  const real = S.stats[k] - before;
  if (amt > 0 && PROFILE_OF[k]) S.profile[PROFILE_OF[k]] += amt;
  if (!silent && Math.abs(amt) >= 0.5){
    const st = STATS.find(s=>s.id===k);
    floatText((amt>0?'+':'')+Math.round(amt)+' '+st.ic, amt>0 ? null : '#ff9d9d');
  }
  return real;
}
function addCoins(n){ S.coins += n; floatText('+'+n+' 🪙','#ffe066'); sfx('coin'); }
function xpMul(){ let m = 1; if (S.stats.fun >= 70) m *= 1.2; if (S.day && S.day.weather==='rainbow') m *= 1.2; if (has('superstar')) m *= 1.25; return m; }
function addXP(n){
  n = Math.round(n * xpMul());
  if (n <= 0) return;
  S.xp += n;
  floatText('+'+n+' XP','#d6c6ff');
  checkGrowth();
}
function dominantForm(){
  let best = 'heart', v = -1;
  for (const k in S.profile) if (S.profile[k] > v){ v = S.profile[k]; best = k; }
  return best;
}
let growthQueue = [];
function checkGrowth(){
  while (S.stage < STAGES.length-1 && S.xp >= STAGES[S.stage+1].xp){
    S.stage++;
    const f = dominantForm();
    if (!S.forms.includes(f)) S.forms.push(f);
    const snapshot = Object.assign({}, S.profile);
    for (const k in S.profile) S.profile[k] = 0; // new growth period starts
    growthQueue.push({stage:S.stage, form:f, profile:snapshot});
  }
  checkSkills();
}
let skillQueue = [];
function checkSkills(){
  for (const sk of SKILLS){
    if (!S.skills.includes(sk.id) && sk.ok(S)){ S.skills.push(sk.id); skillQueue.push(sk); }
  }
}
function petTitle(){
  const st = STAGES[S.stage].name;
  if (!S.forms.length){ const sp = (SPECIES.find(s=>s.id===S.design.species)||SPECIES[0]).name; return sp.startsWith('Baby') && st==='Baby' ? sp : st + ' ' + sp; }
  return FORMS[S.forms[S.forms.length-1]].name + ' ' + st;
}

let AC = null, master = null, musicGain = null, musicTimer = null;
function audioInit(){
  if (AC) { if (AC.state==='suspended') AC.resume(); return; }
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.12; musicGain.connect(master);
    startMusic();
  }catch(e){ AC = null; }
}
function tone(f, t0, dur, type, vol, dest, slide){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0+dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol||0.3, t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0+dur+0.05);
}
function sfx(name){
  if (!AC || !S || !S.settings.sound) return;
  const t = AC.currentTime;
  switch(name){
    case 'pop': tone(600,t,0.12,'sine',0.35,null,1200); break;
    case 'tap': tone(880,t,0.06,'triangle',0.2); break;
    case 'coin': tone(988,t,0.08,'square',0.12); tone(1319,t+0.07,0.18,'square',0.12); break;
    case 'right': [523,659,784].forEach((f,i)=>tone(f,t+i*0.08,0.18,'triangle',0.3)); break;
    case 'wrong': tone(300,t,0.25,'sawtooth',0.12,null,180); break;
    case 'eat': for(let i=0;i<3;i++) tone(300+i*40,t+i*0.13,0.08,'square',0.1,null,200); break;
    case 'jump': tone(400,t,0.2,'sine',0.25,null,900); break;
    case 'level': [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,t+i*0.11,0.25,'triangle',0.3)); break;
    case 'step': tone(180+Math.random()*40,t,0.04,'triangle',0.05); break;
    case 'swish': tone(1500,t,0.15,'sawtooth',0.04,null,400); break;
    case 'water': for(let i=0;i<6;i++) tone(1200+Math.random()*900,t+i*0.06,0.05,'sine',0.08); break;
    case 'hi': tone(660,t,0.1,'sine',0.25); tone(880,t+0.1,0.16,'sine',0.25); break;

// cheerful looping tune (pentatonic), scheduled ahead
function startMusic(){
  if (!AC) return;
  const mel = [0,4,7,9,7,4,2,4, 0,2,4,7,9,12,9,7, 5,9,12,9,7,4,2,0, 2,4,7,4,2,0,-3,0];
  const bass = [0,0,5,5,-3,-3,7,7];
  const base = 392; let step = 0; let next = AC.currentTime + 0.1; const beat = 0.24;
  const f = n => base * Math.pow(2, n/12);
  clearInterval(musicTimer);
  musicTimer = setInterval(()=>{
    if (!AC) return;
    while (next < AC.currentTime + 0.5){
      if (S && S.settings.music && S.settings.sound && musicOn){
        const n = mel[step % mel.length];
        if (step % 8 !== 7) tone(f(n), next, beat*0.9, 'triangle', 0.22, musicGain);
        if (step % 4 === 0) tone(f(bass[(step/4|0) % bass.length]-24), next, beat*3.5, 'sine', 0.35, musicGain);
      }
      next += beat; step++;
    }
  }, 120);
}
let musicOn = true;

// ===================== QUIZ GENERATION =====================
function mcq(q, ans, wrongs){
  const opts = shuffle([String(ans), ...wrongs.map(String)].filter((v,i,a)=>a.indexOf(v)===i)).slice(0,4);
  if (!opts.includes(String(ans))) opts[0] = String(ans);
  return {q, a:String(ans), opts:shuffle(opts)};
}
function numWrongs(ans, spread){
  const s = new Set();
  let guard = 0;
  while (s.size < 3 && guard++ < 50){
    let w = ans + (Math.random()<0.5?-1:1) * ri(1, spread);
    if (w >= 0 && w !== ans) s.add(w);
  }
  while (s.size < 3) s.add(ans + s.size + 1);
  return [...s];
}
function mathQ(grade){
  const g = clamp(grade,2,5);
  const kinds = g===2 ? ['add','sub','times','money','compare','pattern']
             : g===3 ? ['add3','sub3','times','div','word','fraction','pattern']
             : ['mul2','divr','word2','fraction2','area','time24','factor'];
  const k = pick(kinds);
  let a,b,ans;
  switch(k){
    case 'add': a=ri(12,68); b=ri(9,31); ans=a+b; return mcq(`${a} + ${b} = ?`, ans, numWrongs(ans,10));
    case 'sub': a=ri(40,99); b=ri(11,a-5); ans=a-b; return mcq(`${a} − ${b} = ?`, ans, numWrongs(ans,10));
    case 'times': a=g===2?pick([2,5,10,3,4]):ri(2,9); b=ri(2,9); ans=a*b; return mcq(`${a} × ${b} = ?`, ans, numWrongs(ans,a));
    case 'money': a=ri(1,5); b=ri(1,4); ans=a*10+b*2; return mcq(`You have ${a} ten-dollar coins and ${b} two-dollar coins. How much?`, '$'+ans, numWrongs(ans,6).map(v=>'$'+v));
    case 'compare': a=ri(10,99); b=ri(10,99); if(a===b)b++; ans = a>b ? a : b; return mcq(`Which number is bigger: ${a} or ${b}?`, ans, [a+b===ans?a:Math.min(a,b), ans-10>0?ans-10:ans+20, ans+1]);
    case 'pattern': { a=ri(2,10); b=ri(1,20); const s=[b,b+a,b+2*a,b+3*a]; ans=b+4*a; return mcq(`What comes next? ${s.join(', ')}, ?`, ans, numWrongs(ans,a)); }
    case 'add3': a=ri(120,680); b=ri(105,310); ans=a+b; return mcq(`${a} + ${b} = ?`, ans, numWrongs(ans,20).concat([ans+100]).slice(0,3));
    case 'sub3': a=ri(400,999); b=ri(101,a-50); ans=a-b; return mcq(`${a} − ${b} = ?`, ans, numWrongs(ans,20));
    case 'div': b=ri(2,9); ans=ri(2,9); a=b*ans; return mcq(`${a} ÷ ${b} = ?`, ans, numWrongs(ans,3));
    case 'word': { const it=pick(['apples','stickers','sweets','pencils']); a=ri(3,8); b=ri(3,9); ans=a*b; return mcq(`There are ${a} bags with ${b} ${it} in each. How many ${it} altogether?`, ans, numWrongs(ans,b).concat([a+b]).slice(0,3)); }
    case 'fraction': { const fr = shuffle([[1,2],[1,3],[1,4],[1,5],[1,8]]).slice(0,2); const big = fr[0][1] < fr[1][1] ? fr[0] : fr[1]; return mcq(`Which is bigger: 1/${fr[0][1]} or 1/${fr[1][1]} of a pizza?`, '1/'+big[1], ['1/'+(big===fr[0]?fr[1][1]:fr[0][1]),'They are the same','0']); }
    case 'mul2': a=ri(12,99); b=ri(2,9); ans=a*b; return mcq(`${a} × ${b} = ?`, ans, numWrongs(ans,b*3));
    case 'divr': b=ri(3,9); a=ri(20,80); { const q=Math.floor(a/b), r=a%b; return mcq(`${a} ÷ ${b} = ? (with remainder)`, `${q} R${r}`, [`${q+1} R${r}`, `${q} R${(r+1)%b}`, `${Math.max(q-1,0)} R${r}`]); }
    case 'word2': { a=ri(3,9)*10; b=ri(2,6); ans=a*b; return mcq(`A book costs $${a}. How much do ${b} books cost?`, '$'+ans, numWrongs(ans,a/2|0).map(v=>'$'+v)); }
    case 'fraction2': { const d=pick([5,6,8,10]); a=ri(1,d-3); b=ri(1,d-a-1); return mcq(`${a}/${d} + ${b}/${d} = ?`, `${a+b}/${d}`, [`${a+b}/${d*2}`, `${a+b+1}/${d}`, `${Math.max(a+b-1,1)}/${d}`]); }
    case 'area': a=ri(3,12); b=ri(2,9); ans=a*b; return mcq(`A rectangle is ${a} cm long and ${b} cm wide. What is its area?`, ans+' cm²', [2*(a+b)+' cm²', (ans+a)+' cm²', (a+b)+' cm²']);
    case 'time24': { const h=ri(13,22), m=pick(['00','15','30','45']); return mcq(`${h}:${m} in the 24-hour clock is…`, `${h-12}:${m} p.m.`, [`${h-10}:${m} p.m.`, `${h-12}:${m} a.m.`, `${h}:${m} a.m.`]); }
    case 'factor': { const n=pick([12,18,20,24,30,36]); const f=pick([...Array(n).keys()].slice(2).filter(x=>n%x===0&&x<n)); const nf=[...Array(n).keys()].slice(2).filter(x=>n%x!==0); return mcq(`Which number is a factor of ${n}?`, f, shuffle(nf).slice(0,3)); }
  }
}
function bankQ(bank){ const [q,a,w] = pick(bank); return mcq(q, a, w); }
function makeLesson(subject, n, gradeBoost){
  const g = (S.settings.grade||3) + (gradeBoost||0);
  const out = []; const seen = new Set();
  let guard = 0;
  while (out.length < n && guard++ < 80){
    let q;
    if (subject==='math') q = mathQ(g);
    else if (subject==='english') q = bankQ(ENGLISH);
    else if (subject==='chinese') q = bankQ(CHINESE);
    else if (subject==='general') q = bankQ(GENERAL);
    else q = pick([()=>mathQ(g),()=>bankQ(ENGLISH),()=>bankQ(GENERAL),()=>bankQ(CHINESE)])();
    if (seen.has(q.q)) continue; seen.add(q.q);
    q.lang = (subject==='chinese' || /[一-鿿]/.test(q.q)) ? 'zh-HK' : 'en-GB';
    out.push(q);
  }
  return out;
}

let GRAD = null;
function gradMap(){
  if (GRAD) return GRAD;
  const d = new Uint8Array([155, 215, 255]);
  GRAD = new THREE.DataTexture(d, 3, 1, THREE.LuminanceFormat);
  GRAD.minFilter = GRAD.magFilter = THREE.NearestFilter; GRAD.generateMipmaps = false; GRAD.needsUpdate = true;
  return GRAD;
}
const MATS = {};
function toon(color, opts){
  const key = color + (opts ? JSON.stringify(opts) : '');
  if (MATS[key]) return MATS[key];
  const m = new THREE.MeshToonMaterial(Object.assign({color, gradientMap:gradMap()}, opts||{}));
  MATS[key] = m; return m;
}
const GEO = {};
function sphereGeo(seg){ seg = seg||24; return GEO['s'+seg] || (GEO['s'+seg] = new THREE.SphereGeometry(1, seg, Math.round(seg*0.75))); }
function ball(color, r, sx, sy, sz, seg){
  const m = new THREE.Mesh(sphereGeo(seg), toon(color));
  m.scale.set(r*(sx||1), r*(sy||1), r*(sz||1)); m.castShadow = true; return m;
}
function boxM(color, w,h,d){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), toon(color)); m.castShadow = true; m.receiveShadow = true; return m; }
function cyl(color, rt, rb, h, seg){ const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg||16), toon(color)); m.castShadow = true; return m; }
function cone(color, r, h, seg){ const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg||16), toon(color)); m.castShadow = true; return m; }
function torus(color, R, r, arc, seg){ const m = new THREE.Mesh(new THREE.TorusGeometry(R, r, 8, seg||20, arc||Math.PI*2), toon(color)); return m; }
function shapeMesh(shape, color, depth){
  const g = new THREE.ExtrudeGeometry(shape, {depth:depth||0.05, bevelEnabled:true, bevelThickness:0.02, bevelSize:0.02, bevelSegments:2});
  g.center(); const m = new THREE.Mesh(g, toon(color)); m.castShadow = true; return m;
}
function heartShape(s){
  s = s||1; const h = new THREE.Shape();
  h.moveTo(0, -0.5*s);
  h.bezierCurveTo(-0.1*s,-0.35*s, -0.55*s,-0.1*s, -0.55*s, 0.15*s);
  h.bezierCurveTo(-0.55*s,0.45*s, -0.15*s,0.55*s, 0, 0.3*s);
  h.bezierCurveTo(0.15*s,0.55*s, 0.55*s,0.45*s, 0.55*s,0.15*s);
  h.bezierCurveTo(0.55*s,-0.1*s, 0.1*s,-0.35*s, 0,-0.5*s);
  return h;
}
function starShape(s, pts){
  s = s||1; pts = pts||5; const sh = new THREE.Shape();
  for (let i=0;i<pts*2;i++){ const r = (i%2? 0.42:1)*s*0.5; const a = i/(pts*2)*Math.PI*2 + Math.PI/2; const x = Math.cos(a)*r, y = Math.sin(a)*r; i? sh.lineTo(x,y) : sh.moveTo(x,y); }
  sh.closePath(); return sh;
}
function boltShape(s){
  const sh = new THREE.Shape(); s = s||1;
  [[0.1,0.5],[-0.25,0],[0,0],[-0.1,-0.5],[0.25,0.05],[0,0.05]].forEach((p,i)=> i? sh.lineTo(p[0]*s,p[1]*s) : sh.moveTo(p[0]*s,p[1]*s));
  sh.closePath(); return sh;
}
function shade(hex, f){ const c = new THREE.Color(hex); const hsl={}; c.getHSL(hsl); c.setHSL(hsl.h, Math.min(1,hsl.s*1.05), clamp(hsl.l*f,0,1)); return '#'+c.getHexString(); }

// design: {species, color, belly, pattern, eyes, mouth, cheeks, pers, name}

function buildPet(design, o){
  o = o || {};

  const C = design.color, B = design.belly || shade(C, 1.18), D = shade(C, 0.72);

  const body = ball(C, bodyR, 1.05*foodieBelly*sporty, isBlob?0.88:0.95*bodyY, 0.95*foodieBelly, 28);
  const bodyH = bodyR*(isBlob?0.88:0.95*bodyY);
  body.position.y = bodyH + 0.12;
  rig.add(body); P.body = body;
  // belly patch

    const bel = ball(B, bodyR*0.7, 1, isBlob?0.7:0.85*bodyY/1, 0.5);
    bel.position.set(0, body.position.y - bodyH*0.15, bodyR*0.62*foodieBelly);
    if (isBlob) bel.position.set(0, body.position.y - bodyH*0.35, bodyR*0.66);

  // head

      if (style==='starry'){
        const st = shapeMesh(starShape(0.11), '#ffe066', 0.02); st.position.set(0.02,0.03,big*0.45); g.add(st);
      } else {
        const h1 = ball('#ffffff', big*0.36, 1,1,0.5, 10); h1.position.set(big*0.32, big*0.38, big*0.4); g.add(h1);
        const h2 = ball('#ffffff', big*0.18, 1,1,0.5, 8); h2.position.set(-big*0.3, -big*0.3, big*0.42); g.add(h2);
      }
    }
    const ang = side*0.38;
    g.position.set(side*eyeX, eyeY, surfZ(side*eyeX, eyeY) - 0.015);
    g.rotation.y = side*0.3;
    headG.add(g); P.eyes.push(g);
    return g;
  };
  const es = design.eyes;
  mkEye(es==='wink'?'sparkle':es, -1);
  mkEye(es==='wink'?'happy':es, 1);
  if (design.pattern==='patch'){
    const pt = ball(D, 0.2, 1, 1.1, 0.35); pt.position.set(eyeX, eyeY, surfZ(eyeX, eyeY) - 0.05); pt.rotation.y=0.3; headG.add(pt);
  }

  const ms = design.mouth;

    const a = torus('#2b2a4c', 0.05, 0.016, Math.PI, 10); a.rotation.z = Math.PI; a.position.x=-0.05; mouth.add(a);

  const top = isBlob ? hr*0.86 : hr*0.92;
  if (sp==='bunny'){
    [-1,1].forEach(s=>{ const e = new THREE.Group(); const o1 = ball(C,0.16,1,3.2*earScale,0.65); o1.position.y = 0.42*earScale; e.add(o1);
      const i1 = ball(design.belly==='none'?'#ffc4dc':B,0.1,1,2.6*earScale,0.4); i1.position.set(0,0.42*earScale,0.07); e.add(i1);

    [-1,1].forEach(s=>{ const e = new THREE.Group(); const o1 = cone(C,0.2*earScale,0.36*earScale,12); o1.position.y=0.12; e.add(o1);

    [-1,1].forEach(s=>{ const e = new THREE.Group(); const o1 = ball(D,0.2,0.75,1.5*earScale,0.45); o1.position.y=-0.22*earScale; e.add(o1);
      e.position.set(s*hr*0.95, top*0.5, -0.02); e.rotation.z = s*0.35; headG.add(e); P.ears.push(e); });
  } else if (sp==='bear' || sp==='mochi'){

      e.position.set(s*hr*(sp==='bear'?0.62:0.5), top*(sp==='bear'?0.78:0.82), 0); headG.add(e); P.ears.push(e); });
  } else if (sp==='dino'){
    for (let i=0;i<5;i++){ const c2 = cone(design.belly==='none'?shade(C,0.8):B, 0.11, 0.24, 6); const a = -0.3 + i*0.45;
      c2.position.set(0, Math.cos(a)*hr*0.98, -Math.sin(a)*hr*0.98); c2.rotation.x = -a; headG.add(c2); }
    [-1,1].forEach(s=>{ const nb = ball(shade(C,0.9),0.035,1,1,1); nb.position.set(s*0.06, eyeY-hr*0.15, faceZ*1.0); headG.add(nb); });
  } else if (sp==='chick'){
    for (let i=0;i<3;i++){ const f = ball(C,0.08,0.6,1.8,0.6); f.position.set((i-1)*0.07, top+0.08, 0.05); f.rotation.z=(i-1)*-0.5; headG.add(f); P.ears.push(f);}
  } else if (sp==='sprout'){
    [-1,1].forEach(s=>{ const e = new THREE.Group(); const st = cyl('#6c6c9a',0.018,0.018,0.42*earScale,6); st.position.y=0.2*earScale; e.add(st);
      const tip = ball(s<0?'#ffe066':'#ff8fc7',0.08,1,1,1); tip.position.y=0.44*earScale; e.add(tip);

    const lf = new THREE.Group(); [-1,1].forEach(s=>{ const l = ball('#5fd46a',0.12,1.4,0.35,0.7); l.position.set(s*0.12,0.06,0); l.rotation.z = s*0.5; lf.add(l); });
    lf.position.set(0, top+0.02, 0); headG.add(lf);
  }

  // patterns
  if (design.pattern==='spots'){
    const pts = [[0.5,0.55,0.55],[-0.6,0.4,0.5],[0.15,0.8,-0.5],[-0.3,0.2,-0.9],[0.8,-0.1,-0.4]];
    pts.forEach(p=>{ const v = new THREE.Vector3(...p).normalize(); const sp2 = ball(D,0.13,1,1,0.4); sp2.position.copy(v.clone().multiplyScalar(hr*0.97)); sp2.lookAt(v.clone().multiplyScalar(5)); headG.add(sp2); });
  } else if (design.pattern==='stripes'){
    [-0.32,0,0.32].forEach(x=>{ const v = new THREE.Vector3(x,0.95,-0.05).normalize(); const st = ball(D,0.07,1,0.5,4); st.position.copy(v.clone().multiplyScalar(hr*0.96)); st.lookAt(v.clone().multiplyScalar(5)); headG.add(st); });
  } else if (design.pattern==='heart' || design.pattern==='star'){

    if (isBlob) m.rotation.x = -0.35;

  }
  // arms (wings for chick)
  P.arms = [];
  [-1,1].forEach(s=>{
    const a = new THREE.Group();
    const m = sp==='chick' ? ball(C,0.18,0.45,1,0.8) : ball(C, isBlob?0.14:0.15, 0.9, 1.2, 0.9);
    m.position.y = -0.1; a.add(m);
    const ax = isBlob ? bodyR*0.98 : bodyR*1.0*foodieBelly;
    a.position.set(s*ax, isBlob ? body.position.y-0.15 : body.position.y + bodyH*0.25, 0.05);

  });
  // feet
  P.feet = [];
  const fcol = sp==='chick' ? '#ff9f2e' : D;
  [-1,1].forEach(s=>{ const f = ball(fcol, 0.2, 1, 0.6, 1.25); f.position.set(s*0.26, 0.11, 0.06); rig.add(f); P.feet.push(f); });
  // tails
  if (sp==='kitty' || sp==='dino' || sp==='puppy' || sp==='bear' || sp==='bunny'){
    const tail = new THREE.Group();
    if (sp==='kitty'){ for(let i=0;i<6;i++){ const t = ball(i>3?D:C,0.07,1,1,1); t.position.set(0, i*0.09, -i*0.05 - Math.sin(i*0.6)*0.04); tail.add(t);} }
    else if (sp==='dino'){ const t = cone(C,0.2,0.6,12); t.rotation.x = -Math.PI/2.4; t.position.set(0,0.05,-0.2); tail.add(t); }
    else { tail.add(ball(sp==='bunny'?'#ffffff':C, sp==='bunny'?0.15:0.1, 1,1,1)); }
    tail.position.set(0, body.position.y - bodyH*0.35, -bodyR*0.92);
    rig.add(tail); P.tail = tail;
  }
  // stage extras: hair tuft from Kid stage
  if (!o.adult && stage >= 2 && sp!=='chick' && sp!=='sprout'){
    for (let i=0;i<3;i++){ const t = ball(shade(C,0.9),0.08,0.7,1.5,0.7); t.position.set((i-1)*0.07, top+0.05, hr*0.15); t.rotation.z = (i-1)*-0.45; headG.add(t); }
  }
  if (!o.adult && stage >= 4){
    const sw = cone(shade(C,0.85),0.12,0.4,10); sw.position.set(0.12, top+0.1, hr*0.25); sw.rotation.set(0.6,0,-0.9); headG.add(sw);
  }
  // FORM FEATURES (development profile)
  const slots = Object.assign({}, o.worn||{});
  if (forms.includes('brain')){
    if (!slots.face) slots.face = 'glasses_form';
    const ant = new THREE.Group(); const st = cyl('#6c6c9a',0.02,0.02,0.35,6); st.position.y = 0.17; ant.add(st);
    const s2 = shapeMesh(starShape(0.26), '#ffd84d', 0.05); s2.position.y = 0.4; ant.add(s2); P.spinner = s2;
    ant.position.set(-hr*0.25, top-0.02, 0); ant.rotation.z = 0.25; headG.add(ant);
  }
  if (forms.includes('heart')){
    const ant = new THREE.Group(); const st = cyl('#6c6c9a',0.02,0.02,0.32,6); st.position.y = 0.16; ant.add(st);
    const h2 = shapeMesh(heartShape(0.28), '#ff5c8a', 0.05); h2.position.y = 0.36; ant.add(h2); P.heartAnt = h2;
    ant.position.set(hr*0.25, top-0.02, 0); ant.rotation.z = -0.25; headG.add(ant);
  }
  if (forms.includes('body')){
    const hb = torus('#ff5a5a', hr*0.98, 0.05, Math.PI*2, 28); hb.rotation.x = Math.PI/2; hb.position.y = hr*0.38; hb.scale.set(1.08,1,1); headG.add(hb);
    const bolt = shapeMesh(boltShape(0.42), '#ffd84d', 0.04); bolt.position.set(-bodyR*0.45, body.position.y+bodyH*0.2, bodyR*0.86); rig.add(bolt);
  }
  if (forms.includes('helper')){
    if (!slots.neck){ const bd = cone('#4fa3ff', 0.32, 0.32, 3); bd.rotation.set(Math.PI/2+0.2, 0, Math.PI); bd.scale.set(1,1,0.25); bd.position.set(0, headY-hr*0.78, bodyR*0.55); rig.add(bd); }
    const ap = boxM('#fff3a8', bodyR*1.1, bodyH*0.9, 0.04); ap.position.set(0, body.position.y-bodyH*0.2, bodyR*0.92*foodieBelly); rig.add(ap);
    const pk = boxM('#ff9f5a', 0.22, 0.14, 0.03); pk.position.set(0, body.position.y-bodyH*0.35, bodyR*0.95*foodieBelly); rig.add(pk);
  }
  if (forms.includes('foodie')){
    const lf = new THREE.Group(); const stem = cyl('#8a5a2b',0.025,0.025,0.16,6); stem.position.y=0.08; lf.add(stem);
    const leaf = ball('#5fd46a',0.12,1.5,0.3,0.7); leaf.position.set(0.1,0.15,0); leaf.rotation.z=-0.5; lf.add(leaf);
    lf.position.set(0.05, top+0.02, -0.05); headG.add(lf);
  }
  if (forms.includes('art')){
    const br = new THREE.Group(); const cap = ball('#ff5c8a', hr*0.62, 1.15, 0.38, 1.1); br.add(cap); const nub = ball('#ff5c8a', 0.06); nub.position.y = hr*0.25; br.add(nub);
    br.position.set(-hr*0.12, top-0.02, -0.02); br.rotation.z = 0.35; headG.add(br);
    ['#ffd84d','#4f8dff','#6fe3b5'].forEach((c,i)=>{ const d = ball(c, 0.07, 1, 1, 0.4); const a = -0.6 + i*0.55; d.position.set(Math.sin(a)*bodyR*0.95, body.position.y + (i-1)*0.18, Math.cos(a)*bodyR*0.92); d.lookAt(d.position.clone().multiplyScalar(3)); rig.add(d); });
  }
  if (!o.adult && stage >= 5){
    const halo = new THREE.Group();
    for (let i=0;i<5;i++){ const s3 = shapeMesh(starShape(0.18), '#ffe066', 0.03); const a = i/5*Math.PI*2; s3.position.set(Math.cos(a)*0.55, 0, Math.sin(a)*0.55); halo.add(s3); }
    halo.position.y = top + 0.55; headG.add(halo); P.halo = halo;
  }

  // WEARABLES
  const H = top;
  const addHead = id => {
    const g = new THREE.Group(); g.position.y = H - 0.04; headG.add(g);
    if (id==='party'){ const c1 = cone('#ff5c8a',0.22,0.5,16); c1.position.y=0.25; g.add(c1); const pp = ball('#ffe066',0.07); pp.position.y=0.52; g.add(pp);
      for (let i=0;i<3;i++){ const d = ball('#7fd3ff',0.035); d.position.set(Math.cos(i*2)*0.14, 0.12+i*0.1, Math.sin(i*2)*0.14*(1-i*0.25)+0.04); g.add(d);} g.rotation.z = 0.15; }
    else if (id==='bow'){ [-1,1].forEach(s=>{ const b = ball('#ff5c8a',0.15,1.2,0.8,0.5); b.position.set(s*0.14,0.05,0); b.rotation.z = s*0.4; g.add(b); }); const k = ball('#ff2f6d',0.07); k.position.y=0.05; g.add(k); g.position.x = hr*0.35; g.rotation.z = -0.4; }
    else if (id==='cap'){ const c1 = ball('#4f8dff', hr*0.78, 1.1, 0.55, 1.1); c1.position.y = -0.02; g.add(c1); const v = cyl('#4f8dff', hr*0.5, hr*0.5, 0.04, 20); v.scale.set(1,1,0.7); v.position.set(0,-0.04,hr*0.62); g.add(v); const bt = ball('#ffffff',0.05); bt.position.y = hr*0.4; g.add(bt); }
    else if (id==='flower'){ const r = torus('#5fd46a', hr*0.62, 0.04, Math.PI*2, 24); r.rotation.x = Math.PI/2; g.add(r); ['#ff8fc7','#ffe066','#ffffff','#b18cff','#ff9f5a','#7fd3ff'].forEach((c,i)=>{ const a=i/6*Math.PI*2; const f = ball(c,0.08); f.position.set(Math.cos(a)*hr*0.62, 0.03, Math.sin(a)*hr*0.62); g.add(f); }); }
    else if (id==='chef'){ const c1 = cyl('#ffffff',0.26,0.24,0.28,20); c1.position.y=0.1; g.add(c1); [[0,0.32,0],[0.15,0.28,0],[-0.15,0.28,0],[0,0.28,0.13],[0,0.28,-0.13]].forEach(p=>{ const b=ball('#ffffff',0.17); b.position.set(...p); g.add(b); }); }
    else if (id==='witch'){ const br = cyl('#7b4fd6',0.48,0.48,0.03,24); g.add(br); const c1 = cone('#7b4fd6',0.26,0.6,16); c1.position.y=0.3; c1.rotation.z=0.25; g.add(c1); const s1 = shapeMesh(starShape(0.18),'#ffe066',0.02); s1.position.set(0.02,0.2,0.2); g.add(s1); }
    else if (id==='propeller'){ const c1 = ball('#ff5a5a', hr*0.6, 1, 0.5, 1); g.add(c1); const st = cyl('#444466',0.02,0.02,0.18,6); st.position.y=0.12; g.add(st);
      const pr = new THREE.Group(); ['#ffd84d','#4f8dff'].forEach((c,i)=>{ const b = boxM(c,0.5,0.02,0.08); b.rotation.y = i*Math.PI/2; pr.add(b); }); pr.position.y=0.22; g.add(pr); P.propeller = pr; }
    else if (id==='crown'){ const c1 = cyl('#ffcc33',0.28,0.28,0.18,16,true); c1.position.y=0.05; g.add(c1); for(let i=0;i<5;i++){ const a=i/5*Math.PI*2; const sp3 = cone('#ffcc33',0.06,0.16,6); sp3.position.set(Math.cos(a)*0.26,0.2,Math.sin(a)*0.26); g.add(sp3); const gm = ball(['#ff5a5a','#4f8dff','#5fd46a'][i%3],0.04); gm.position.set(Math.cos(a)*0.29,0.06,Math.sin(a)*0.29); g.add(gm);} }
  };
  const addFace = id => {
    const g = new THREE.Group(); g.position.set(0, eyeY, surfZ(0, eyeY) + 0.08); headG.add(g);
    if (id==='glasses' || id==='glasses_form'){ [-1,1].forEach(s=>{ const r = torus(id==='glasses'?'#ff5c8a':'#2b2a4c', 0.14, 0.022, Math.PI*2, 20); r.position.x = s*eyeX; g.add(r); }); const br = boxM('#2b2a4c', eyeX*0.9, 0.025, 0.025); g.add(br); }
    else if (id==='shades'){ [-1,1].forEach(s=>{ const r = ball('#1d1d2e',0.15,1.25,0.85,0.25); r.position.x = s*eyeX; g.add(r); }); const br = boxM('#1d1d2e', eyeX, 0.03, 0.03); br.position.y=0.04; g.add(br); }
    else if (id==='stache'){ g.position.y = mouthY + 0.08; [-1,1].forEach(s=>{ const m = ball('#6b3f22',0.12,1.4,0.5,0.5); m.position.x = s*0.11; m.rotation.z = s*-0.3; g.add(m); }); }
  };
  const addNeck = id => {
    const ny = isBlob ? body.position.y - 0.45 : headY - hr*0.8;
    const g = new THREE.Group(); g.position.y = ny; rig.add(g);
    if (id==='scarf'){ const t = torus('#ff5a5a', isBlob?0.75:0.42, 0.09, Math.PI*2, 20); t.rotation.x = Math.PI/2; g.add(t); const tl = boxM('#ff5a5a',0.16,0.4,0.06); tl.position.set(0.2,-0.2,isBlob?0.72:0.42); tl.rotation.z=0.15; g.add(tl); }
    else if (id==='bowtie'){ [-1,1].forEach(s=>{ const c1 = cone('#4f8dff',0.1,0.18,4); c1.rotation.z = s*Math.PI/2; c1.position.x = s*0.09; g.add(c1); }); const k = ball('#2b62d9',0.05); g.add(k); g.position.z = isBlob ? 0.82 : bodyR*0.62; }
  };
  const addBack = id => {
    const g = new THREE.Group(); g.position.set(0, body.position.y + (isBlob? -0.1 : bodyH*0.1), -bodyR*0.9); rig.add(g);
    if (id==='backpack'){ const b = boxM('#ff9f5a',0.6,0.6,0.3); b.position.z = -0.1; g.add(b); const pk = boxM('#ffd84d',0.4,0.22,0.08); pk.position.set(0,-0.12,-0.28); g.add(pk); }
    else if (id==='cape'){ const cr = isBlob ? 1.0 : bodyR*1.05; const geo = new THREE.CylinderGeometry(cr*0.8, cr*1.25, isBlob?1.3:bodyH*2.1, 18, 1, true, Math.PI*0.62, Math.PI*0.76); geo.translate(0, -(isBlob?0.65:bodyH*1.05), 0); const m = new THREE.Mesh(geo, toon('#ff3b5c',{side:THREE.DoubleSide})); m.position.set(0, isBlob?0.55:bodyH*0.9, bodyR*0.9); m.castShadow=true; g.add(m); P.cape = m; }
    else if (id==='shell'){ const s4 = ball('#5fd46a',0.6,1,1,0.55); g.add(s4); for(let i=0;i<5;i++){ const a=i/5*Math.PI*2; const p = ball('#3aa64a',0.13,1,1,0.4); p.position.set(Math.cos(a)*0.3, Math.sin(a)*0.3, -0.3); g.add(p);} }
    else if (id==='wings'){ [-1,1].forEach(s=>{ const w = ball('#ffffff',0.32,1.4,0.9,0.25); w.position.set(s*0.35,0.15,-0.05); w.rotation.set(0, s*0.5, s*0.4); g.add(w); P['wing'+s]=w; }); }
  };
  if (slots.head) addHead(slots.head);
  if (slots.face) addFace(slots.face);
  if (slots.neck) addNeck(slots.neck);
  if (slots.back) addBack(slots.back);
  if (o.extra === 'papa'){ addNeck('bowtie'); }
  if (o.extra === 'mama'){ addHead('flower'); }

  // skateboard (shown while walking)
  if (o.equip && o.equip.includes('skateboard')){
    const sb = new THREE.Group(); const deck = boxM('#ff5c8a',0.5,0.06,1.2); sb.add(deck);
    [[-0.2,0.4],[0.2,0.4],[-0.2,-0.4],[0.2,-0.4]].forEach(p=>{ const w = cyl('#ffd84d',0.07,0.07,0.06,10); w.rotation.z = Math.PI/2; w.position.set(p[0],-0.08,p[1]); sb.add(w); });
    sb.position.y = 0.12; sb.visible = false; root.add(sb); P.skate = sb;
  }
  root.scale.setScalar(scl);
  P.height = (headY + hr + 0.3) * scl;
  P.scale = scl;
  P.blink = 2 + Math.random()*3;
  P.mode = 'idle'; P.t = Math.random()*10;
  return P;
}

// animate a pet rig. mode: idle | walk | happy | sleep | eat | work | sad | ride
function animatePet(P, dt, mode){
  P.t += dt; const t = P.t;
  mode = mode || P.mode;
  const rig = P.rig;
  rig.position.set(0,0,0); rig.rotation.set(0,0,0); rig.scale.set(1,1,1);
  P.head.rotation.set(0,0,0);
  let armSwing = 0, footSwing = 0;
  if (mode==='walk'){
    const s = Math.sin(t*13);
    if (P.skate && P.skate.visible){ rig.position.y = 0.18; rig.rotation.z = Math.sin(t*3)*0.06; }
    else { rig.position.y = Math.abs(s)*0.16; rig.rotation.z = s*0.07; footSwing = s; armSwing = s; }
    P.head.rotation.z = -s*0.04;
  } else if (mode==='happy'){
    const j = Math.abs(Math.sin(t*7)); rig.position.y = j*0.7; rig.scale.set(1+(1-j)*0.08, 1-(1-j)*0.08, 1+(1-j)*0.08);
    armSwing = 1.4; P.arms.forEach((a,i)=>{ a.rotation.z = (i?1:-1)*(-1.8 + Math.sin(t*14)*0.3); });
  } else if (mode==='sleep'){
    rig.rotation.z = 1.35; rig.position.set(0.0, 0.35, 0); rig.scale.y = 1 + Math.sin(t*2)*0.03;
  } else if (mode==='eat'){
    P.head.rotation.x = Math.sin(t*16)*0.12; rig.scale.y = 1 + Math.sin(t*16)*0.03;
  } else if (mode==='work'){
    rig.rotation.y = Math.sin(t*9)*0.25; armSwing = Math.sin(t*12)*1.2; rig.position.y = Math.abs(Math.sin(t*9))*0.08;
  } else if (mode==='sad'){
    P.head.rotation.x = 0.25; rig.scale.y = 0.95;
  } else if (mode==='ride'){
    armSwing = 0; P.arms.forEach((a,i)=>{ a.rotation.z = (i?1:-1)*-2.4; });
  } else { // idle
    rig.scale.y = 1 + Math.sin(t*2.6)*0.025; rig.scale.x = rig.scale.z = 1 - Math.sin(t*2.6)*0.012;
    P.head.rotation.z = Math.sin(t*1.3)*0.05;
  }
  if (mode!=='happy' && mode!=='ride'){
    P.arms.forEach((a,i)=>{ const s = i?1:-1; a.rotation.z = s*-0.5 + (mode==='work'? s*-0.6:0); a.rotation.x = armSwing*(i?-0.6:0.6); });
  }
  P.feet.forEach((f,i)=>{ f.position.z = 0.06 + footSwing*(i?0.16:-0.16); f.position.y = 0.11 + Math.max(0, footSwing*(i?1:-1))*0.08; });

function petSpeed(){
  let s = 9;
  if (has('speedy')) s *= 1.3;
  if (hasEq('skateboard')) s *= 1.5;
  if (S.stats.energy < 60) s *= 0.8;
  if (world.inHome) s = 6;

}
function segClear(a, b){
  const d = a.distanceTo(b); const n = Math.ceil(d/0.8);
  for (let i=1;i<=n;i++){ const x = a.x+(b.x-a.x)*i/n, z = a.z+(b.z-a.z)*i/n; if (blocked(x,z,0.7)) return false; }
  return true;
}
function blocked(x,z,r){ for (const o of obstacles) if (x>o.minx-r && x<o.maxx+r && z>o.minz-r && z<o.maxz+r) return true; return false; }
function nearestRoad(p){
  let best = null;
  ROADS.forEach(v=>{
    const dx = Math.abs(p.x - v); if (!best || dx < best.d) best = {d:dx, type:'v', val:v, pt:new THREE.Vector3(v,0,clamp(p.z,-EDGE,EDGE))};
    const dz = Math.abs(p.z - v); if (dz < best.d) best = {d:dz, type:'h', val:v, pt:new THREE.Vector3(clamp(p.x,-EDGE,EDGE),0,v)};
  });
  return best;
}
function roadRoute(A, B){
  if (A.type===B.type && A.val===B.val) return [B.pt];
  if (A.type==='h' && B.type==='v') return [new THREE.Vector3(B.val,0,A.val), B.pt];
  if (A.type==='v' && B.type==='h') return [new THREE.Vector3(A.val,0,B.val), B.pt];
  if (A.type==='h'){ let bx = ROADS[0], bc = 1e9; ROADS.forEach(x=>{ const c = Math.abs(A.pt.x-x)+Math.abs(B.pt.x-x); if (c<bc){bc=c;bx=x;} }); return [new THREE.Vector3(bx,0,A.val), new THREE.Vector3(bx,0,B.val), B.pt]; }
  let bz = ROADS[0], bc = 1e9; ROADS.forEach(z=>{ const c = Math.abs(A.pt.z-z)+Math.abs(B.pt.z-z); if (c<bc){bc=c;bz=z;} }); return [new THREE.Vector3(A.val,0,bz), new THREE.Vector3(B.val,0,bz), B.pt];
}
function planPath(from, to, via){
  if (world.inHome) return [to.clone()];
  if (segClear(from, to)) return [to.clone()];
  const a = nearestRoad(from), b = nearestRoad(via || to);
  const path = [];
  if (!segClear(from, a.pt)){
    // step out of a block first: try going straight toward the road point anyway (push-out handles it)
  }
  path.push(a.pt);
  path.push(...roadRoute(a, b));
  if (via) path.push(via.clone());
  path.push(to.clone());
  // remove tiny/duplicate points
  return path.filter((p,i)=> i===0 || p.distanceTo(path[i-1]) > 0.3);
}
function walkTo(target, onArrive, via){

}

function updatePet(dt){
  if (!pet) return;
  const P = pet.P;
  let moving = false;
  if (!pet.busy && !world.edit){
    // keyboard
    const kx = (keys.ArrowRight||keys.d?1:0) - (keys.ArrowLeft||keys.a?1:0);
    const kz = (keys.ArrowDown||keys.s?1:0) - (keys.ArrowUp||keys.w?1:0);
    if (kx || kz){
      pet.path = []; pet.onArrive = null;
      const yaw = camState.yaw;
      const fx = -Math.sin(yaw), fz = -Math.cos(yaw); const rx = Math.cos(yaw), rz = -Math.sin(yaw);
      const mx = rx*kx + fx*-kz, mz = rz*kx + fz*-kz;
      const len = Math.hypot(mx,mz)||1;
      const sp = petSpeed()*dt;
      moveBy(mx/len*sp, mz/len*sp);
      pet.dir = Math.atan2(mx, mz); moving = true;
    }
  }
  if (pet.path.length){
    const tgt = pet.path[0];
    const dx = tgt.x - pet.pos.x, dz = tgt.z - pet.pos.z; const d = Math.hypot(dx,dz);
    const sp = petSpeed()*dt;
    if (d <= sp){ pet.pos.x = tgt.x; pet.pos.z = tgt.z; pet.path.shift(); pet.stuck = 0;
      if (!pet.path.length && pet.onArrive){ const f = pet.onArrive; pet.onArrive = null; f(); }
    } else {
      const before = pet.pos.clone();
      moveBy(dx/d*sp, dz/d*sp, true);
      pet.dir = Math.atan2(dx, dz); moving = true;
      if (before.distanceTo(pet.pos) < sp*0.3){ pet.stuck += dt; if (pet.stuck > 0.6){ pet.pos.x = tgt.x; pet.pos.z = tgt.z; pet.stuck = 0; } }
    }

  if (pet.jumpT > 0){ pet.jumpT -= dt; const k = clamp(1 - pet.jumpT/0.55, 0, 1); pet.jumpY = Math.sin(k*Math.PI)*1.9; if (pet.jumpT <= 0){ pet.jumpY = 0; burst(pet.pos.clone().setY(0.2),'dust',4); } }

  let cur = P.root.rotation.y; let diff = pet.dir - cur; while (diff > Math.PI) diff -= Math.PI*2; while (diff < -Math.PI) diff += Math.PI*2;
  P.root.rotation.y = cur + diff*Math.min(1, dt*10);
  if (P.skate) P.skate.visible = moving && !world.inHome;
  const mode = pet.anim || (moving ? 'walk' : (petSad() ? 'sad' : 'idle'));

}
function curRoom(){ if (world.room==='sib') return {o:HOME_C, W:BW, D:BD, floor:sibRoom.userData.floor, cam:new THREE.Vector3(0,12.5,15.5)}; return world.room==='bed' ? {o:HOME_B, W:BW, D:BD, floor:bedRoom.floor, cam:new THREE.Vector3(0,12.5,15.5)} : {o:HOME_O, W:homeObjs.W, D:homeObjs.D, floor:homeFloor, cam:new THREE.Vector3(0,13,17)}; }
function petSad(){ return CRITICAL.some(k=>S.stats[k] < 60); }
function moveBy(dx, dz, soft){
  let nx = pet.pos.x + dx, nz = pet.pos.z + dz;
  if (world.inHome){
    const R = curRoom();
    nx = clamp(nx, R.o.x - R.W/2 + 1, R.o.x + R.W/2 - 1);
    nz = clamp(nz, R.o.z - R.D/2 + 1.2, R.o.z + R.D/2 - 1);
    if (world.room==='bed'){ if (!roomBlocked(nx, pet.pos.z, 0.6)) pet.pos.x = nx; if (!roomBlocked(pet.pos.x, nz, 0.6)) pet.pos.z = nz; if (roomBlocked(pet.pos.x, pet.pos.z, 0.6) && soft){ pet.pos.x = nx; pet.pos.z = nz; } return; }
    pet.pos.x = nx; pet.pos.z = nz; return;
  }

}

function updateCars(dt){

    c.v = stop ? Math.max(0,(c.v||0) - dt*30) : Math.min(c.speed, (c.v||0) + dt*6);
    c.u += c.v*dt/len;

    if (kind==='heart') m = shapeMesh(heartShape(0.35), pick(['#ff5c8a','#ff8fc7']), 0.05);
    else if (kind==='star') m = shapeMesh(starShape(0.4), pick(['#ffd84d','#ffe066','#ffffff']), 0.05);
    else if (kind==='water') m = ball('#5cc8ff', 0.09);
    else if (kind==='dust') m = ball('#e0dce8', rnd(0.15,0.3));
    else if (kind==='bubble') m = ball('#d6f3ff', rnd(0.1,0.22));
    else m = boxM(pick(['#ff5c8a','#ffd84d','#7fd3ff','#6fe3b5','#b18cff']), 0.25, 0.25, 0.05);
    m.castShadow = false;

    particles.push({m, v, life: rnd(0.9,1.6), spin:new THREE.Vector3(rnd(-6,6),rnd(-6,6),rnd(-6,6)), g: kind==='heart'||kind==='bubble' ? -2 : 9});

}
function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.life -= dt;
    p.v.y -= p.g*dt; p.m.position.addScaledVector(p.v, dt);

  });

    if (ptrs.size===2){ const [a,b] = [...ptrs.values()]; const d = Math.hypot(a.x-b.x,a.y-b.y); if (pinch0){ camState.dist = clamp(camState.dist * pinch0/d, 9, 60); } pinch0 = d; return; }

  });

const ray = new THREE.Raycaster();
function onTap(x, y){
  if (world.mode==='design'){ if (designPet){ designPet.mode = 'happy'; sfx('jump'); setTimeout(()=>designPet && (designPet.mode='idle'), 900); } return; }
  if (world.mode!=='play' || !pet) return;
  const v = new THREE.Vector2(x/window.innerWidth*2-1, -(y/window.innerHeight)*2+1);
  ray.setFromCamera(v, camera);
  if (world.inHome){
    if (world.room==='bed'){ if (roomTap(ray, x, y)) return; }
    else if (choreTap(ray)) return;
    const ph2 = ray.intersectObject(pet.P.root, true);
    if (ph2.length){ petPoke(); return; }
    const hits = ray.intersectObject(curRoom().floor);
    if (hits.length && !pet.busy){ walkTo(hits[0].point.clone().setY(0)); tapMarker(hits[0].point); }
    return;
  }
  // tapping the pet itself
  const ph = ray.intersectObject(pet.P.root, true);
  if (ph.length){ petPoke(); return; }
  const hits = ray.intersectObjects(clickables, true);
  const fh = hits.find(h=>h.object.userData && h.object.userData.friend !== undefined);
  if (fh){ goFriend(fh.object.userData.friend); return; }
  for (const h of hits){
    let o = h.object; let ud = null, obj = null;
    while (o){ const u = o.userData; if (u && (u.place || u.friend !== undefined || u.tree || u.car || u.duck !== undefined || u.sibling || u.nb || u.garden)){ ud = u; obj = o; break; } o = o.parent; }
    if (!ud) continue;
    if (ud.friend !== undefined){ goFriend(ud.friend); return; }
    if (ud.tree){ shakeTree(obj); return; }
    if (ud.car){ honk(obj); return; }
    if (ud.duck !== undefined){ quack(); return; }
    if (ud.sibling){ openFamily(); return; }
    if (ud.nb){ goNeighbour(ud.nb); return; }
    if (ud.garden){ waterGarden(); return; }
    if (ud.place){ goPlace(ud.place); return; }
  }
  const g = ray.intersectObject(groundMesh);
  if (g.length && !pet.busy){ const p = g[0].point; p.y = 0; walkTo(p); tapMarker(p); }
}

    const tgt = world.edit ? new THREE.Vector3(R.o.x, 1, R.o.z) : new THREE.Vector3(R.o.x + (pet.pos.x-R.o.x)*0.35, 1.5, R.o.z + (pet.pos.z-R.o.z)*0.3);
    const want = tgt.clone().add((world.edit ? new THREE.Vector3(0, 17, 13.5) : R.cam).clone().multiplyScalar(camera.aspect < 1 ? 1.45 : 1));
    camera.position.lerp(want, Math.min(1, dt*4)); camState.target.lerp(tgt, Math.min(1, dt*4)); camera.lookAt(camState.target);
  } else {
    const tgt = pet.pos.clone().add(new THREE.Vector3(0, 1.5, 0));
    const cp = Math.cos(camState.pitch), spp = Math.sin(camState.pitch);
    const want = tgt.clone().add(new THREE.Vector3(Math.sin(camState.yaw)*cp*camState.dist, spp*camState.dist, Math.cos(camState.yaw)*cp*camState.dist));
    camera.position.lerp(want, Math.min(1, dt*5)); camState.target.lerp(tgt, Math.min(1, dt*6)); camera.lookAt(camState.target);
  }
  for (const id in placeInfo){ const l = placeInfo[id].label; if (l){ const d = l.position.distanceTo(camera.position); l.visible = !world.inHome && d > 14; } }
  // shadow follows pet
  const c = world.inHome ? curRoom().o : pet.pos;
  sun.position.set(c.x + 30, 60, c.z + 20); sun.target.position.set(c.x, 0, c.z);
  if (marker && marker.visible){ marker.userData.t -= dt; marker.scale.setScalar(1 + (0.8-marker.userData.t)); if (marker.userData.t < 0) marker.visible = false; }
}
function worldToScreen(v){
  const p = v.clone().project(camera);
  return {x:(p.x+1)/2*window.innerWidth, y:(1-p.y)/2*window.innerHeight, vis:p.z<1};
}

const PET_PHOTOS = (window.PET_PHOTOS || []);
let ALBUM = [];
let ALBUM_KEY = 'pocketPalTown.album';
function loadAlbum(){ try{ ALBUM = JSON.parse(localStorage.getItem(ALBUM_KEY) || '[]'); }catch(e){ ALBUM = []; } }
function saveAlbum(){ try{ localStorage.setItem(ALBUM_KEY, JSON.stringify(ALBUM)); }catch(e){ toast('Album is full — remove an old photo'); } }
function photoFrameDef(id){
  let src = null, name = 'Photo';
  if (id.startsWith('photo:')){ const p = PET_PHOTOS[+id.slice(6)]; if (!p) return null; src = p.data; name = p.name; }
  else if (id.startsWith('album:')){ const p = ALBUM.find(a=>a.id===id.slice(6)); if (!p) return null; src = p.data; name = 'My snapshot'; }
  else return null;
  return {id, cat:'photos', wall:true, name, em:'🖼️', price:0, cozy:2, fp:[2,0.2], build(){
    const g = GG(); put(g, boxM(pick(['#ff8fc7','#ffd84d','#7fd3ff','#ffffff']), 2.1, 1.6, 0.12));
    const tex = new THREE.TextureLoader().load(src, t=>{ const a = t.image.width/t.image.height, want = 1.85/1.35; if (a > want){ t.repeat.set(want/a,1); t.offset.set((1-want/a)/2,0); } else { t.repeat.set(1,a/want); t.offset.set(0,(1-a/want)/2); } t.needsUpdate = true; });
    put(g, texPlane(tex, 1.85, 1.35), 0, 0, 0.07); return g; }};
}
function decorDef(id){ return DECOR.find(d=>d.id===id) || photoFrameDef(id); }
function decorPrice(d){ return Math.round(d.price * (has('designer') ? 0.8 : 1)); }

// ---------- bedroom ----------
let bedRoom = null; // {root, floor, walls:[], wallMat, floorMat}
let roomItems = [];  // {rec, g}
function buildBedroom(){
  const g = GG(); g.position.copy(HOME_B); scene.add(g);
  const floorMat = toon('#ffffff'); const wallMat = new THREE.MeshToonMaterial({color:'#ffffff', gradientMap:gradMap()}); const floorM = new THREE.MeshToonMaterial({color:'#ffffff', gradientMap:gradMap()});
  const floor = new THREE.Mesh(new THREE.BoxGeometry(BW, 0.4, BD), floorM); floor.position.y = -0.2; floor.receiveShadow = true; g.add(floor);
  const back = new THREE.Mesh(new THREE.BoxGeometry(BW, WH, 0.4), wallMat); back.position.set(0, WH/2, -BD/2); back.receiveShadow = true; g.add(back);
  const left = new THREE.Mesh(new THREE.BoxGeometry(0.4, WH, BD), wallMat); left.position.set(-BW/2, WH/2, 0); left.receiveShadow = true; g.add(left);
  const right = new THREE.Mesh(new THREE.BoxGeometry(0.4, WH, BD), wallMat); right.position.set(BW/2, WH/2, 0); right.receiveShadow = true; g.add(right);
  // skirting & window & door
  [[0,-BD/2+0.25,BW,0.3],[-BW/2+0.25,0,0.3,BD],[BW/2-0.25,0,0.3,BD]].forEach(s=>{ const b = boxM('#ffffff', s[2], 0.5, s[3]); b.position.set(s[0], 0.25, s[1]); g.add(b); });
  const win = windowMesh(3.4, 2.6); win.position.set(4.5, 5.2, -BD/2+0.25); g.add(win); bedRoom = {root:g, floor, walls:[back,left,right], wallMat, floorM, win:win.children[1]};
  const door = boxM('#ff8fc7', 0.2, 3.6, 2.2); door.position.set(BW/2-0.15, 1.8, BD/2-2.2); g.add(door);
  const knob = ball('#ffd84d', 0.12); knob.position.set(BW/2-0.35, 1.8, BD/2-1.4); g.add(knob);
  const lt = new THREE.PointLight('#fff2d8', 0.15, 30); lt.position.set(0, 7, 2); g.add(lt); bedRoom.light = lt;
  const name = labelSprite(`${S.name}'s Room`, '#ffd84d', {fs:44, scale:0.7}); name.position.set(0, 7.0, -BD/2+0.4); g.add(name); bedRoom.nameLabel = name;
  applyStyles(); applyRoom();
}
function styleTex(id){ const s = STYLES.find(x=>x.id===id); const t = canvasTex(256,256,s.draw); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }
function applyStyles(){
  if (!bedRoom) return;
  const wt = styleTex(S.room.paper); wt.repeat.set(4, 2); bedRoom.wallMat.map = wt; bedRoom.wallMat.needsUpdate = true;
  const ft = styleTex(S.room.floor); ft.repeat.set(4, 3); bedRoom.floorM.map = ft; bedRoom.floorM.needsUpdate = true;
}
function fpOf(def, rot){ const q = Math.round(rot/(Math.PI/2)) % 2; return q ? [def.fp[1], def.fp[0]] : [def.fp[0], def.fp[1]]; }
function makeItemGroup(rec, origin){
  origin = origin || HOME_B;
  const def = decorDef(rec.id); if (!def) return null;
  const g = def.build();
  g.traverse(m=>{ if (m.isMesh){ m.castShadow = !def.flat; m.userData.roomItem = true; } });
  g.position.set(origin.x + rec.x, rec.y || 0, origin.z + rec.z); g.rotation.y = rec.rot || 0;
  g.userData.rec = rec; g.userData.def = def;
  return g;
}
function applyRoom(){
  if (!bedRoom) return;
  roomItems.forEach(r=>scene.remove(r.g)); roomItems = [];
  S.room.items.forEach(rec=>{ const g = makeItemGroup(rec); if (g){ scene.add(g); roomItems.push({rec, g}); } });
  if (bedRoom.nameLabel){ /* name may change only on new pet */ }
}
function cozyScore(){
  let s = 0; S.room.items.forEach(r=>{ const d = decorDef(r.id); if (d) s += d.cozy||1; });
  if (S.room.paper !== 'w_sky') s += 2; if (S.room.floor !== 'f_wood') s += 2;
  return s;
}
function cozyStars(){ return clamp(Math.floor(cozyScore()/5), 0, 5); }
function roomBlocked(x, z, r){
  for (const it of roomItems){ const d = it.g.userData.def; if (d.flat || d.wall || it.rec.y) continue; const f = fpOf(d, it.rec.rot||0); const cx = HOME_B.x + it.rec.x, cz = HOME_B.z + it.rec.z;
    if (x > cx-f[0]/2-r && x < cx+f[0]/2+r && z > cz-f[1]/2-r && z < cz+f[1]/2+r) return true; }
  return false;
}

  if (world.edit){
    if (placing){
      m.innerHTML = `<span style="font-weight:800;align-self:center">${placing.def.wall?'Tap a wall to move it':'Tap or drag on the floor to move it'}</span>
        <button class="btn white" data-a="rot">↻ Turn</button><button class="btn mint" data-a="ok" ${placing.valid?'':'disabled'}>✓ Put here</button><button class="btn white" data-a="cancel">✖ Cancel</button>`;
    } else if (editSel){
      m.innerHTML = `<span style="font-weight:800;align-self:center">${editSel.g.userData.def.em} ${editSel.g.userData.def.name}</span>
        <button class="btn sky" data-a="move">✋ Move</button><button class="btn white" data-a="rot2">↻ Turn</button><button class="btn tang" data-a="away">🎒 Put in bag</button><button class="btn mint" data-a="desel">✓ OK</button>`;
    } else {
      m.innerHTML = `<button class="btn grape" data-a="bag">🎒 My bag</button><button class="btn sky" data-a="style">🎨 Walls & floor</button><span style="font-weight:800;align-self:center">Tap something in the room to move it</span><button class="btn mint" data-a="done">✓ Done decorating</button>`;
    }
  } else {
    m.innerHTML = `<span class="pill" style="align-self:center;font-size:15px">${'⭐'.repeat(cozyStars())||'☆'} cosy</span>
      <button class="btn grape" data-a="decor">✏️ Decorate</button><button class="btn white" data-a="bag">🎒 My bag</button><button class="btn sky" data-a="nap">😴 Nap</button><button class="btn pink" data-a="living">🚪 Living room</button>`;
  }
  m.hidden = false;
  m.querySelectorAll('button').forEach(b=> b.onclick = ()=>{ audioInit(); if (modalOpen() || miniOpen()) return; roomAction(b.dataset.a); });
}
function roomAction(a){
  if (a==='decor'){ if (pet.busy) return; world.edit = true; pet.path = []; sfx('pop'); setHint('Decorating! Open your bag to place things, or tap an item to move it.'); setTimeout(()=>setHint(null), 3500); }
  else if (a==='done'){ world.edit = false; deselect(); cancelPlacing(); save(); sfx('right'); toast(`Room is ${'⭐'.repeat(cozyStars())||'☆'} cosy!`); }
  else if (a==='bag') openBag();
  else if (a==='style') openStyles();
  else if (a==='nap') napInRoom();
  else if (a==='living'){ if (pet.busy) return; world.edit = false; cancelPlacing(); deselect(); goLiving(); return; }
  else if (a==='rot' && placing){ placing.rec.rot = ((placing.rec.rot||0) + Math.PI/2) % (Math.PI*2); if (!placing.def.wall) placing.g.rotation.y = placing.rec.rot; validatePlacing(); sfx('tap'); }
  else if (a==='ok' && placing) confirmPlacing();
  else if (a==='cancel') cancelPlacing();
  else if (a==='move' && editSel){ const sel = editSel; deselect(); startPlacing(sel.rec.id, sel); }
  else if (a==='rot2' && editSel){ if (editSel.g.userData.def.wall) return; const r = editSel.rec; const old = r.rot||0; r.rot = (old + Math.PI/2) % (Math.PI*2); if (!placementOk(editSel.g.userData.def, r, editSel)) { r.rot = old; bubble("No room to turn it there!"); } editSel.g.rotation.y = r.rot; save(); sfx('tap'); }
  else if (a==='away' && editSel){ const sel = editSel; deselect(); S.room.items = S.room.items.filter(r=>r!==sel.rec); scene.remove(sel.g); roomItems = roomItems.filter(r=>r!==sel); S.bag[sel.rec.id] = (S.bag[sel.rec.id]||0) + 1; save(); sfx('pop'); }
  else if (a==='desel') deselect();
  roomUI();
}
function openBag(){
  const ids = Object.keys(S.bag).filter(k=>S.bag[k]>0);
  const html = ids.length ? `<p style="font-weight:800;margin-top:0">Tap a thing to place it in your room.</p><div class="grid">${ids.map(id=>{ const d = decorDef(id); if (!d) return ''; return `<button class="card" data-put="${id}" style="cursor:pointer"><img data-thumb="${id}" alt="" width="96" height="96" style="width:96px;height:96px"><div class="nm">${d.name} ×${S.bag[id]}</div><div class="ds">${actDesc(d)}</div></button>`; }).join('')}</div>`
    : `<p style="font-weight:800;font-size:18px;text-align:center">Your bag is empty! 🎒<br>Buy furniture, toys and wall decorations at the 🛍️ Sparkle Shop, find treasure chests in town, or take photos with 📸.</p>`;
  openModal('🎒 My bag', html);
  fillThumbs();
  $('mBody').querySelectorAll('[data-put]').forEach(b=> b.onclick = ()=>{ closeModal(); if (!world.edit){ world.edit = true; pet.path = []; } startPlacing(b.dataset.put, null); roomUI(); });
}
function actDesc(d){
  const A = {sleep:'Nap here for ⚡', rest:'Sit and rest (+⚡)', read:'Read books (+🧠)', piano:'Play music (+🧠 +🎈)', drum:'Bang the drums (+🎈 +🤸)', paint:'Paint a picture (+🎈, creative)', bounce:'Bounce! (+🤸 +🎈)', tv:'Watch cartoons (+🎈)', fish:'Feed the fish (+🎈)', stars:'Look at the stars (+🧠)', ride:'Ride it! (+🎈)', pit:'Jump in! (+🎈 +🤸)', slide:'Slide down (+🎈)', music:'Play a tune (+🎈)', globe:'Spin the world (+🧠)', hug:'Big hug (+💬 +🎈)', tent:'Hide and seek (+🎈)', play:'Pretend play (+🎈 +💬)', lamp:'Tap to switch on/off'};
  return (d.act ? A[d.act] : (d.wall ? 'Hangs on the wall' : d.flat ? 'Floor rug' : 'Decoration')) + ' · ' + '💗'.repeat(d.cozy||1);
}
function startPlacing(id, existing){
  const def = decorDef(id); if (!def) return;
  cancelPlacing();
  let rec, g;
  if (existing){ rec = existing.rec; g = existing.g; roomItems = roomItems.filter(r=>r!==existing); }
  else {
    if (!S.bag[id]) return;
    rec = def.wall ? {id, x:0, y:4.5, z:-BD/2+0.32, rot:0} : {id, x:0, z:1.5, rot:0};
    g = makeItemGroup(rec); scene.add(g);
  }
  const ring = torus('#3ccf7a', Math.max(def.fp[0], def.fp[1])*0.62, 0.08, Math.PI*2, 32); ring.rotation.x = Math.PI/2; scene.add(ring);
  placing = {def, rec, g, ring, existing:!!existing, orig: existing ? Object.assign({}, rec) : null, valid:true};
  if (!def.wall && !existing){ // find a free spot
    for (let i=0;i<40 && !placementOk(def, rec); i++){ rec.x = rnd(-BW/2+2, BW/2-2); rec.z = rnd(-BD/2+2, BD/2-2); }
    g.position.set(HOME_B.x+rec.x, 0, HOME_B.z+rec.z);
  }
  validatePlacing(); sfx('pop');
}
function placementOk(def, rec, ignore){
  if (def.wall) return true;
  const f = fpOf(def, rec.rot||0);
  if (rec.x - f[0]/2 < -BW/2+0.3 || rec.x + f[0]/2 > BW/2-0.3 || rec.z - f[1]/2 < -BD/2+0.3 || rec.z + f[1]/2 > BD/2-0.3) return false;
  if (def.flat) return true;
  for (const it of roomItems){ if (it===ignore) continue; const d = it.g.userData.def; if (d.flat || d.wall) continue; const g2 = fpOf(d, it.rec.rot||0);
    if (Math.abs(rec.x - it.rec.x) < (f[0]+g2[0])/2 - 0.05 && Math.abs(rec.z - it.rec.z) < (f[1]+g2[1])/2 - 0.05) return false; }
  return true;
}
function validatePlacing(){
  if (!placing) return;
  const p = placing; p.valid = placementOk(p.def, p.rec);
  p.ring.material = toon(p.valid ? '#3ccf7a' : '#ff5a5a');
  roomUI();
}
function placeAt(x, y){
  if (!placing) return;
  const v = new THREE.Vector2(x/window.innerWidth*2-1, -(y/window.innerHeight)*2+1);
  ray.setFromCamera(v, camera);
  const p = placing;
  if (p.def.wall){
    const hits = ray.intersectObjects(bedRoom.walls);
    if (!hits.length) return;
    const h = hits[0]; const n = h.face.normal.clone().transformDirection(h.object.matrixWorld);
    const lp = h.point.clone().sub(HOME_B);
    const half = p.def.fp[0]/2;
    if (Math.abs(n.z) > 0.5){ lp.x = clamp(lp.x, -BW/2+half+0.4, BW/2-half-0.4); lp.z = -BD/2+0.32; p.rec.rot = 0; }
    else { lp.z = clamp(lp.z, -BD/2+half+0.4, BD/2-half-0.4); lp.x = n.x > 0 ? -BW/2+0.32 : BW/2-0.32; p.rec.rot = n.x > 0 ? Math.PI/2 : -Math.PI/2; }
    lp.y = clamp(lp.y, 1.6, WH-1.4);
    p.rec.x = Math.round(lp.x*4)/4; p.rec.y = Math.round(lp.y*4)/4; p.rec.z = lp.z;
    p.g.position.set(HOME_B.x+p.rec.x, p.rec.y, HOME_B.z+p.rec.z); p.g.rotation.y = p.rec.rot;
  } else {
    const hits = ray.intersectObject(bedRoom.floor);
    if (!hits.length) return;
    const lp = hits[0].point.clone().sub(HOME_B);
    p.rec.x = Math.round(lp.x*2)/2; p.rec.z = Math.round(lp.z*2)/2;
    p.g.position.set(HOME_B.x+p.rec.x, 0, HOME_B.z+p.rec.z);
  }
  validatePlacing();
}
function confirmPlacing(){
  const p = placing; if (!p || !p.valid) return;
  scene.remove(p.ring);
  if (!p.existing){
    S.bag[p.rec.id]--; if (S.bag[p.rec.id] <= 0) delete S.bag[p.rec.id];
    S.room.items.push(p.rec);
    S.c.placed = (S.c.placed||0) + 1;
    if ((S.day.placed||0) < 10){ S.day.placed = (S.day.placed||0)+1; S.profile.art += 3; addXP(3); gain('fun', 2, true); }
    checkSkills();
  }
  const ent = {rec:p.rec, g:p.g}; roomItems.push(ent);
  const g = p.g; const by = g.position.y;
  tween(0.45, k=>{ const s = 1 + Math.sin(k*Math.PI)*0.25; g.scale.set(s, 2-s, s); g.position.y = by + Math.sin(k*Math.PI)*0.4; }, ()=>{ g.scale.set(1,1,1); g.position.y = by; });
  burst(g.position.clone().setY(by+0.5), 'star', 8); sfx('right');
  placing = null; save(); roomUI();
}
function cancelPlacing(){
  const p = placing; if (!p) return;
  scene.remove(p.ring);
  if (p.existing){ Object.assign(p.rec, p.orig); p.g.position.set(HOME_B.x+p.rec.x, p.rec.y||0, HOME_B.z+p.rec.z); p.g.rotation.y = p.rec.rot||0; roomItems.push({rec:p.rec, g:p.g}); }
  else scene.remove(p.g);
  placing = null;
}
function deselect(){ if (editSel){ editSel.g.position.y = editSel.rec.y || 0; if (editSel.ring) scene.remove(editSel.ring); } editSel = null; }
function itemAtRay(r){
  const hits = r.intersectObjects(roomItems.map(i=>i.g), true);
  if (!hits.length) return null;
  let o = hits[0].object; while (o && !o.userData.rec) o = o.parent;
  return o ? roomItems.find(i=>i.g===o) : null;
}
function roomTap(r, x, y){
  if (world.edit){
    if (placing){ placeAt(x, y); return true; }
    const it = itemAtRay(r);
    deselect();
    if (it){ editSel = it; const d = it.g.userData.def; const ring = torus('#ffd84d', Math.max(d.fp[0],d.fp[1])*0.6, 0.08, Math.PI*2, 32); ring.rotation.x = Math.PI/2; ring.position.set(it.g.position.x, (it.rec.y||0)+0.12, it.g.position.z); if (d.wall){ ring.rotation.set(0, it.rec.rot||0, 0); ring.position.copy(it.g.position); } scene.add(ring); it.ring = ring; sfx('tap'); }
    roomUI(); return true;
  }
  const it = itemAtRay(r);
  if (it && !pet.busy){ useItem(it); return true; }
  return false;
}
function updateRoomFx(dt, t){
  if (placing){ placing.ring.position.set(placing.g.position.x, (placing.def.wall ? placing.g.position.y : 0.12), placing.g.position.z); if (placing.def.wall) placing.ring.rotation.set(0, placing.rec.rot, 0); else placing.ring.rotation.set(Math.PI/2,0,0); if (!placing.def.wall) placing.g.position.y = 0.3 + Math.abs(Math.sin(t*4))*0.25; }
  if (editSel && !editSel.g.userData.def.wall) editSel.g.position.y = (editSel.rec.y||0) + 0.15 + Math.sin(t*5)*0.08;
  roomItems.forEach(it=>{ it.g.traverse(m=>{
    if (m.userData.fish !== undefined){ const i = m.userData.fish; m.position.x = Math.sin(t*(0.8+i*0.3)+i)*0.7; m.rotation.y = Math.cos(t*(0.8+i*0.3)+i) > 0 ? 0 : Math.PI; }
    if (m.userData.spin) m.rotation.y += dt*(it.spinFast ? 8 : 0.6);
    if (m.userData.hand){ const d = new Date(); m.rotation.z = -(m.userData.hand===1 ? (d.getHours()%12 + d.getMinutes()/60)/12 : d.getMinutes()/60)*Math.PI*2; }
    if (m.userData.screen && it.tvOn){ m.material.color.setHSL((t*0.7)%1, 0.7, 0.65); }
    if (m.userData.rock){ m.rotation.z = it.rocking ? Math.sin(t*5)*0.22 : m.rotation.z*0.9; }
  }); });
}
